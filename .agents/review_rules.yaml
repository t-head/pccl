rules:
  - category: "Collective Semantics"
    items:
      - "Do not introduce paths that cause ranks to enter collectives in different orders."
      - "Do not introduce conditional branches that cause some ranks, devices, or channels to skip collective participation."
      - "Collective metadata (count, datatype, op, root, communicator, and buffer role) must be semantically consistent across all participants."
      - "Do not change existing group begin/end, launch-order, or completion-order semantics unless the change explicitly documents the differences and adds tests."
      - "For in-place and out-of-place paths, explicitly check whether input and output buffers may alias or overlap."
      - "Do not introduce partial collective success or failure without converging to a consistent state."
      - "New collective APIs must follow the existing unified enqueue, argument-description, and validation patterns rather than introducing separate invocation paths."

  - category: "Deadlock and Hang Risks"
    items:
      - "Do not introduce lock-order inversions."
      - "Do not perform potentially blocking external calls, waits, callbacks, or cross-thread notifications while holding a lock."
      - "Do not introduce paths with inconsistent participants in barriers, fences, condition waits, or event waits."
      - "Every wait loop must have explicit progress, exit, or abort conditions."
      - "Do not rely on timeouts to guarantee correctness."
      - "Do not introduce state transitions that can cause circular waits among ranks, channels, streams, or threads."
      - "Device-side wait loops must retain the unified abort-check and exit patterns."

  - category: "Concurrency and Memory Ordering"
    items:
      - "Shared state and concurrent metadata (state publication, reference counts, completion/abort flags, queue heads and tails, credits, and slots) must follow unified atomic or locking conventions with appropriate memory ordering to avoid data races."
      - "Do not replace synchronization requiring acquire/release semantics with ordinary reads or writes."
      - "Do not publish objects, pointers, descriptors, or handles to other threads, streams, devices, or ranks before initialization is complete."
      - "Asynchronous paths must not continue accessing an object after its destruction begins."
      - "Asynchronous callbacks, completion notifications, and background threads must follow unified synchronization conventions when modifying shared state."
      - "Lazy initialization must use double-checked locking, atomic publication, or an equivalent safe pattern; unprotected first-time initialization is not allowed."
      - "Thread-local state may represent only strictly thread-private semantics and must not bypass cross-thread synchronization."

  - category: "Memory Safety and Lifetime"
    items:
      - "Do not introduce use-after-free."
      - "Do not introduce double frees, duplicate deregistration, or duplicate destruction."
      - "Buffers, communicators, transports, registrations, and descriptors referenced by asynchronous operations must remain alive through completion."
      - "Stack objects, local arrays, and temporary references must not escape into asynchronous execution paths."
      - "All size, offset, stride, and chunk-length calculations must prevent integer overflow and out-of-bounds access."
      - "Verify alignment and size assumptions for casts, pointer arithmetic, and structure layouts."
      - "Error paths must release allocated memory, handles, registrations, queues, threads, and events."
      - "Cleanup order must respect resource dependencies; do not release objects still used by dependent resources."
      - "New allocation paths should prefer existing unified allocation wrappers and must not bypass established debugging, accounting, alignment, or zero-initialization conventions."
      - "Allocation and deallocation interfaces must match; do not mix functions from different memory domains or backends."
      - "Define behavior for zero-length allocations, freeing null pointers, and cleanup after partial allocation failures."
      - "Explicitly verify size, layout, alignment, and lifetime assumptions for PPU-visible, DMA-visible, or interprocess shared data structures."

  - category: "Silent Data Corruption Risks"
    items:
      - "Do not introduce paths that can return incorrect data without reporting an error."
      - "Chunk partitioning, offset calculations, and remainder handling must not introduce off-by-one errors, duplicate coverage, or omitted segments."
      - "Datatype widths, signedness, and layout interpretations must agree across kernels, host code, and network messages."
      - "Before reusing scratch buffers, FIFO slots, credits, or temporary aggregation storage, verify that the previous use has completed and its completion is visible."
      - "Do not send, reduce, or copy uninitialized data regions, padding, or dirty temporary buffers."
      - "Changes involving reduce, reduce-scatter, or allreduce must preserve existing mathematical semantics, partitioning semantics, and ordering assumptions unless explicitly justified by design documentation and tests."

  - category: "Stream / Event / PPU Asynchronous Semantics"
    items:
      - "Preserve existing happens-before relationships on streams."
      - "Event recording and waiting must guarantee the required visibility and ordering."
      - "Do not introduce unnecessary device-wide, stream, or host synchronization on hot paths."
      - "Host objects must outlive submitted PPU work, DMA, and transport operations that have not yet completed."
      - "Graph capture/replay paths must not invoke capture-unsafe operations unless lack of support is explicitly documented."
      - "When changing kernel launch parameters, grid/block configurations, or step counts, verify boundary conditions, occupancy, and protocol step-count semantics."
      - "Do not assume peer access, IPC handles, or topology reachability are always available; retain checks or fallbacks."
      - "New device-memory, asynchronous, or platform-specific operations must preserve existing context switching, mode switching, and platform safeguards."

  - category: "Transport / Protocol Correctness"
    items:
      - "Do not change message layouts, state machines, or protocol-field meanings without handling version compatibility or negotiation."
      - "Queue heads and tails, credits, and slot reuse must strictly follow completion semantics; do not reuse resources prematurely."
      - "Producer/consumer index advancement, wraparound, and capacity checks must be correct."
      - "Handle short reads, short writes, segmented receives, and partial message arrival correctly."
      - "Retries, reconnects, and duplicate completion notifications must not cause duplicate sends, reductions, or state commits."
      - "Ring, tree, channel, and routing construction must not omit or duplicate ranks or produce inconsistent topology views."
      - "Do not use unspecified in-memory structure layouts directly as interprocess or internode protocol formats."

  - category: "Error Handling and Abort Propagation"
    items:
      - "Public PCCL APIs use pcclResult_t for operation status; internal code may use its ncclResult_t alias. Do not apply this requirement to functions returning data, pointers, or void."
      - "Match error checks to the called interface's return convention, using NCCLCHECK, HGGCCHECK, SYSCHECK, PTHREADCHECK, or an appropriate error-handling path."
      - "Do not ignore asynchronous error states or background-thread errors."
      - "System, driver, and runtime calls must use existing check macros or unified error handling according to their return conventions; do not ignore critical call or CHECK-macro return values."
      - "All error paths must use the unified error-code system; do not mix exceptions, assertion termination, and implicit failure."
      - "Wrap multi-statement error-handling macros in `do { ... } while(0)` or an equivalent construct."
      - "Record asynchronous errors in the unified asynchronous error state rather than only logging them."
      - "Fatal errors and abort states must propagate to all affected ranks, channels, streams, and communicators."
      - "Error paths must converge to a consistent state without exposing partially initialized, committed, or destroyed state."
      - "Cleanup failures must not hide the original cause; preserve the first error and add context when necessary."
      - "Error paths must propagate the required error or exit notifications so peers and other ranks do not wait indefinitely."
      - "If a failed step leaves the system unrecoverable, explicitly mark that state and prevent further progress."
      - "Prefer ERROR over WARN when aborting the process with an abnormal exit."

  - category: "Resource Cleanup"
    items:
      - "Resource cleanup must follow existing repository conventions; do not mix resource-management paradigms within the same core module."
      - "Error paths must cover partially successful initialization, allocation, and registration."
      - "Cleanup must occur in the correct order: stop access first, then unregister mappings and handles, and finally release memory or objects."

  - category: "Hot-Path Performance"
    items:
      - "Do not introduce dynamic allocation, registration/deregistration, or heavyweight initialization on per-collective, per-step, or per-chunk hot paths."
      - "Do not introduce additional copies, packing, unpacking, or host bounce buffers on hot paths."
      - "Do not serialize channels, ranks, or operations that could previously run in parallel."
      - "Do not introduce global locks, long lock-hold times, or highly contended shared counters on frequently executed paths."
      - "New synchronization, kernel launches, control messages, or polling must have explicit benefits and justification."
      - "Performance optimizations must preserve correctness, synchronization, visibility, completion, and error-handling semantics."
      - "Performance optimizations should prefer existing thread thresholds, protocol selection, batching, preallocation, or modeling mechanisms; do not introduce arbitrary local special cases that undermine the overall strategy."
      - "New optimization paths must document their applicability and degrade safely when their conditions are not met."

  - category: "ABI / API / Semantic Compatibility"
    items:
      - "Do not arbitrarily change exported symbols, public structure layouts, enum values, or callback signatures."
      - "Do not change public completion, ordering, thread-safety, or error-handling semantics without explanation."
      - "Behavior changes to configuration options, environment variables, or tuning parameters must preserve compatibility or include migration guidance."
      - "Changes to cross-version protocols, persistent metadata, or interprocess shared structures must account for compatibility."
      - "New public APIs must use existing export macros, visibility controls, and tracing/profiling wrappers rather than bypassing unified declarations."
      - "Do not break released public interfaces, plugin interfaces, or configuration structures in place; create a new version when extending them."
      - "Configuration options and environment variables must reuse the existing parameter system rather than introducing ad hoc private configuration parsers."

  - category: "Portability and Undefined Behavior"
    items:
      - "Do not rely on undefined behavior."
      - "Do not assume a particular compiler, CPU/PPU architecture, page size, or cache-coherence model."
      - "New hardware, device, driver, or runtime features and instruction paths must provide appropriate capability detection, conditional compilation, or safe fallbacks."
      - "Verify stable cross-platform semantics for strict aliasing, alignment, sign extension, integer truncation, and bit-level layouts."
      - "New platform-specific code must use existing platform abstractions or conditional-compilation frameworks rather than scattering platform logic across shared paths."
      - "Cross-platform paths must preserve consistent semantics; unsupported platforms must fail explicitly or provide a fallback."

  - category: "Device Code (Kernel) Design"
    items:
      - "Performance-critical device paths should prefer existing static specialization, template dispatch, protocol tags, or macro-generation mechanisms; do not add runtime dispatch overhead."
      - "New device code must not introduce virtual functions, dynamic allocation, or uncontrolled runtime polymorphism."
      - "Performance-critical device inner loops should remain unrollable, vectorizable, and statically analyzable; do not disrupt existing optimization patterns without justification."
      - "Pay close attention to uses of gridDim.x."
      - "Check for incorrect assumptions that gridDim.x is constant, contiguous, or a substitute for other dimension information."
      - "Verify gridDim.x usage in block partitioning, index calculations, boundary checks, and workload distribution."
      - "If logic depends on gridDim.x, verify that the dependency remains valid across launch configurations."

  - category: "Data Structure Design"
    items:
      - "Core runtime data structures should retain C-style design, explicit layouts, and explicit ownership; do not introduce unnecessary complex object semantics."
      - "Do not arbitrarily replace established intrusive lists, fixed-size arrays, or arena allocation with general-purpose containers that introduce ABI, layout, or performance uncertainty."
      - "Data structures used by protocols, callbacks, DMA, shared memory, or devices must retain verifiable member-layout and lifetime constraints."
      - "Sentinel values, special pointer values, and NULL must follow existing conventions, and callers must distinguish their meanings correctly."

  - category: "Graph and Topology Subsystems"
    items:
      - "Topology search, path construction, candidate ordering, and graph queries must remain deterministic and explainable; do not introduce implicit randomness or order dependence."
      - "Graph queries must distinguish 'not found' from 'error' without confusing return values and output parameters."
      - "Verify that topology path-selection changes do not omit nodes, duplicate nodes, or produce inconsistent views."

  - category: "State Machines and Maintainability"
    items:
      - "Critical state-machine changes must keep transitions unambiguous, explicit, and verifiable."
      - "Do not duplicate protocol advancement, queue advancement, or error-convergence logic in multiple places without shared constraints."
      - "Document key invariants for code that depends on implicit ordering, ownership, or topology constraints."
      - "Retain sufficient debugging information or debug assertions in paths involving hangs, aborts, retries, or reconnects."

  - category: "Naming Conventions"
    items:
      - "Follow the existing naming conventions of the language and module, including type suffixes such as _t. Preserve upstream or compatibility-required names without renaming unrelated historical symbols."
      - "Keep the nccl prefix for internal interfaces ported from NCCL, including older versions and implementations adapted to HGGC. Use pccl for newly designed PCCL interfaces and for public PCCL APIs and their public types."
      - "Preserve internal compatibility aliases such as ncclResult_t for pcclResult_t. Before renaming internal symbols, inspect the relevant NCCL version or source history; hardware adaptation or the first PCCL commit introducing a symbol does not establish PCCL authorship."
      - "Naming changes must keep declarations, definitions, callers, plugin contracts, and examples consistent and check exported-symbol and ABI compatibility. Other functions, variables, types, and macros follow the module's existing style."
      - "Variable names must clearly distinguish bytes, element counts, indexes, offsets, ranks, channels, steps, chunks, slots, credits, and other concepts."
      - "Boolean names should express state, such as `isReady`, `hasError`, or `needAbort`."
      - "Loop indexes and short thread-local variables may use brief names; variables with nonlocal meaning must not use meaningless abbreviations."

  - category: "License Header Compliance"
    items:
      - "Files containing NVIDIA copyrights must preserve existing copyright and license notices. Code derived from NCCL <2.29.7 generally uses BSD-3-Clause, while code derived from NCCL >=2.29.7 generally uses Apache-2.0; the license actually applicable to each file takes precedence."
      - "Modified files containing NVIDIA copyrights must add the T-Head modification notice in the form `SPDX-FileCopyrightText: Modifications Copyright (c) YYYY-2026 T-Head (Shanghai) Semiconductor Co., Ltd. All rights reserved.`, using the actual modification years."
      - "Original PCCL source code and scripts must add the established T-Head Apache-2.0 license header. Ordinary documents and simple configuration files do not universally require headers, but must preserve existing third-party notices and follow applicable licenses. Do not require inventing upstream notices merely because an upstream file has no header."

  - category: "Code Style and Readability"
    items:
      - "Header guards, indentation, brace style, and comment style must match the existing codebase; do not introduce a new style within a module."
      - "Inline functions in headers should use `inline` or `static inline` to avoid multiple definitions."
      - "New code must not require language features or standard versions beyond those established by the codebase."
      - "Keep complex macros, conditional compilation, and error paths clearly formatted without hiding control flow."
      - "Keep critical error, cleanup, and state-transition paths clear and avoid hidden side effects."
      - "Conditional branches should avoid mixing success and failure semantics."
      - "Comments should explain intent, constraints, preconditions, reasons for retaining code, and key invariants, especially memory ordering, synchronization, topology, and protocol assumptions, rather than merely restating behavior."
      - "Use assertions, comments, or local decomposition to reduce misunderstanding when complex logic depends on implicit assumptions."
      - "2-space indentation, K&R brace style"
      - "Public C interfaces must use C-compatible declarations and preserve their established language linkage, data layouts, and ABI constraints."
      - "C++14 standard (C++17 for kernel)"

  - category: "English Usage in Names and Comments"
    items:
      - "Variable names and comments must use correct, clear, professional English; avoid obvious spelling errors, pinyin, mixed Chinese and English, and meaningless abbreviations."
      - "Comments must match the implementation and be updated when the logic changes."
      - "Explain why dead or disabled code is retained."
      - "Commit messages must follow the conventions and accurately reflect the implementation."

  - category: "Macro Design"
    items:
      - "Wrap all multi-statement macros in `do { ... } while(0)` or an equivalent construct."
      - "Parenthesize macro arguments correctly to avoid precedence and side-effect problems."
      - "Debugging, parameter, and platform macros must reuse existing patterns rather than introducing a completely different macro system."

  - category: "Testing Requirements"
    items:
      - "Changes to collective scheduling, ordering, or participation must add multi-rank tests."
      - "Changes to chunk partitioning, offsets, counts, layouts, or datatypes must add boundary and remainder tests."
      - "Changes to transports, protocols, queues, credits, or completion logic must add tests capable of detecting hangs or data corruption."
      - "Changes to error handling, abort, cleanup, or reconnect logic must add fault-injection or exceptional-path tests."
      - "Changes to race-sensitive logic must add repeated-run, stress, or concurrency tests."
      - "Performance-related changes should provide benchmarks, stress-test results, or at least an explanation of hot-path impact."
      - "When tests are missing, the change description must explain why the risk is acceptable."

  - category: "CI Configuration"
    items:
      - "Verify new tests run in CI. Add new required jobs to tests-gate.needs."
      - "Required test failures or unexpected skips must fail the gate."
      - "When changing CI routing or gate rules, verify both passing and failing cases."

  - category: "AI Review Mandatory Rejections"
    items:
      - "Error Handling and Abort Propagation: ignoring critical call or check-macro return values."
      - "ABI / API / Semantic Compatibility: new public APIs bypassing unified export, tracing, or visibility declarations."
      - "ABI / API / Semantic Compatibility: changing released plugin interfaces, public structures, or versioned configuration structures without a version upgrade."
      - "Memory Safety and Lifetime: bypassing unified memory-allocation wrappers."
      - "Concurrency and Memory Ordering: lazy initialization of shared state without safe publication or synchronization."
      - "Stream / Event / PPU Asynchronous Semantics: new device, asynchronous, or platform-specific operations omitting existing context switching, mode switching, or platform safeguards."

  - category: "Commit Message Requirements"
    items:
      - "Check every contribution commit's Signed-off-by according to CONTRIBUTING.md. Preserve existing Signed-off-by and Co-authored-by trailers when amending or squashing; never invent signing identities or certifications."
      - "Breaking changes must explain compatibility impact and migration."
      - "Check commit titles according to CONTRIBUTING.md: a nonempty, concise English imperative summary. Aim for at most 50 characters including any prefix; longer titles are accepted and must not be rejected solely for length. Type prefixes such as feat:, fix:, and docs: are recommended but optional; the summary after a prefix uses the imperative mood. Do not reject a commit solely for lacking a type prefix."
      - "Every contribution commit must reference a real, relevant GitHub issue using Refs #<issue_number>, Closes #<issue_number>, or Fixes #<issue_number>. Cross-repository references use owner/repo#<issue_number>; full GitHub issue URLs (https://github.com/owner/repo/issues/<issue_number>) are also accepted. Never invent references; add missing references before committing or pushing. Use closing keywords only when resolving the issue and intending automatic closure."
      - "The second line of a commit must be blank to separate the title and body; the body should explain the problem, solution, and relevant limitations."
      - "Check title and footer formatting against CONTRIBUTING.md; fixed field prefixes are not required in the body."
