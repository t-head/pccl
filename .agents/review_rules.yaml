rules:
  - category: "Collective 语义一致性"
    items:
      - "不得引入导致不同 rank 进入不同 collective 顺序的代码路径。"
      - "不得引入导致部分 rank、设备或 channel 跳过 collective 参与的条件分支。"
      - "collective 相关元数据（count、datatype、op、root、communicator、buffer role）必须在所有参与方语义一致。"
      - "不得修改 begin/end group、launch order、completion order 的既有语义，除非变更说明中明确声明并补充测试。"
      - "涉及 in-place / out-of-place 路径时，必须显式检查输入输出 buffer 是否允许别名或重叠。"
      - "不得引入 collective 部分成功、部分失败但状态未统一收敛的逻辑。"
      - "新增集合通信 API 必须遵循现有统一入队、参数描述和校验模式，不得单独发明调用路径。"

  - category: "死锁 / Hang 风险"
    items:
      - "不得引入新的锁顺序反转。"
      - "不得在持锁状态下执行可能阻塞的外部调用、等待、回调或跨线程通知。"
      - "不得引入 barrier、fence、condition、event wait 参与方不一致的路径。"
      - "所有等待循环必须有明确的进展条件、退出条件或 abort 条件。"
      - "不得依赖 timeout 作为正确性保证。"
      - "不得引入可能导致 rank、channel、stream、线程之间循环等待的状态转换。"
      - "错误路径不得让对端或其他 rank 永久等待。"
      - "设备端 wait 循环必须保留统一的 abort 检查和退出模式。"

  - category: "并发与内存序"
    items:
      - "共享状态的跨线程读写必须有明确同步手段，不得出现未保护的数据竞争。"
      - "用于线程间发布状态、完成标志、队列头尾、credit、slot 状态的变量，必须使用与场景匹配的原子语义或锁。"
      - "不得用普通读写替代需要 acquire/release 语义的同步点。"
      - "对象、指针、描述符、句柄在完全初始化前不得发布给其他线程、stream、设备或 rank。"
      - "对象进入销毁流程后不得继续被异步路径访问。"
      - "异步回调、完成通知、后台线程修改共享状态时，必须遵守统一同步约定。"
      - "惰性初始化必须使用双重检查锁定、原子发布或等价安全模式，不得使用无保护的首次初始化。"
      - "共享状态、引用计数、完成标志、abort 标志、队列头尾等并发元数据必须通过统一原子/锁约定访问。"
      - "线程局部状态仅可用于严格线程私有语义，不得用来规避跨线程同步。"

  - category: "内存安全与生命周期"
    items:
      - "不得引入 use-after-free。"
      - "不得引入 double free、重复反注册、重复销毁。"
      - "异步操作引用的 buffer、communicator、transport、registration、descriptor 生命周期必须覆盖异步完成点。"
      - "栈上对象、局部数组、临时引用不得逃逸到异步执行路径。"
      - "所有大小、偏移、步长、chunk 长度计算必须防止整数溢出和越界访问。"
      - "涉及类型转换、指针运算、结构体布局时，必须确认对齐与大小假设成立。"
      - "错误路径必须释放已分配的内存、句柄、注册资源、队列、线程和事件。"
      - "资源清理顺序必须与资源依赖关系一致，不得先释放仍被下游使用的对象。"
      - "新增分配路径应优先使用现有统一分配封装，不得绕过代码库既有的调试、统计、对齐或零初始化约定。"
      - "分配和释放接口必须成对匹配，不得混用不同内存域或不同后端的分配/释放函数。"
      - "零长度分配、空指针释放、部分分配成功后的失败清理必须有明确定义。"
      - "GPU 可见、DMA 可见或跨进程共享的数据结构，必须显式验证大小、布局、对齐和生命周期假设。"

  - category: "Silent Data Corruption 风险"
    items:
      - "不得引入可能返回错误数据但不报错的路径。"
      - "chunk 切分、offset 计算、remainder 处理不得出现 off-by-one、重复覆盖或遗漏片段。"
      - "不同 kernel、host 代码、网络报文之间的 datatype 宽度、符号位、布局解释必须一致。"
      - "scratch buffer、FIFO slot、credit、临时聚合区在复用前必须确认前一次使用已完成且可见。"
      - "不得发送、规约或拷贝未初始化的数据区域、padding 或脏的临时缓冲。"
      - "涉及 reduce、reduce-scatter、allreduce 时，不得改变既有数学语义、分块语义或顺序假设，除非有明确设计说明和测试。"

  - category: "Stream / Event / GPU 异步语义"
    items:
      - "不得破坏既有 stream 上的 happens-before 关系。"
      - "event record / wait 的使用必须能保证需要的可见性与顺序。"
      - "不得在热路径中引入不必要的 device-wide sync、stream sync、host sync。"
      - "host 侧对象生命周期必须覆盖已提交但尚未完成的 GPU work、DMA 或 transport 操作。"
      - "涉及 graph capture / replay 的代码，不得调用 capture-unsafe 的路径，除非明确声明不支持。"
      - "修改 kernel launch 参数、grid/block 配置、step 数时，必须验证边界条件、occupancy 和协议步数语义未被破坏。"
      - "不得假设 peer access、IPC handle、拓扑可达性一定成立，必须保留检查或 fallback。"
      - "新增设备相关内存操作、异步操作或平台特有操作时，不得遗漏既有的上下文切换、模式切换或平台保护流程。"

  - category: "Transport / Protocol 正确性"
    items:
      - "不得修改消息布局、状态机、协议字段含义而不做版本兼容或协商处理。"
      - "队列 head/tail、credit、slot 复用逻辑必须严格匹配完成语义，不得提前复用。"
      - "producer / consumer 的索引推进、wraparound 和容量判断必须严格正确。"
      - "短读、短写、分段接收、部分消息到达必须有正确处理。"
      - "重试、重连、重复完成通知不得导致重复发送、重复规约或状态重复提交。"
      - "ring、tree、channel、routing 构建不得遗漏 rank、重复 rank 或产生不一致拓扑视图。"
      - "不得直接依赖未定义的结构体内存布局作为跨进程、跨节点协议格式。"

  - category: "错误处理与 Abort 传播"
    items:
      - "不得忽略关键返回值、异步错误状态或后台线程错误。"
      - "新增的系统调用、驱动调用、运行时调用必须使用现有检查宏或统一错误处理封装，不得裸调用后忽略返回值。"
      - "所有错误路径必须返回统一错误码体系，不得混用异常、断言终止和隐式失败。"
      - "不得忽略关键 CHECK 宏、系统调用或底层运行时接口的返回值。"
      - "多语句错误处理宏必须使用 `do { ... } while(0)` 或等价形式包裹。"
      - "异步错误必须写入统一的异步错误状态，而不是只打印日志。"
      - "fatal error / abort 状态必须传播到所有相关 rank、channel、stream、communicator。"
      - "错误路径必须保证状态可收敛，不得留下部分初始化、部分提交、部分销毁的可见状态。"
      - "清理失败不得覆盖原始根因，必要时保留首个错误并附加上下文。"
      - "错误路径必须确保对端不会因为缺少通知而永久等待。"
      - "如果某一步失败后系统只能进入不可恢复状态，代码必须显式标记并阻止后续继续推进。"
      - "当需要中止进程并异常退出时，优先使用 ERROR 而非 WARN。"

  - category: "资源清理"
    items:
      - "资源申请后的清理方式必须与现有代码库一致，不得在同一核心模块内混用多种资源管理范式。"
      - "错误路径必须覆盖部分初始化、部分分配、部分注册成功的场景。"
      - "清理路径必须保证顺序正确：先停止访问，再注销映射、句柄，最后释放内存或对象。"

  - category: "热路径性能"
    items:
      - "不得在 per-collective、per-step、per-chunk 热路径中引入动态内存分配、注册/反注册或重量级初始化。"
      - "不得在热路径中引入额外的数据拷贝、打包、解包或 host bounce buffer。"
      - "不得把原本可并行的 channel、rank、operation 串行化。"
      - "不得在高频路径中引入全局锁、长时间持锁或高争用共享计数器。"
      - "新增同步、额外 kernel launch、额外控制消息、额外轮询必须有明确收益和说明。"
      - "性能优化不得以牺牲正确性、可见性或完成语义为代价。"
      - "性能优化应优先复用现有线程阈值、协议选择、批量操作、预分配或建模机制，不得随意引入局部特判破坏整体策略。"
      - "任何以性能为目的的改动，都不得破坏正确性、同步语义、可见性或错误处理语义。"
      - "新增性能优化路径必须说明适用条件，并保证在不满足条件时安全退化。"

  - category: "ABI / API / 语义兼容性"
    items:
      - "不得随意修改导出符号、公开结构体布局、枚举值、回调签名。"
      - "不得无说明地改变 completion、ordering、thread-safety、error handling 的公开语义。"
      - "配置项、环境变量、调优参数的行为变更必须保证兼容或提供迁移说明。"
      - "跨版本协议、持久化元数据、跨进程共享结构的变更必须考虑兼容性。"
      - "新增公共 API 必须使用现有导出宏、可见性控制和 tracing、profiling 包装，不得绕开统一声明方式。"
      - "已发布的公共接口、插件接口和配置结构体不得原地破坏兼容性；如需扩展，应创建新版本。"
      - "配置项和环境变量必须复用现有参数系统，不得引入随意解析的私有配置入口。"

  - category: "可移植性与未定义行为"
    items:
      - "不得依赖未定义行为。"
      - "不得假设特定编译器、特定 CPU / GPU 架构、特定页大小或特定缓存一致性模型一定成立。"
      - "新增硬件特性、runtime 特性或指令路径时，必须有 capability check 或 fallback。"
      - "涉及 strict aliasing、对齐、符号扩展、整数截断、位运算布局时，必须确认跨平台语义稳定。"
      - "新增平台相关代码必须放在现有平台抽象或条件编译框架内，不得把平台特有逻辑直接散落到公共路径。"
      - "新增硬件特性、驱动特性或设备特性时，必须提供能力检测、条件编译或合理 fallback。"
      - "跨平台路径的语义必须保持一致，不支持的平台必须显式失败或提供退化路径。"

  - category: "设备代码（Kernel）设计"
    items:
      - "设备端性能关键路径应优先采用现有静态特化、模板派发、协议标签或宏生成体系，不得引入额外运行时分派开销。"
      - "新增设备端代码不得引入虚函数、动态分配或不受控的运行时多态。"
      - "性能关键的设备端内循环应保持可展开、可向量化、可静态推导，不得无理由破坏现有优化模式。"
      - "必须严格留意 gridDim.x 的使用。"
      - "检查是否错误假设 gridDim.x 恒定、连续或可替代其他维度信息。"
      - "检查涉及线程块划分、索引计算、边界判断和 workload 分配时，gridDim.x 的使用是否正确。"
      - "如果代码逻辑依赖 gridDim.x，需确认该依赖在不同 launch 配置下仍然成立。"

  - category: "数据结构设计"
    items:
      - "核心运行时数据结构应保持 C 风格、显式布局、显式所有权，不得无必要引入复杂对象语义。"
      - "侵入式链表、固定大小数组、arena 风格分配等既有结构组织方式，不得随意替换为引入 ABI、布局或性能不确定性的通用容器。"
      - "带有协议、回调、DMA、共享内存或设备可见语义的数据结构，必须保持成员布局和生命周期约束可验证。"
      - "使用哨兵值、特殊指针值或 NULL 表示特定语义时，必须与现有约定保持一致并在调用方正确区分。"

  - category: "图与拓扑子系统"
    items:
      - "拓扑搜索、路径构建、候选排序和图查询逻辑必须保持确定性和可解释性，不得引入隐式随机性或顺序依赖。"
      - "图查询中“未找到”与“错误”必须保持语义分离，不得混淆返回值与输出参数的含义。"
      - "拓扑路径选择逻辑变更必须验证不会遗漏节点、重复节点或产生不一致视图。"

  - category: "状态机与可维护性"
    items:
      - "关键状态机变更必须保持状态转换单一、明确、可验证。"
      - "不得在多个位置复制协议推进、队列推进、错误收敛逻辑而无统一约束。"
      - "对依赖隐含顺序、所有权、拓扑约束的代码，应补充注释说明关键 invariant。"
      - "涉及 hang、abort、重试、reconnect 的路径，应保留足够的调试信息或 debug assert。"

  - category: "命名规范"
    items:
      - "公共 API、内部函数、静态辅助函数、结构体、枚举、宏、模板参数的命名必须与现有代码库风格保持一致，不得混用不同命名体系。"
      - "变量名必须语义清晰，区分字节数、元素数、索引、偏移、rank、channel、step、chunk、slot、credit 等不同概念。"
      - "布尔变量命名应体现状态语义，如 `isReady`、`hasError`、`needAbort`。"
      - "循环索引和线程局部短变量可使用简短命名，但非局部语义变量不得使用无意义缩写。"

  - category: "License Header 合规性"
    items:
      - "所有包含 NVIDIA 版权的文件必须使用 BSD-3-Clause 许可证（NCCL <2.29.7 衍生代码）或 Apache-2.0 许可证（NCCL >=2.29.7 衍生代码）。"
      - "所有包含 NVIDIA 版权的文件如果有二次开发，必须添加 T-Head 修改声明，格式：`SPDX-FileCopyrightText: Modifications Copyright (c) YYYY-2026 T-Head Semiconductor Co., Ltd. All Rights Reserved.`"
      - "PCCL 自有的原创文件必须添加 T-Head Apache-2.0 license header，具体格式可以参考已有的原创文件。"

  - category: "代码风格与可读性"
    items:
      - "头文件保护、缩进、大括号风格、注释风格必须与现有代码库保持一致，不得在同一模块中引入新的风格体系。"
      - "头文件中的内联函数应使用 `inline` 或 `static inline`，避免多重定义风险。"
      - "新增代码不得引入高于当前代码库约定的语言特性或标准版本特性。"
      - "复杂宏、复杂条件编译和复杂错误路径应保持清晰排版，避免隐藏控制流。"
      - "关键错误路径、资源清理路径、状态转换路径应保持清晰，避免隐藏副作用。"
      - "条件分支应避免让成功路径和失败路径语义混杂。"
      - "新增注释应解释为什么这样做，尤其是内存序、同步顺序、拓扑假设和协议 invariant，而不是仅复述代码表面行为。"
      - "复杂逻辑如依赖隐含前提，应通过断言、注释或局部拆分降低误读风险。"
      - "2-space indentation, K&R brace style"
      - "Primarily 'struct' (not 'class') for C-linkage compatibility"
      - "C++14 standard (C++17 for kernel)"

  - category: "变量命名与注释英文语义检查"
    items:
      - "变量名和注释必须使用正确、清晰、专业的英文，禁止明显拼写错误、拼音、中英混杂和无意义缩写。"
      - "注释必须解释约束、意图、前置条件、同步关系或保留原因，不得只复述代码表面行为。"
      - "注释必须与实现保持一致；修改逻辑时必须同步更新相关注释。"
      - "保留死代码或屏蔽代码时，应注明保留原因。"
      - "commit message 符合规范，切合 code 实现保持一致。"

  - category: "宏设计规范"
    items:
      - "所有多语句宏必须使用 `do { ... } while(0)` 或等价形式包裹。"
      - "宏参数在展开时必须正确加括号，避免优先级和副作用问题。"
      - "调试宏、参数宏、平台宏必须复用现有模式，不得新增风格完全不同的宏体系。"

  - category: "测试要求"
    items:
      - "修改 collective 调度、顺序或参与逻辑时，必须补充多 rank 测试。"
      - "修改 chunk 切分、offset、count、layout、datatype 逻辑时，必须补充边界值和 remainder 测试。"
      - "修改 transport、protocol、queue、credit、completion 逻辑时，必须补充能发现 hang 或数据错乱的测试。"
      - "修改错误处理、abort、cleanup、reconnect 逻辑时，必须补充失败注入或异常路径测试。"
      - "修改 race-sensitive 逻辑时，必须补充重复运行、压力测试或并发场景测试。"
      - "性能相关改动应提供基准、压测结果或至少说明热路径影响。"
      - "缺少测试时，变更说明必须解释为何风险可接受。"

  - category: "AI Review 必拒项"
    items:
      - "忽略关键错误检查宏、系统调用、驱动调用或运行时调用的返回值。"
      - "新增公共 API 未使用现有导出、追踪、可见性声明方式。"
      - "修改已发布插件接口、公共结构体或版本化配置结构而不做版本升级。"
      - "绕过现有统一内存分配封装，直接使用裸分配接口。"
      - "共享状态惰性初始化未使用安全发布或同步机制。"
      - "新增设备相关内存操作、异步操作或平台特有操作时，遗漏既有的上下文切换、模式切换或平台保护流程。"

  - category: "Commit Message 规范"
  items:
    - "提交信息的标题行应遵循格式 pccl: <提交摘要>."
    - "检查 commit message 是否包含以下内容：to #<task_id>: <summary> or fix #<task_id>: <summary>."
    - "检查 commit message 是否包含以下内容：Test Case: <test case description>."
    - "检查 commit message 是否包含以下内容：Reviewed By: <reviewer 1>, <reviewer 2>."
