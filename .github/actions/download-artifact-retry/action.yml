name: Download artifact with retry
description: Download one Actions artifact up to three times, optionally verifying content after every attempt.
inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Workspace-relative destination directory.
    required: true
  sha256-file:
    description: Optional download-relative file whose SHA-256 is checked after every attempt.
    required: false
  expected-sha256:
    description: Expected lowercase SHA-256 for sha256-file; both inputs must be provided together.
    required: false
runs:
  using: composite
  steps:
    - name: Validate retry options
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        PREFLIGHT_ONLY: '1'
      run: python3 -S -B "${{ github.action_path }}/validate_sha256.py"
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - id: first-validation
      name: Verify the first download
      if: steps.first.outcome == 'success' && inputs.expected-sha256 != ''
      continue-on-error: true
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
      run: python3 -S -B "${{ github.action_path }}/validate_sha256.py"
    - name: Clean partial output and wait before the second attempt
      if: steps.first.outcome == 'failure' || steps.first-validation.outcome == 'failure'
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        relative = Path(os.environ['DOWNLOAD_PATH'])
        if not os.environ['DOWNLOAD_PATH'] or relative.is_absolute() or '..' in relative.parts:
            raise ValueError('Artifact download path must be a nonempty workspace-relative path')
        parent = (workspace / relative).parent.resolve()
        parent.relative_to(workspace)
        target = parent / relative.name
        if target == workspace:
            raise ValueError('Artifact download path cannot be the workspace root')
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.is_dir():
            shutil.rmtree(target)
        PY
        sleep 15
    - id: second
      if: steps.first.outcome == 'failure' || steps.first-validation.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - id: second-validation
      name: Verify the second download
      if: steps.second.outcome == 'success' && inputs.expected-sha256 != ''
      continue-on-error: true
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
      run: python3 -S -B "${{ github.action_path }}/validate_sha256.py"
    - name: Clean partial output and wait before the third attempt
      if: steps.second.outcome == 'failure' || steps.second-validation.outcome == 'failure'
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        relative = Path(os.environ['DOWNLOAD_PATH'])
        if not os.environ['DOWNLOAD_PATH'] or relative.is_absolute() or '..' in relative.parts:
            raise ValueError('Artifact download path must be a nonempty workspace-relative path')
        parent = (workspace / relative).parent.resolve()
        parent.relative_to(workspace)
        target = parent / relative.name
        if target == workspace:
            raise ValueError('Artifact download path cannot be the workspace root')
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.is_dir():
            shutil.rmtree(target)
        PY
        sleep 30
    - id: third
      if: steps.second.outcome == 'failure' || steps.second-validation.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - name: Verify the third download
      if: steps.third.outcome == 'success' && inputs.expected-sha256 != ''
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
      run: python3 -S -B "${{ github.action_path }}/validate_sha256.py"
