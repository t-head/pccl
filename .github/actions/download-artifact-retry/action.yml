name: Download artifact with retry
description: Download one Actions artifact up to three times, optionally verifying content after every attempt.
inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Workspace-relative destination directory.
    required: true
  sha256-file:
    description: Optional download-relative file whose SHA-256 is checked after every attempt.
    required: false
  expected-sha256:
    description: Expected lowercase SHA-256 for sha256-file; both inputs must be provided together.
    required: false
runs:
  using: composite
  steps:
    - name: Validate retry options
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        VALIDATOR_PATH: ${{ github.workspace }}/.download-artifact-retry-validate.py
        PREFLIGHT_ONLY: '1'
      run: |
        cat > "$VALIDATOR_PATH" <<'PY'
        #!/usr/bin/env python3
        # SPDX-FileCopyrightText: Copyright (c) 2026 T-Head (Shanghai) Semiconductor Co., Ltd. All rights reserved.
        # SPDX-License-Identifier: Apache-2.0
        """Validate optional content integrity for the download-artifact-retry action."""

        import hashlib
        import os
        from pathlib import Path
        import re
        import sys


        def _relative(value, label):
            path = Path(value)
            if not value or path.is_absolute() or ".." in path.parts:
                raise ValueError(f"{label} must be a nonempty relative path without '..'")
            return path


        def validate_options(download_path, sha256_file, expected_sha256):
            download = _relative(download_path, "Artifact download path")
            if bool(sha256_file) != bool(expected_sha256):
                raise ValueError("sha256-file and expected-sha256 must be provided together")
            if not expected_sha256:
                return download, None, None
            archive = _relative(sha256_file, "SHA-256 file")
            if not re.fullmatch(r"[0-9a-f]{64}", expected_sha256):
                raise ValueError("expected-sha256 must be a lowercase SHA-256 digest")
            return download, archive, expected_sha256


        def validate_download(workspace, download_path, sha256_file, expected_sha256):
            download, archive, expected = validate_options(download_path, sha256_file, expected_sha256)
            if expected is None:
                return None
            workspace = Path(workspace).resolve()
            download = (workspace / download).resolve()
            download.relative_to(workspace)
            target = download / archive
            if target.is_symlink() or not target.is_file():
                raise ValueError("Downloaded SHA-256 target must be a regular file, not a symlink")
            target = target.resolve()
            target.relative_to(download)
            digest = hashlib.sha256()
            with target.open("rb") as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                    digest.update(chunk)
            actual = digest.hexdigest()
            if actual != expected:
                raise ValueError(f"Downloaded archive SHA-256 mismatch: expected {expected}, got {actual}")
            print(f"Validated downloaded archive SHA-256: {actual}")
            return target


        def main():
            try:
                options = validate_options(
                    os.environ.get("DOWNLOAD_PATH", ""),
                    os.environ.get("SHA256_FILE", ""),
                    os.environ.get("EXPECTED_SHA256", ""))
                if os.environ.get("PREFLIGHT_ONLY") != "1" and options[2] is not None:
                    validate_download(
                        os.environ["GITHUB_WORKSPACE"],
                        os.environ.get("DOWNLOAD_PATH", ""),
                        os.environ.get("SHA256_FILE", ""),
                        os.environ.get("EXPECTED_SHA256", ""))
            except (KeyError, OSError, ValueError) as error:
                raise SystemExit(str(error))


        if __name__ == "__main__":
            main()

        PY
        python3 -S -B "$VALIDATOR_PATH"
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - id: first-validation
      name: Verify the first download
      if: steps.first.outcome == 'success' && inputs.expected-sha256 != ''
      continue-on-error: true
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        VALIDATOR_PATH: ${{ github.workspace }}/.download-artifact-retry-validate.py
      run: python3 -S -B "$VALIDATOR_PATH"
    - name: Clean partial output and wait before the second attempt
      if: steps.first.outcome == 'failure' || steps.first-validation.outcome == 'failure'
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        relative = Path(os.environ['DOWNLOAD_PATH'])
        if not os.environ['DOWNLOAD_PATH'] or relative.is_absolute() or '..' in relative.parts:
            raise ValueError('Artifact download path must be a nonempty workspace-relative path')
        parent = (workspace / relative).parent.resolve()
        parent.relative_to(workspace)
        target = parent / relative.name
        if target == workspace:
            raise ValueError('Artifact download path cannot be the workspace root')
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.is_dir():
            shutil.rmtree(target)
        PY
        sleep 15
    - id: second
      if: steps.first.outcome == 'failure' || steps.first-validation.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - id: second-validation
      name: Verify the second download
      if: steps.second.outcome == 'success' && inputs.expected-sha256 != ''
      continue-on-error: true
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        VALIDATOR_PATH: ${{ github.workspace }}/.download-artifact-retry-validate.py
      run: python3 -S -B "$VALIDATOR_PATH"
    - name: Clean partial output and wait before the third attempt
      if: steps.second.outcome == 'failure' || steps.second-validation.outcome == 'failure'
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        relative = Path(os.environ['DOWNLOAD_PATH'])
        if not os.environ['DOWNLOAD_PATH'] or relative.is_absolute() or '..' in relative.parts:
            raise ValueError('Artifact download path must be a nonempty workspace-relative path')
        parent = (workspace / relative).parent.resolve()
        parent.relative_to(workspace)
        target = parent / relative.name
        if target == workspace:
            raise ValueError('Artifact download path cannot be the workspace root')
        if target.is_symlink() or target.is_file():
            target.unlink()
        elif target.is_dir():
            shutil.rmtree(target)
        PY
        sleep 30
    - id: third
      if: steps.second.outcome == 'failure' || steps.second-validation.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - name: Verify the third download
      if: steps.third.outcome == 'success' && inputs.expected-sha256 != ''
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.path }}
        SHA256_FILE: ${{ inputs.sha256-file }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        VALIDATOR_PATH: ${{ github.workspace }}/.download-artifact-retry-validate.py
      run: python3 -S -B "$VALIDATOR_PATH"
