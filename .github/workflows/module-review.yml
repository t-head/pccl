name: PCCL Module Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [PCCL Review Events]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to re-evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Reconcile module approvals
    if: >-
      github.repository == 't-head/pccl' &&
      github.ref == 'refs/heads/main' &&
      vars.PCCL_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out trusted policy and evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Reconcile module approvals from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/review/run.mjs

# Require the custom "PCCL Module Owner Approval" check on the PR HEAD,
# not this orchestration job's result on main. Reserve that check name.
# Deliberately no concurrency cancellation: dropping a pending event could leave
# an earlier success stale. Each run checks live state twice and never runs PR code.
