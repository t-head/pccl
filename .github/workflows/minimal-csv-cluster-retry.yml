name: Minimal CSV two-node retry (experimental)

on:
  push:
    branches: [experiment/minimal-csv-cluster-retry]

permissions:
  contents: read

concurrency:
  group: minimal-csv-cluster-retry-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P
  PCCL_TESTS_REVISION: 394556512e87259e9ffa25225632c46b0a0bbcd5
  BUILD_RUN_ID: '42471169612'
  EXPECTED_PCCL_REVISION: c1756799cfe218295f087de83596c3fc46834e80

jobs:
  prepare:
    name: Validate two-node CSV and stage dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the executor and select only the established two-node Case
        working-directory: pccl
        run: |
          python3 -S -B -W error::ResourceWarning -m unittest discover \
            -s tests/xtest -p 'test_run_cases.py' -v
          python3 -S -B tests/xtest/run_cases.py \
            --input tests/xtest/minimal-csv --profile standard --nodes 2 --validate-only
      - name: Stage the pinned benchmark dependency
        run: |
          mkdir -p deps
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest deps filelock==3.20.3
          printf '%s  %s\n' \
            '4b0dda527ee31078689fc205ec4f1c1bf7d56cf88b6dc9426c4f230e46c2dce1' \
            'deps/filelock-3.20.3-py3-none-any.whl' | sha256sum --check -
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-csv-cluster-retry-deps
          path: deps/
          if-no-files-found: error
          overwrite: true

  two-node:
    name: Two-node master-only CSV retry (16 ranks)
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: minimal-csv-cluster-retry-deps
          path: deps
      - name: Restore the reviewed standard build and run on master
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: 2
          nproc_per_node: 8
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /dev/infiniband
            test -r /proc/net/route
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            umask 022
            cd "$SOURCE_DIR"
            SHARED_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/shared-standard
            export build_output="$SHARED_ROOT/output_standard"
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ env.BUILD_RUN_ID }}/build
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/results/cluster
            rm -rf "$RESULT_ROOT" "$SHARED_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")" "$SHARED_ROOT"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            sha256sum --check "$BUILD_ROOT/output_standard.tar.gz.sha256"
            tar -xzf "$BUILD_ROOT/output_standard.tar.gz" -C "$SHARED_ROOT"
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ env.EXPECTED_PCCL_REVISION }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-cluster-env
            /workspace/minimal-csv-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/deps" \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            export OMPI_MCA_plm_rsh_agent=cluster-ssh
            export OMPI_MCA_orte_base_help_aggregate=0
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            echo "MPI TCP interface: $MPI_INTERFACE"
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            /workspace/minimal-csv-cluster-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$build_output/pccl/tests/xtest/minimal-csv" \
              --profile standard --nodes 2 \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --hostfile "$CLUSTER_HOSTS_FILE" \
              --mpi-interface "$MPI_INTERFACE" \
              --output "$RESULT_ROOT"

  summary:
    name: Two-node CSV gate
    needs: [prepare, two-node]
    if: always()
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 20
    steps:
      - name: Require the complete two-node result without publishing raw logs
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          import shutil
          import sys

          source = Path('/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/results/cluster')
          target = Path('public-results')
          target.mkdir()
          errors = []
          try:
              summary = json.loads((source / 'summary.json').read_text())
              with (source / 'results.csv').open(newline='') as stream:
                  rows = list(csv.DictReader(stream))
              if summary.get('total') != 1 or len(rows) != 1:
                  errors.append(f'expected one result: {summary}')
              if summary.get('counts', {}).get('PASSED') != 1 or rows[0]['status'] != 'PASSED':
                  errors.append(f'two-node Case did not pass: {summary}')
              row = rows[0]
              if not (source / row['plan'] / row['suite'] / row['name'] / 'raw.log').is_file():
                  errors.append('two-node raw log is missing')
              for name in ('summary.json', 'results.csv'):
                  shutil.copyfile(source / name, target / name)
              print(json.dumps(summary, sort_keys=True))
          except (OSError, ValueError, IndexError, json.JSONDecodeError) as error:
              errors.append(f'missing or invalid two-node results: {error}')
          for error in errors:
              print(f'::error::{error}')
          sys.exit(bool(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-csv-cluster-retry-summary
          path: public-results/
          if-no-files-found: error
          overwrite: true
