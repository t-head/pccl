name: PCCL Commit Message Preview

on:
  workflow_run:
    workflows: [Refresh PCCL review gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to prepare its squash message
        required: true
        type: number

permissions: {}

concurrency:
  group: "squash-message-${{ github.event.workflow_run.display_title || format('PCCL review for PR #{0}', inputs.pr_number) }}"
  queue: max
  cancel-in-progress: false

jobs:
  squash-message:
    name: Squash message preview
    # Gate notifications, including forks, execute trusted default-branch code.
    if: >-
      github.repository == 't-head/pccl' && (
        github.event_name == 'workflow_run' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr_number && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      statuses: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update the squash message preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_CLI: ${{ runner.temp }}/copilot/bin/copilot
          PR_NUMBER: ${{ inputs.pr_number }}
          PYTHONUTF8: '1'
        run: python3 .github/scripts/commit_message_squash.py
