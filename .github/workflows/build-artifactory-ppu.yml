name: build_artifactory

# Build the pccl distribution tarballs *and* the pccl-tests perf binaries for every supported
# OS / HGGCRT combination inside the matching docker image, keep one Actions artifact per package
# and transfer every one of them back to the internal artifact server:
#
#   <pkg_name>                      (Actions artifact, always a zip)
#     <pkg_name>.tar.gz             pccl: lib/, include/, bin/, envsetup.sh, release.yaml
#   <pccl_tests_pkg_name>           (Actions artifact, always a zip)
#     <pccl_tests_pkg_name>.tar.gz  pccl-tests: comm_tools/*_perf
#
# <pkg_name> is pccl_hggcrt<12|13>_<os> and <pccl_tests_pkg_name> is its pccl_tests_ counterpart, so
# the OS, the runtime and the package a download belongs to are readable from the file name alone.
# The two packages stay separate artifacts: a consumer installs one of them, and a download that
# mixed them would only have to be split again.
#
# Both tarballs come out of the same job: the perf binaries link against the libpccl.so that this
# very run just built, so one commit, one SDK install and one toolchain setup produce a matched
# pair, and there is no second workflow that can drift out of step. pccl-tests keeps its own
# workflow only as a manual (workflow_dispatch) fallback.
#
# One extra matrix row compiles ubuntu2404 / hggcrt13 a second time for the test pipeline and names
# its output pccl_for_test_hggcrt13_ubuntu24, using its own copy of the build script, so that package
# can diverge without perturbing the release one. That row emits neither package above: it ships the
# ${build_output} tree (pccl_build/, comm-internal-testbox/) as one <bundle_name>.tar.gz, which is
# what the test box consumes. The bundle is transferred back like every other package, tagged with
# the test edition so a query can tell it apart from the release items. It carries no PPU_SDK/: the
# build script installs the SDK inside the image and the copy used to be bigger than the rest of the
# bundle together, so a consumer installs the matching SDK version on its side.
#
# Everything runs on the internal x86-ubuntu2404-8-32 runner pool (8 vCPU / 32 GB): the matching
# distribution image is started locally with docker and the workspace is bind-mounted at
# /workspace/source, the layout the build scripts already assume, so no internal k8s cluster,
# NAS mount or scheduler worker pod is involved.
#
# The transfer back is one call per package to t-head/ci-infra's upload-artifact-properties
# workflow, which publishes the package artifact as the zip it already is, so nothing is packed a
# second time. The artifact names carry no run suffix, so a file name is stable across runs and a
# re-run of one slot replaces that zip instead of leaving a second one behind:
#   github_generic/nightly/<owner>/<repo>/comm.<ref>-<stamp>/<artifact>.zip
# Every item of one run shares that version directory, so a consumer that knows the ref and the
# label can build the URL directly; the items differ by file name and by the os / runtime /
# edition properties set on each one, and the run id / attempt travel as item properties too. Only
# that job needs secrets (RELEASE_USERNAME / RELEASE_TOKEN); the build jobs themselves need none.
#
# Each item also carries a note in the free-form `extra_info` property, which is the field an
# artifact page shows next to a package. The note is one JSON object with a single key, so the whole
# comment travels as one value instead of a structure a consumer has to know:
#   {"comment":"pccl-main-79cf7ab@sail-2.2.1-184ee6"}
# The value is <repo>-<branch>-<commit 7>@sail-<SDK version>-<SDK build hash>: repo/branch/commit
# name what was built (a nightly names its slot commit, not the triggering one), sail names the SDK
# the row compiled against as recorded in PPU_SDK/release.yaml, which the build step compares against
# the installer name before publishing. A pccl-tests item names its own source instead
# (pccl-tests-main-<commit 7>@...), because that package is built from a different repository.
#
# The artifact label is the UTC+8 YYYY-MM-DD-1900 nightly slot of a scheduled run, and a nightly
# run also builds the default-branch commit as of that 19:00 timestamp: a queued-late run still
# produces the slot's code and a predictable upload path. Push and manual runs are not that slot and
# keep their real YYYY-MM-DD-HHmm start time and their triggering commit, so two builds of one day
# never share a version; artifact_version overrides the label.
#
# Each matrix entry calls one of the tar build scripts in .github/workflows/scripts:
#   hggcrt 12 -> pccl_hggcrt12_tar_build.sh
#   hggcrt 13 -> pccl_hggcrt13_tar_build.sh
#
# The container images are plain OS base images under download.t-head.cn/docker_base. They no
# longer ship the PPU SDK, so each matrix row also carries the SDK run package for its OS and
# HGGCRT runtime: the tar build script downloads sdk_url into sdk_name and installs it under
# ${source_home}, which lets one base image serve both hggcrt rows. Every enabled row must carry
# a container image, otherwise the prepare job fails fast.

on:
  # Nightly artifact build at 19:00 UTC+8 (11:00 UTC; GitHub cron is always UTC). GitHub only
  # picks schedule triggers up from the default branch, so this stays dormant until the file
  # is merged there. The scheduler queues runs instead of starting them on the minute, so the
  # build really starts a few minutes after 19:00; the label and the built commit are the slot's.
  schedule:
    - cron: '0 11 * * *'
  # Build on every push to the default branch. `paths` keeps ordinary source commits from
  # burning a full matrix build; the nightly schedule above is what produces regular artifacts.
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-artifactory-ppu.yml
      - .github/workflows/scripts/pccl_hggcrt12_tar_build.sh
      - .github/workflows/scripts/pccl_hggcrt13_tar_build.sh
      - .github/workflows/scripts/pccl_for_test_hggcrt13_ubuntu24_build.sh
  workflow_dispatch:
    inputs:
      os_versions:
        description: 'JSON array of OS labels; every BUILD_TABLE row is enabled: ubuntu2004, ubuntu2204, ubuntu2404, alios7, alios8, alinux3, alinux4'
        required: true
        type: string
        default: '["ubuntu2004","ubuntu2204","ubuntu2404","alios7","alios8","alinux3","alinux4"]'
      hggcrt_versions:
        description: 'JSON array of HGGCRT runtime versions; allowed: 12, 13; both are enabled in BUILD_TABLE'
        required: true
        type: string
        default: '["12","13"]'
      artifact_version:
        description: 'Label used for the upload version and the run summary; empty means the UTC+8 "YYYY-MM-DD-1900" slot for a scheduled run and the actual "YYYY-MM-DD-HHmm" start time otherwise'
        required: false
        type: string
        default: ''
      package_version:
        description: 'build.sh --package_version override; empty means "<a.b.c>-<UTC timestamp>"'
        required: false
        type: string
        default: ''
      cpu_num:
        description: 'Parallelism passed to build.sh --cpu_num; 0 means one make job per core (nproc)'
        required: true
        type: string
        default: '0'
      max_parallel:
        description: 'Matrix rows compiled at once; must not exceed the number of online x86-ubuntu2404-8-32 runners, extra rows just queue'
        required: false
        type: string
        default: '8'

permissions:
  contents: read
  # The build jobs upload through the Actions artifact API and the transfer-back job downloads
  # through it again, so the scope is granted explicitly; an explicit permissions block sets
  # everything else to none.
  actions: read

concurrency:
  # The event name is part of the group on purpose: a push or a manual dispatch on main must not
  # cancel the nightly run that is already building the previous commit.
  group: build-artifactory-ppu-${{ github.event_name }}-${{ github.ref }}
  # Within one event type, a newer run on the same ref supersedes whatever is still running: the
  # superseded run would only hold matrix rows on the runner pool for an obsolete commit.
  cancel-in-progress: true

jobs:
  # Expand the OS x HGGCRT matrix and resolve the artifact label once, so every downstream
  # job and the run summary stay consistent even across re-runs.
  prepare:
    name: Prepare build matrix
    runs-on: x86-ubuntu2404-8-32
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      # One entry per package instead of per row: a regular row transfers two packages back, the
      # for-test row one.
      upload_matrix: ${{ steps.matrix.outputs.upload_matrix }}
      version: ${{ steps.matrix.outputs.version }}
      # The two halves of the upload destination, resolved once here so every package and the run
      # summary agree on them.
      ref_slug: ${{ steps.matrix.outputs.ref_slug }}
      upload_stamp: ${{ steps.matrix.outputs.upload_stamp }}
      # Commit the build checks out; empty for push and dispatch, which build the triggered commit.
      slot_commit: ${{ steps.matrix.outputs.slot_commit }}
      buildable: ${{ steps.matrix.outputs.buildable }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      pccl_tests_sha: ${{ steps.pccl_tests.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
          persist-credentials: false

      - name: Resolve the pccl-tests commit
        id: pccl_tests
        # Every row packages pccl-tests, and all rows of one run have to build against the same
        # commit: resolving it once here keeps them consistent even when main advances while the
        # rest of the matrix is still queued. The ref stays a value from this file, never an
        # input, so a scheduled run cannot be pointed at arbitrary branch content.
        run: |
          set -euo pipefail
          sha=""
          for attempt in 1 2 3; do
            sha=$(git ls-remote https://github.com/t-head/pccl-tests.git refs/heads/main 2>/dev/null \
              | awk 'NR==1 {print $1}')
            if [ -n "${sha}" ]; then
              break
            fi
            echo "::warning::could not resolve the pccl-tests main commit (attempt ${attempt}/3)"
            sleep 15
          done
          if [ -z "${sha}" ]; then
            echo "::error::could not resolve the pccl-tests main commit"
            exit 1
          fi
          echo "pccl-tests commit: ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve matrix and artifact version
        id: matrix
        shell: bash
        # `inputs` is only populated for workflow_dispatch/workflow_call; for push events it
        # is an empty string, so every input needs a `||` fallback matching its declared default.
        env:
          OS_VERSIONS: ${{ inputs.os_versions || '["ubuntu2004","ubuntu2204","ubuntu2404","alios7","alios8","alinux3","alinux4"]' }}
          HGGCRT_VERSIONS: ${{ inputs.hggcrt_versions || '["12","13"]' }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version || '' }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '8' }}
          # Resolved by the step above; the note of a pccl-tests item names the commit that package
          # was built from, which is not the pccl one.
          PCCL_TESTS_SHA: ${{ steps.pccl_tests.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          SOURCE_DIR = Path("pccl")

          # (os label, hggcrt, SDK run package name, container image)
          # Images are plain OS base images: the SDK .run that matches the OS and the HGGCRT
          # runtime is downloaded and installed by the tar build script via sdk_url/sdk_name.
          SDK_BASE_URL = "https://download.t-head.cn/artifactory/ptgai-generic-release/PPU_SDK/v2.2.1"
          BUILD_TABLE = [
              ("ubuntu2004", "12", "ppu_hggcrt2_ubuntu2004-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/ubuntu:20.04"),
              ("ubuntu2204", "12", "ppu_hggcrt2_ubuntu2204-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/ubuntu:22.04"),
              ("ubuntu2404", "12", "ppu_hggcrt2_ubuntu2404-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/ubuntu:24.04"),
              ("ubuntu2404", "13", "ppu_hggcrt3_ubuntu2404-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/ubuntu:24.04"),
              ("alios7", "12", "ppu_hggcrt2_alios7u2-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alios7u2-min:20220601"),
              ("alios7", "13", "ppu_hggcrt3_alios7u2-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alios7u2-min:20220601"),
              ("alinux3", "12", "ppu_hggcrt2_afa3-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alinux3:latest"),
              ("alinux3", "13", "ppu_hggcrt3_afa3-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alinux3:latest"),
              # The alios8u image reports itself as Alibaba Cloud Linux 3, so it installs from the
              # alinux/3 mirror; alinux4 needs the extra os/ path segment of the v4 mirror layout.
              ("alios8", "12", "ppu_hggcrt2_alios8u2-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alios8u:latest"),
              ("alinux4", "12", "ppu_hggcrt2_afa4-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alinux4:latest"),
              ("alinux4", "13", "ppu_hggcrt3_afa4-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/alinux4:latest"),
              # A second ubuntu2404 / hggcrt13 row whose packages are reserved for the test pipeline.
              # The optional 5th element pins the package name; the row then builds with
              # <pkg_name>_build.sh (pccl_for_test_hggcrt13_ubuntu24_build.sh, a copy of
              # pccl_hggcrt13_tar_build.sh that only targets ubuntu 24.04). Same image and SDK as
              # the ubuntu2404 / hggcrt13 row above.
              ("ubuntu2404", "13", "ppu_hggcrt3_ubuntu2404-2.2.1-184ee6.run",
               "download.t-head.cn/docker_base/ubuntu:24.04", "pccl_for_test_hggcrt13_ubuntu24"),
          ]
          OS_LABELS = sorted({row[0] for row in BUILD_TABLE})
          HGGCRT_LABELS = sorted({row[1] for row in BUILD_TABLE})
          PATH_PATTERN = r"[A-Za-z0-9][A-Za-z0-9._+-]*"


          def fail(message):
              # Workflow commands are only turned into annotations when printed on stdout.
              print(f"::error::{message}", flush=True)
              raise SystemExit(1)


          def parse_filter(raw, label, allowed):
              try:
                  values = json.loads(raw)
              except (TypeError, ValueError):
                  fail(f"{label} must be a JSON array")
              if not isinstance(values, list) or not values:
                  fail(f"{label} must be a non-empty JSON array")
              normalized = []
              for value in values:
                  if isinstance(value, int) and label == "hggcrt_versions":
                      value = str(value)
                  if value not in allowed:
                      fail(f"{label} contains unsupported value {value!r}; allowed: {', '.join(allowed)}")
                  if value not in normalized:
                      normalized.append(value)
              return normalized


          def resolve_slot(now):
              # The nightly slot is 19:00 UTC+8. GitHub only ever queues a slot late, never early, so
              # a run that starts before 19:00 belongs to the previous day's slot.
              day = now if now.hour >= 19 else now - timedelta(days=1)
              return day.replace(hour=19, minute=0, second=0, microsecond=0)


          def resolve_version(raw, event_name):
              # The value names the upload directory, so keep it to a single safe token.
              if raw:
                  if not re.fullmatch(PATH_PATTERN, raw):
                      fail("artifact_version must contain only letters, digits and . _ + -")
                  return raw
              now = datetime.now(timezone(timedelta(hours=8)))
              if event_name == "schedule":
                  # Label the slot instead of the moment this job happened to run, so the upload
                  # path of a night does not move with the scheduler delay.
                  return resolve_slot(now).strftime("%Y-%m-%d-1900")
              # A push or a manual dispatch is not the nightly slot, so the real start time tells
              # two builds of the same day apart.
              return now.strftime("%Y-%m-%d-%H%M")


          def resolve_slot_commit(slot_start):
              # A delayed run must still build the code as of the slot, not whatever was pushed
              # while it queued, so the default-branch commit at the slot is resolved explicitly.
              for revision in ("origin/main", "HEAD"):
                  try:
                      found = subprocess.run(
                          ["git", "-C", str(SOURCE_DIR), "rev-list", "-1",
                           f"--before={slot_start.isoformat()}", revision],
                          check=True, capture_output=True, text=True).stdout.strip()
                  except (subprocess.CalledProcessError, FileNotFoundError):
                      continue
                  if found:
                      return found
              print("::warning::could not resolve the default-branch commit of the slot; "
                    "building the commit that triggered the run", flush=True)
              return ""


          def sdk_identity(sdk_name):
              # The installer file name carries the identity that PPU_SDK/release.yaml records in its
              # `version` field (<sdk version>-<build hash>), so the note can be built here before the
              # SDK is installed. The build step compares the two once it is.
              match = re.search(r"-(\d+\.\d+\.\d+)-([0-9A-Za-z]+)\.run$", sdk_name)
              if not match:
                  return {"branch": "unknown", "commit": "unknown"}
              return {"branch": match.group(1), "commit": match.group(2)}


          selected_os = parse_filter(os.environ["OS_VERSIONS"], "os_versions", OS_LABELS)
          selected_hggcrt = parse_filter(os.environ["HGGCRT_VERSIONS"], "hggcrt_versions", HGGCRT_LABELS)
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          now = datetime.now(timezone(timedelta(hours=8)))
          version = resolve_version(os.environ.get("ARTIFACT_VERSION", "").strip(), event_name)
          # Only a scheduled run is pinned; a push or a dispatch builds exactly what it triggered on.
          slot_commit = resolve_slot_commit(resolve_slot(now)) if event_name == "schedule" else ""
          # The upload directory is comm.<ref>-<stamp> and is shared by every item of the run: the
          # label loses its dashes (2026-11-17-1900 -> 202611171900) and the ref keeps only
          # characters a path accepts, so callers can build the URL and no two runs collide.
          upload_stamp = re.sub(r"[^A-Za-z0-9._]", "_", version.replace("-", ""))
          ref_slug = re.sub(r"[^A-Za-z0-9._-]", "_", os.environ.get("GITHUB_REF_NAME") or "unknown")
          ref_slug = ref_slug.strip("_") or "unknown"

          entries = []
          # What an artifact page shows as the note of an item. The source half follows the package,
          # so a pccl-tests item names the pccl-tests commit it was built from instead of the pccl
          # one, and the sail half names the SDK that row compiled against.
          note_branch = os.environ.get("GITHUB_REF_NAME") or "unknown"
          note_commit = slot_commit or os.environ.get("GITHUB_SHA", "")
          note_tests_commit = os.environ.get("PCCL_TESTS_SHA", "")

          def extra_info_for(package, sdk_name):
              # `extra_info` is one free-form field, so the note travels as a single value under a
              # single key: <repo>-<branch>-<sha7>@sail-<SDK version>-<SDK build hash>. A branch name
              # may itself contain dashes and slashes, so the value stays opaque and only the reader
              # that parses it decides how to split it.
              sdk = sdk_identity(sdk_name)
              sail = f"sail-{sdk['branch']}-{sdk['commit']}"
              if package == "pccl-tests":
                  note = f"pccl-tests-main-{note_tests_commit[:7] or 'unknown'}@{sail}"
              else:
                  note = f"pccl-{note_branch}-{note_commit[:7] or 'unknown'}@{sail}"
              return json.dumps({"comment": note}, separators=(",", ":"))

          # One transfer-back call per package: a regular row delivers the pccl tarball and the
          # pccl-tests tarball, the for-test row delivers its bundle as one more item.
          uploads = []
          for row in BUILD_TABLE:
              os_label, hggcrt, sdk_name, image = row[:4]
              # Rows carry an optional 5th element: the package name of an extra build that targets
              # the same OS and runtime for a different consumer. Everything that has to stay
              # unique per row (artifact, workspace dir, output dir) therefore hangs off this
              # package name instead of the os/hggcrt pair, which those rows share.
              pkg_name = row[4] if len(row) > 4 else f"pccl_hggcrt{hggcrt}_{os_label}"
              for_test = "_for_test_" in pkg_name
              if os_label not in selected_os or hggcrt not in selected_hggcrt:
                  continue
              if not image:
                  # Job-level `if` cannot reference `matrix`, so empty-image rows must never
                  # reach the matrix; fail here with an actionable message instead.
                  fail(f"entry ({os_label}, hggcrt{hggcrt}) is selected but has no container image configured")
              row_key = pkg_name[len("pccl_"):]
              # Identifies the row in the UI and in the run summary; the for-test row must not read
              # like its twin.
              label = f"{os_label} (hggcrt{hggcrt}{' for test' if for_test else ''})"
              tests_pkg_name = f"pccl_tests_{row_key}"
              # Empty for the regular rows. A for-test row ships one archive holding the whole
              # ${build_output} tree instead of the two separate packages.
              bundle_name = f"{pkg_name}_bundle" if for_test else ""
              entries.append({
                  "os": os_label,
                  "hggcrt": hggcrt,
                  "label": label,
                  # Distinct artifact name per package, so the transfer-back call below addresses
                  # exactly one of them.
                  "pkg_name": pkg_name,
                  # The same job also packages pccl-tests, so one row delivers both tarballs.
                  "tests_pkg_name": tests_pkg_name,
                  "bundle_name": bundle_name,
                  "output_dir": f"output_{row_key}",
                  "build_script": f"{pkg_name}_build.sh" if for_test else f"pccl_hggcrt{hggcrt}_tar_build.sh",
                  # The script wgets sdk_url into sdk_name and installs it under ${source_home}.
                  "sdk_url": f"{SDK_BASE_URL}/{sdk_name}",
                  "sdk_name": sdk_name,
                  "image": image,
              })
              # The artifact name is what the transfer-back call addresses, and the file a consumer
              # downloads is that name plus .zip. The edition tells the release packages of a row
              # apart from the bundle that only the test pipeline consumes.
              packages = [(bundle_name, "pccl", "test")] if for_test else [
                  (pkg_name, "pccl", "standard"),
                  (tests_pkg_name, "pccl-tests", "standard"),
              ]
              for artifact, package, edition in packages:
                  uploads.append({
                      "artifact": artifact,
                      "file": f"{artifact}.tar.gz",
                      "package": package,
                      "edition": edition,
                      "os": os_label,
                      "hggcrt": hggcrt,
                      "label": label,
                      # The item's extra_info property is the note, so it has to follow the package:
                      # the pccl and bundle items name the pccl source, the pccl-tests item names
                      # the pccl-tests commit.
                      "extra_info": extra_info_for(package, sdk_name),
                  })
          if not entries:
              fail("the selected os_versions/hggcrt_versions combination produced an empty matrix")

          buildable = len(entries)
          print(f"matrix entries: {buildable}, all with container images")
          print(f"artifact version: {version}")
          print(f"upload destination directory: comm.{ref_slug}-{upload_stamp}/")
          print(f"built commit: {slot_commit or os.environ.get('GITHUB_SHA', 'triggered commit')}")
          print(f"artifact extra_info: {sorted({item['extra_info'] for item in uploads})}")
          print(f"packages to transfer back: {len(uploads)}")
          # `max-parallel` is consumed through fromJSON at job level, where a non-numeric value
          # fails the whole matrix, so normalise the input here instead of trusting the dispatcher.
          raw_parallel = (os.environ.get("MAX_PARALLEL") or "").strip()
          try:
              max_parallel = max(1, int(raw_parallel))
          except ValueError:
              max_parallel = 8
          print(f"max parallel rows: {max_parallel}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": entries}, separators=(",", ":")) + "\n")
              output.write("upload_matrix=" + json.dumps({"include": uploads}, separators=(",", ":")) + "\n")
              output.write(f"version={version}\n")
              output.write(f"ref_slug={ref_slug}\n")
              output.write(f"upload_stamp={upload_stamp}\n")
              output.write(f"slot_commit={slot_commit}\n")
              output.write(f"buildable={buildable}\n")
              output.write(f"max_parallel={max_parallel}\n")
          PY

  # One job per OS / HGGCRT pair. Compilation only needs CPU, so the distribution image is started
  # with docker inside the job instead of in a scheduler worker pod.
  # Note: job-level `if` is evaluated before the matrix is expanded, so it cannot
  # reference `matrix`; unconfigured rows are rejected in the prepare job instead.
  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: x86-ubuntu2404-8-32
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # One row per runner: rows beyond the pool size simply stay queued, so this only has to be
      # kept at or below the number of online x86-ubuntu2404-8-32 runners.
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      # Paths as seen inside the build container: the workspace is bind-mounted at
      # /workspace/source, so the checkout shows up as /workspace/source/pccl exactly as it did
      # under the worker pod, and the build scripts need no change.
      source_home: /workspace/source
      build_output: /workspace/source/${{ matrix.output_dir }}
      # Host-side view of the same directory, used by the verification and upload steps.
      workspace_output: ${{ github.workspace }}/${{ matrix.output_dir }}
      # Base images carry no PPU SDK: the tar build script downloads sdk_url as sdk_name and
      # installs it under ${source_home}, then sources ${source_home}/PPU_SDK/envsetup.sh.
      sdk_url: ${{ matrix.sdk_url }}
      sdk_name: ${{ matrix.sdk_name }}
      pkg_name: ${{ matrix.pkg_name }}
      # The tar build script packages pccl-tests against the pccl build of this job and writes this
      # tarball next to the pccl one.
      pccl_tests_pkg_name: ${{ matrix.tests_pkg_name }}
      # Set for the for-test row only. The build script then tars the whole ${build_output} tree
      # into ${build_output}/${bundle_name}.tar.gz, which is the single package that row delivers.
      bundle_name: ${{ matrix.bundle_name }}
      # Passed to build.sh as --cpu_num; 0 means "as many make jobs as cores", which keeps the
      # hosted runner's 4 vCPU / 16 GB from being oversubscribed by an unbounded make -j.
      cpu: ${{ inputs.cpu_num || '0' }}
      package_version: ${{ inputs.package_version || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # A nightly run builds the code as of 19:00 UTC+8 even when the run is queued late; push
          # and dispatch runs leave the ref empty and get the triggered commit.
          ref: ${{ needs.prepare.outputs.slot_commit || github.sha }}
          fetch-depth: 0
          path: pccl
          persist-credentials: false

      # pccl-tests ships from this job (see the header), so its source is checked out next to pccl
      # and the same tar build script packages both against the library built a moment earlier.
      - name: Check out pccl-tests
        uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          # The commit `prepare` resolved from main, not an input: this workflow also runs on
          # schedule with the default branch's privileges, so a caller-supplied ref would let that
          # privileged context execute arbitrary branch content (CodeQL cache poisoning / pwn request).
          ref: ${{ needs.prepare.outputs.pccl_tests_sha }}
          fetch-depth: 0
          path: pccl-tests
          persist-credentials: false

      - name: Reset the staging directory
        # `actions/checkout` only cleans the two source paths it manages, so on a persistent runner
        # this row would inherit the previous run's tarballs: the verification step would judge them
        # and the upload step would publish them.
        run: |
          set -euo pipefail
          rm -rf "${workspace_output}" 2>/dev/null || sudo -n rm -rf "${workspace_output}"
          mkdir -p "${workspace_output}"

      - name: Reclaim disk space
        # Only the GitHub-hosted image carries ~25 GB of preinstalled toolchains this build never
        # touches. On a self-managed runner those paths may be absent and sudo may not be
        # passwordless, so neither case may fail the job.
        run: |
          set -euo pipefail
          df -h /
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            if [ ! -e "${dir}" ]; then
              continue
            fi
            sudo -n rm -rf "${dir}" 2>/dev/null || echo "::warning::could not remove ${dir} (no passwordless sudo)"
          done
          df -h /

      - name: Pull the distribution image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Every row may land on a runner that already has the image, but there is no guarantee,
          # so retry a few times before giving up on one flaky registry answer.
          for attempt in 1 2 3; do
            if docker pull "${IMAGE}"; then
              exit 0
            fi
            echo "::warning::docker pull ${IMAGE} failed (attempt ${attempt}/3)"
            sleep 30
          done
          echo "::error::could not pull ${IMAGE}"
          exit 1

      - name: Build pccl and pccl-tests tarballs in the distribution image
        # docker rather than a job container: the CentOS 7 based alios7 image cannot run the
        # node-based actions, so checkout and upload stay on the hosted runner and only the
        # compilation happens inside the distribution image. The workspace is bind-mounted at
        # /workspace/source, the path the scheduler used to stage it to, so no script changes.
        run: |
          set -euo pipefail
          # The inner script is written to a file and executed inside the container: the job env
          # is forwarded with -e, and a heredoc keeps the quoting of the build commands intact.
          cat > "${RUNNER_TEMP}/build-inside.sh" <<'INSIDE'
          set -e
          # Hand the bind-mounted tree back to the runner user even when the build fails: the
          # container runs as root, and root-owned leftovers make the next actions/checkout clean
          # fail on a persistent runner.
          trap 'chown -R "${HOST_UID}:${HOST_GID}" /workspace/source 2>/dev/null || true' EXIT
          : "${build_output:?build_output must be forwarded into the build container}"
          cd /workspace/source
          # The image bakes in unreachable internal PIP / git redirects.
          unset PIP_INDEX_URL 2>/dev/null || true
          # Only the older SDK images ship git. The docker_base images have none, and under
          # `set -e` an unconditional `git config` kills the step before the build starts
          # (first docker_base run failed with "/bin/bash: line 8: git: command not found").
          # Both the redirect cleanup and safe.directory are only meaningful when git exists.
          if command -v git >/dev/null 2>&1; then
            # Images can bake in a git redirect to an internal mirror. Clear every redirect
            # generically instead of naming the private endpoint in this public file.
            while read -r key; do
              [ -n "${key}" ] || continue
              git config --global --unset-all "${key}" 2>/dev/null || true
            done < <(git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '{print $1}')
            git config --global --add safe.directory '*'
          fi

          echo "######################### $(date +%Y%m%d%H%M%S) Build ${pkg_name} in ${{ matrix.image }} ##########################"
          bash "pccl/.github/workflows/scripts/${{ matrix.build_script }}"
          # `prepare` derived the note's sail part from this row's installer file name; the SDK's own
          # release.yaml is the authority on that identity. Its `version` is recorded as
          # "<version>-<hash>", so a '+' separator is normalised before the comparison and the raw
          # value is echoed either way. A mismatch would publish a note pointing at a different SDK
          # than the package was built against, so it fails here instead.
          expected_sdk="$(printf '%s' "${sdk_name}" | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)-([0-9A-Za-z]+)\.run$/\1-\2/')"
          sdk_release="${source_home}/PPU_SDK/release.yaml"
          if [ ! -f "${sdk_release}" ]; then
            echo "::warning::${sdk_release} is missing; the artifact note keeps the installer-derived SDK identity ${expected_sdk}"
          else
            actual_raw="$(awk '/^[[:space:]]*version:[[:space:]]*/ {print $2; exit}' "${sdk_release}")"
            actual_sdk="$(printf '%s' "${actual_raw}" | sed -E 's/^v//' | tr '+' '-')"
            echo "SDK release.yaml version: ${actual_raw:-<empty>} (the installer name implies ${expected_sdk})"
            if [ "${actual_sdk}" != "${expected_sdk}" ]; then
              echo "::error::PPU_SDK/release.yaml reports version ${actual_raw:-<empty>} but ${sdk_name} implies ${expected_sdk}; reconcile the SDK package name with its release.yaml before the note can be trusted"
              exit 1
            fi
          fi
          INSIDE
          docker run --rm \
            --user root \
            -v "${GITHUB_WORKSPACE}:/workspace/source" \
            -v "${RUNNER_TEMP}/build-inside.sh:/tmp/build-inside.sh:ro" \
            -w /workspace/source \
            -e source_home \
            -e build_output \
            -e sdk_url \
            -e sdk_name \
            -e pkg_name \
            -e pccl_tests_pkg_name \
            -e bundle_name \
            -e package_version \
            -e cpu \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "${{ matrix.image }}" \
            bash /tmp/build-inside.sh
      - name: Verify the expected packages were produced
        # Host-side check on the files the container wrote: the container's EXIT trap already handed
        # ownership back to the runner user, so this step only has to find the tarballs where the
        # upload step will read them, and to look inside them, so an empty or wrongly staged archive
        # is caught here instead of by whoever downloads it. Each member list goes through a file
        # instead of a `tar -tzf | grep -qx` pipeline: with `pipefail` on, a tar that dies of SIGPIPE
        # after grep matched reads as "member missing", and a tar that cannot read the archive looks
        # the same, so the members themselves are reported when a check fails.
        run: |
          set -euo pipefail

          verify_tarball() {
            local tarball="$1"
            local member="$2"
            local listing="${RUNNER_TEMP}/${tarball##*/}.entries"
            ls -lh "${tarball}"
            if ! tar -tzf "${tarball}" >"${listing}" 2>"${listing}.err"; then
              echo "::error::${tarball##*/} cannot be read: $(tr '\n' ' ' <"${listing}.err" | cut -c1-400)"
              exit 1
            fi
            echo "${tarball##*/} holds $(wc -l <"${listing}") entries"
            head -n 20 "${listing}"
            grep -qxE "${member}" "${listing}" || {
              echo "::error::${tarball##*/} has no ${member}; entries: $(tr '\n' ' ' <"${listing}" | cut -c1-500)"
              exit 1
            }
          }

          if [ -n "${bundle_name}" ]; then
            tarballs="${workspace_output}/${bundle_name}.tar.gz"
          else
            tarballs="${workspace_output}/${pkg_name}.tar.gz ${workspace_output}/${pccl_tests_pkg_name}.tar.gz"
          fi
          for tarball in ${tarballs}; do
            if [ ! -f "${tarball}" ]; then
              echo "::error::${tarball} was not produced"
              ls -la "${workspace_output}" 2>&1 | head -n 30 || true
              exit 1
            fi
          done

          echo "######################### $(date +%Y%m%d%H%M%S) Packages of ${pkg_name}${bundle_name:+, bundle ${bundle_name}} ##########################"

          if [ -n "${bundle_name}" ]; then
            # The test box has to carry a runnable pccl build; the pccl-tests sources sit next to it
            # and the SDK is not part of the bundle at all (the consumer installs it).
            verify_tarball "${workspace_output}/${bundle_name}.tar.gz" '(\./)?pccl_build/bin/pcclras'
          else
            # Each release package must still carry its own top level: pccl/ for the library
            # package, comm_tools/ for the perf binaries.
            verify_tarball "${workspace_output}/${pkg_name}.tar.gz" '(\./)?pccl/envsetup.sh'
            verify_tarball "${workspace_output}/${pccl_tests_pkg_name}.tar.gz" '(\./)?comm_tools/single_process/all_reduce_perf'
          fi

      - name: Upload the pccl tarball as run artifact
        # Only the regular rows deliver these two packages.
        if: ${{ matrix.bundle_name == '' }}
        uses: actions/upload-artifact@v4
        with:
          # Fixed per package: the artifact name is the only thing the transfer-back call knows,
          # and a name without a run suffix keeps the published file name stable (<pkg_name>.zip).
          name: ${{ matrix.pkg_name }}
          # A re-run of the same run re-uploads this very name, which v4 rejects unless it may
          # replace; each package has its own name, so nothing is overwritten across packages.
          overwrite: true
          # One file at the top level of the artifact, so the stored zip holds a single entry.
          path: ${{ matrix.output_dir }}/${{ matrix.pkg_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload the pccl-tests tarball as run artifact
        if: ${{ matrix.bundle_name == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tests_pkg_name }}
          overwrite: true
          path: ${{ matrix.output_dir }}/${{ matrix.tests_pkg_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload the for-test bundle as run artifact
        # That row delivers one archive instead of the two packages above, so exactly one of the
        # three upload steps runs per row.
        if: ${{ matrix.bundle_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle_name }}
          overwrite: true
          path: ${{ matrix.output_dir }}/${{ matrix.bundle_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # One transfer-back call per package. The reusable workflow publishes the package artifact as the
  # zip it already is, so a consumer downloads <artifact>.zip and unpacks the single tarball inside.
  upload:
    name: Transfer back ${{ matrix.artifact }}
    needs: [prepare, build]
    # A failed row must not keep the other packages away from the artifact server: what did build is
    # still transferred, and a package whose artifact is missing fails here instead of being skipped
    # silently.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    # The called workflow downloads the artifact with the token of this job, so the scope it needs
    # is granted on this side: a called workflow can narrow permissions but never add them.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # Transfers are cheap next to a compile, so the cap only keeps the parallel uploads from
      # swamping the destination; it reuses the build input instead of adding another one.
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.upload_matrix) }}
    uses: t-head/ci-infra/.github/workflows/upload-artifact-properties.yml@main
    with:
      artifact_name: ${{ matrix.artifact }}
      # comm.<ref>-<stamp>: one destination directory per run, shared by every package.
      version: comm.${{ needs.prepare.outputs.ref_slug }}-${{ needs.prepare.outputs.upload_stamp }}
      package_type: binary
      package_name: ${{ matrix.package }}
      package_version: main
      # Per-package properties, so a query can pick one OS / runtime / edition out of the directory.
      os: ${{ matrix.os }}
      runtime: HGGCRT ${{ matrix.hggcrt }}
      package_edition: ${{ matrix.edition }}
      # branch, tag, commit, log_url, run_id and run_attempt are derived from the caller context;
      # the note is the one-key JSON comment that names the source the item was built from and the
      # SDK it was built against, which is what an artifact page shows for a package.
      extra_info: ${{ matrix.extra_info }}
      template_repository: t-head/ci-infra
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}

  summary:
    name: Build summary
    needs: [prepare, build, upload]
    if: always()
    runs-on: x86-ubuntu2404-8-32
    timeout-minutes: 10
    steps:
      - name: Write matrix summary
        shell: bash
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          UPLOAD_JSON: ${{ needs.prepare.outputs.upload_matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
          UPLOAD_STAMP: ${{ needs.prepare.outputs.upload_stamp }}
          SLOT_COMMIT: ${{ needs.prepare.outputs.slot_commit }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          env = os.environ
          ref_slug = env.get("REF_SLUG") or "unknown"
          stamp = env.get("UPLOAD_STAMP") or "unknown"
          # Every package lands in this one directory, so it is reported once instead of per row.
          upload_dir = f"`comm.{ref_slug}-{stamp}/`" if stamp != "unknown" else "n/a"
          print("### pccl build artifacts\n")
          print("| item | value |\n| --- | --- |")
          print(f"| label | {env.get('VERSION') or 'n/a'} |")
          print(f"| upload directory | {upload_dir} |")
          print(f"| built commit | `{env.get('SLOT_COMMIT') or 'triggered commit'}` |")
          print(f"| artifacts | [run {env.get('RUN_ID', '')}, attempt {env.get('RUN_ATTEMPT', '')}]({env.get('RUN_URL', '')}) |")
          print(f"| prepare | {env.get('PREPARE_RESULT', '')} |")
          print(f"| build | {env.get('BUILD_RESULT', '')} |")
          print(f"| transfer back | {env.get('UPLOAD_RESULT', '')} |")

          rows = json.loads(env.get("MATRIX_JSON") or "{}").get("include", [])
          uploads = json.loads(env.get("UPLOAD_JSON") or "{}").get("include", [])
          if not rows:
              print("\nNo matrix was generated.")
              raise SystemExit(0)
          # Two rows can share one OS/runtime pair (the extra for-test row does), so the row label
          # identifies a line, and the packages of a row share one cell instead of repeating it.
          by_row = {}
          for item in uploads:
              by_row.setdefault(item["label"], []).append(item)
          print("\n| row | github artifacts | uploaded zips | image |")
          print("| --- | --- | --- | --- |")
          for row in rows:
              # A regular row leaves two artifacts in the run, the bundle row leaves one.
              if row.get("bundle_name"):
                  artifacts = f"`{row['bundle_name']}`"
              else:
                  artifacts = f"`{row['pkg_name']}`<br>`{row['tests_pkg_name']}`"
              items = by_row.get(row["label"], [])
              zips = "<br>".join(f"`{item['artifact']}.zip`" for item in items) or "not transferred back"
              print(f"| {row['label']} | {artifacts} | {zips} | `{row['image']}` |")
          PY
