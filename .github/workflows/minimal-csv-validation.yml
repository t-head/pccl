name: Minimal CSV hardware validation (experimental)

on:
  push:
    branches: [experiment/minimal-csv-executor]

permissions:
  contents: read

concurrency:
  group: minimal-csv-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P
  VALIDATION_CARDS: '8'
  PCCL_TESTS_REVISION: 394556512e87259e9ffa25225632c46b0a0bbcd5

jobs:
  prepare:
    name: Validate CSV contracts and stage dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the standard-library executor and validate real selections
        working-directory: pccl
        run: |
          python3 -S -B -W error::ResourceWarning -m unittest discover \
            -s tests/xtest -p 'test_run_cases.py' -v
          python3 -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'tests/xtest')
          import run_cases
          from manifest import PCCL_TESTS_REVISION, RUNNER_HASHES

          runner = Path('../pccl-tests').resolve()
          revision = subprocess.check_output(['git', '-C', str(runner), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == PCCL_TESTS_REVISION == os.environ['PCCL_TESTS_REVISION']
          for name, expected in RUNNER_HASHES.items():
              assert hashlib.sha256((runner / name).read_bytes()).hexdigest() == expected
          metadata = json.loads(Path('tests/xtest/minimal-csv/export.json').read_text())
          assert metadata['runner_revision'] == revision
          expected = {('standard', 1): 71, ('standard', 2): 1, ('notsm', 1): 37}
          for (profile, nodes), count in expected.items():
              selected = run_cases.load_inputs(Path('tests/xtest/minimal-csv'), profile, nodes)
              assert len(selected['cases']) == count
              print(f'{profile} {nodes}-node selection: {count} Cases')
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          PY
      - name: Stage the pinned benchmark dependency
        run: |
          mkdir -p deps
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest deps filelock==3.20.3
          printf '%s  %s\n' \
            '4b0dda527ee31078689fc205ec4f1c1bf7d56cf88b6dc9426c4f230e46c2dce1' \
            'deps/filelock-3.20.3-py3-none-any.whl' | sha256sum --check -
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-csv-python-deps
          path: deps/
          if-no-files-found: error
          overwrite: true

  build-standard:
    name: Build standard once
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Build and archive standard output
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_standard
            mkdir -p "$build_output"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/build.sh
            test -f "$build_output/pccl/tests/xtest/run_cases.py"
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/build
            mkdir -p "$BUILD_ROOT"
            tar -czf "$BUILD_ROOT/output_standard.tar.gz" -C /workspace/source output_standard
            sha256sum "$BUILD_ROOT/output_standard.tar.gz" > "$BUILD_ROOT/output_standard.tar.gz.sha256"

  build-notsm:
    name: Build notsm once
    needs: [prepare]
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Build and archive notsm output
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_notsm
            mkdir -p "$build_output"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/notsm_build.sh
            test -f "$build_output/pccl/tests/xtest/run_cases.py"
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/build
            mkdir -p "$BUILD_ROOT"
            tar -czf "$BUILD_ROOT/output_notsm.tar.gz" -C /workspace/source output_notsm
            sha256sum "$BUILD_ROOT/output_notsm.tar.gz" > "$BUILD_ROOT/output_notsm.tar.gz.sha256"

  single-node:
    name: Single-node CSV (${{ matrix.profile }})
    needs: [prepare, build-standard, build-notsm]
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, notsm]
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: minimal-csv-python-deps
          path: deps
      - name: Restore the shared build and run single-node Cases
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          command: |
            set -euo pipefail
            umask 022
            cd /workspace/source
            export build_output=/workspace/source/output_${{ matrix.profile }}
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/build
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/results/${{ matrix.profile }}
            rm -rf "$RESULT_ROOT"
            mkdir -p "$RESULT_ROOT"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            sha256sum --check "$BUILD_ROOT/output_${{ matrix.profile }}.tar.gz.sha256"
            tar -xzf "$BUILD_ROOT/output_${{ matrix.profile }}.tar.gz" -C /workspace/source
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-env
            /workspace/minimal-csv-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links /workspace/source/deps \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            /workspace/minimal-csv-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$build_output/pccl/tests/xtest/minimal-csv" \
              --profile '${{ matrix.profile }}' --nodes 1 \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --output "$RESULT_ROOT"

  two-node:
    name: Two-node master-only CSV (16 ranks)
    needs: [prepare, build-standard]
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: minimal-csv-python-deps
          path: deps
      - name: Restore the standard build and run the two-node Case on master
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: 2
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /dev/infiniband
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            umask 022
            cd "$SOURCE_DIR"
            export build_output="$SOURCE_DIR/output_standard"
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/build
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/results/cluster
            rm -rf "$RESULT_ROOT"
            mkdir -p "$RESULT_ROOT"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            sha256sum --check "$BUILD_ROOT/output_standard.tar.gz.sha256"
            tar -xzf "$BUILD_ROOT/output_standard.tar.gz" -C "$SOURCE_DIR"
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-cluster-env
            /workspace/minimal-csv-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/deps" \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            export OMPI_MCA_plm_rsh_agent=cluster-ssh
            export OMPI_MCA_orte_base_help_aggregate=0
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            /workspace/minimal-csv-cluster-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$build_output/pccl/tests/xtest/minimal-csv" \
              --profile standard --nodes 2 \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --hostfile "$CLUSTER_HOSTS_FILE" \
              --output "$RESULT_ROOT"

  summary:
    name: Minimal CSV hardware gate
    needs: [prepare, build-standard, build-notsm, single-node, two-node]
    if: always()
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 20
    steps:
      - name: Reconcile all selected hardware results without publishing raw logs
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          import shutil
          import sys

          root = Path('/wl_nas/devops/pccl-minimal-csv/${{ github.run_id }}/results')
          public = Path('public-results')
          public.mkdir()
          expected = {'standard': 71, 'notsm': 37, 'cluster': 1}
          errors = []
          for name, count in expected.items():
              source = root / name
              target = public / name
              target.mkdir()
              try:
                  summary = json.loads((source / 'summary.json').read_text())
                  with (source / 'results.csv').open(newline='') as stream:
                      rows = list(csv.DictReader(stream))
                  if summary.get('total') != count or len(rows) != count:
                      errors.append(f'{name}: expected {count} results, got {summary.get("total")}/{len(rows)}')
                  if summary.get('counts', {}).get('PASSED') != count:
                      errors.append(f'{name}: results are not all PASSED: {summary.get("counts")}')
                  for row in rows:
                      if row['status'] != 'PASSED':
                          errors.append(f'{name}: {row["plan"]}/{row["suite"]}/{row["name"]}: {row["status"]}')
                      elif not (source / row['plan'] / row['suite'] / row['name'] / 'raw.log').is_file():
                          errors.append(f'{name}: missing raw log for {row["name"]}')
                  for filename in ('summary.json', 'results.csv'):
                      shutil.copyfile(source / filename, target / filename)
                  print(f'{name}: {summary.get("counts", {}).get("PASSED", 0)}/{count} passed')
              except (OSError, ValueError, json.JSONDecodeError) as error:
                  errors.append(f'{name}: missing or invalid results: {error}')
          metrics = list((root / 'standard').glob('*/*/*/metrics.csv'))
          if len(metrics) != 3:
              errors.append(f'standard: expected 3 performance metrics files, got {len(metrics)}')
          for source in metrics:
              target = public / 'standard' / source.parent.relative_to(root / 'standard')
              target.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target / 'metrics.csv')
          for error in errors:
              print(f'::error::{error}')
          sys.exit(bool(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-csv-validation-summary
          path: public-results/
          if-no-files-found: error
          overwrite: true
