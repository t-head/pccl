name: PCCL Review Events

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # This unprivileged signal works for fork reviews. It uploads no artifacts
      # and has no checkout, secrets, or write token. The trusted workflow_run
      # evaluator independently reads the PR/reviews from GitHub's API.
      - run: 'true'
