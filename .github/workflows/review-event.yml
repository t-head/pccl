name: PCCL review trigger
run-name: "PCCL review for PR #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # The trusted workflow_run handler reads reviews from GitHub, including for fork PRs.
      - run: echo "Review changed. Refreshing Maintainer approval."
