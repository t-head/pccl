name: Refresh PCCL review gate
run-name: "${{ github.event_name == 'workflow_dispatch' && format('PCCL review for PR #{0}', inputs.pr_number) || github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows: [Recommend PCCL reviewers, PCCL review trigger, PCCL invitation trigger]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: number

permissions: {}

# Every source uses the same PR title. Each refresh reads the latest verdicts.
concurrency:
  group: "maintainer-approval-${{ github.event_name == 'workflow_dispatch' && format('PCCL review for PR #{0}', inputs.pr_number) || github.event.workflow_run.display_title }}"
  cancel-in-progress: false

jobs:
  approval:
    if: >-
      github.repository == 't-head/pccl' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: "review-state-${{ github.event_name == 'workflow_dispatch' && format('PCCL review for PR #{0}', inputs.pr_number) || github.event.workflow_run.display_title }}"
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current module Reviewer and Maintainer approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/maintainer_approval.py
