name: pccl checkin

# Triggers: manual / PR / push
on:
  workflow_dispatch:                                       # manual trigger (web/API)
  pull_request:
    branches: [main]                                       # default branch is main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]                                       # run again after merge

permissions:
  contents: read
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: ci-pccl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # new runs cancel outdated ones

# Configure required checks in the target branch ruleset to enforce merge gates.
# Defining this workflow alone does not prevent merging.
jobs:
  # Stage 1: Secret scan precheck (org-level reusable workflow).
  # Only meaningful for PR events; skipped for push / workflow_dispatch.
  precheck:
    name: Pre-check (Secret Scan)
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  commit-checks:
    name: Pre-check (Commit Message & DCO)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check contribution commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          commits = git('rev-list',
                        os.environ['BASE_SHA'] + '..' + os.environ['HEAD_SHA']).splitlines()
          errors = []
          if len(commits) != 1:
              errors.append(f'PR must contain exactly one commit; found {len(commits)}. Squash the contribution commits before pushing.')
          for sha in commits:
              message = git('show', '-s', '--format=%B', sha)
              lines = message.splitlines()
              if not lines or not lines[0].strip():
                  errors.append(f'{sha[:12]}: title must not be empty')
              elif len(lines[0]) > 50:
                  print(f'::notice::{sha[:12]}: title exceeds the recommended 50 characters; consider shortening it')
              if len(lines) > 1 and lines[1] != '':
                  errors.append(f'{sha[:12]}: second line must be blank')
              issue_ref = r'(?i:\b(?:Refs|Closes|Fixes))[ \t]+(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[1-9][0-9]*\b|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[1-9][0-9]*\b'
              if not re.search(issue_ref, '\n'.join(lines[1:])):
                  errors.append(f'{sha[:12]}: missing issue reference in commit body')

              trailers = subprocess.check_output(
                  ['git', 'interpret-trailers', '--parse', '--no-divider'], input=message, text=True).splitlines()
              signoffs = [match.groups() for line in trailers
                          if (match := re.fullmatch(
                              r'Signed-off-by: (\S(?:.*\S)?) <([^<>\s]+@[^<>\s]+)>', line))]
              author = tuple(git('show', '-s', '--format=%an%x00%ae', sha).rstrip('\n').split('\0'))
              if not signoffs:
                  errors.append(f'{sha[:12]}: missing valid Signed-off-by trailer')
              elif author not in signoffs:
                  errors.append(f'{sha[:12]}: Signed-off-by name and email must match the commit author')
          for error in errors:
              print(error)
          print(f'Checked {len(commits)} contribution commits for message format and DCO.')
          sys.exit(bool(errors))
          PY

  # Stage 2: AI code review runs in parallel with prepare.
  # The review gate should verify the current PR head and the team's resolution
  # policy; the presence of an earlier Copilot review is not sufficient.
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: [precheck, commit-checks]
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: Human approval gate before running the expensive PPU CI.
  human-review:
    name: Human Review Gate
    needs: [prepare, ai-code-review]
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Read the test list so each test runs in its own isolated PPU pod.
  prepare:
    name: Prepare Test Matrix
    needs: [precheck, commit-checks]
    if: always() && (needs.precheck.result == 'success' || needs.precheck.result == 'skipped') && (needs.commit-checks.result == 'success' || needs.commit-checks.result == 'skipped')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    outputs:
      machines: ${{ steps.set-matrix.outputs.machines }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - id: set-matrix
        name: Generate test matrix from casecmd.list
        run: |
          python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          scripts = []
          with open('pccl/.github/workflows/scripts/casecmd.list') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if line.startswith('bash '):
                      scripts.append(line.split()[1])
          # One entry per PPU machine type, consumed by build and
          # build-test-notsm through a single-key dynamic matrix. Each machine
          # runs the same cases from casecmd.list through its own suffixed
          # script (run_<name>_test<suffix>.sh); the 810E copies additionally
          # export PCCL_NET_PLUGIN_ENABLE=1. The per-machine test jobs
          # (test-890P / test-810E) hardcode the same image and node selector,
          # so update both places when adding a machine type.
          machines = [
              {"name": "ZW-890P",
               "suffix": "_890P",
               "image": "download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005",
               "node_selector": "board-type=ZW-M890P",
               "nproc": 8},
              {"name": "OAM-810E",
               "suffix": "_810E",
               "image": "pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-eic-20261010",
               "node_selector": "board-type=OAM-810E",
               "nproc": 8},
          ]
          # The per-machine test jobs (test-890P / test-810E) drive their
          # script axes from STATIC matrices mirroring casecmd.list: dynamic
          # script axes never expand on this runner fleet (string, include,
          # two-key and even flat-object forms all collapsed into a single
          # literal-named skipped job; run 39920557638 kept the machines axis
          # expanding while the flat-object script axis still failed).
          # casecmd.list stays the test registry: adding a test means adding
          # the two suffixed scripts, a casecmd.list line, and one line in
          # each test job's static matrix. Validate the files exist so a
          # missing script fails loudly instead of silently skipping tests.
          missing = [s[:-3] + suffix + ".sh"
                     for suffix in ("_890P", "_810E")
                     for s in scripts
                     if not os.path.isfile('pccl/.github/workflows/scripts/' + s[:-3] + suffix + '.sh')]
          if missing:
              raise SystemExit('Missing test scripts: ' + ', '.join(missing))
          print('machines=' + json.dumps(machines))
          PYEOF
          # Echo the generated outputs into the job log for future debugging.
          cat "$GITHUB_OUTPUT"

  # Build once per machine type and archive the build output to NAS for the test jobs.
  build:
    name: Build (${{ matrix.machine.name }})
    needs: [prepare, human-review]
    if: always() && needs.prepare.result == 'success' && (needs.human-review.result == 'success' || (github.event_name != 'pull_request' && needs.human-review.result == 'skipped'))
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJson(needs.prepare.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: main
          path: pccl-tests
      - name: Build on PPU
        id: ppu-build
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ matrix.machine.image }}
          nnodes: 0
          nproc_per_node: ${{ matrix.machine.nproc }}
          node_selector: "${{ matrix.machine.node_selector }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            set -e
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL 2>/dev/null || true
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            # git checks repo ownership strictly inside containers.
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            echo "######################### $(date +%Y%m%d%H%M%S) Build pccl ##########################"
            export source_home=/workspace/source
            export build_output=/workspace/source/output_hggcrt13
            mkdir -p $build_output
            bash pccl/.github/workflows/scripts/build.sh

            echo "######################### $(date +%Y%m%d%H%M%S) Archive build output ##########################"
            NAS_BUILD_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/build_output/${{ matrix.machine.name }}"
            mkdir -p "$NAS_BUILD_DIR"
            tar -czf "$NAS_BUILD_DIR/output_hggcrt13.tar.gz" -C /workspace/source output_hggcrt13

            echo "######################### $(date +%Y%m%d%H%M%S) Record environment ##########################"
            python3 <<'PYEOF' > /workspace/source/output_hggcrt13/env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ matrix.machine.image }}",
                "config_name": "${{ matrix.machine.name }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            cp /workspace/source/output_hggcrt13/env_info.json "$NAS_BUILD_DIR/"
          cleanup_policy: on_success

  # Run each 890P test script in its own PPU pod for true physical isolation.
  # The script axis is STATIC, mirroring casecmd.list: dynamic script axes
  # never expand on this runner fleet (string, include, two-key and even
  # flat-object forms all collapsed into one literal-named skipped job, see
  # run 39920557638), while static matrices are proven by sailbandwidth and
  # DeepGEMM. Keep this list in sync with casecmd.list; the prepare job
  # validates that every registered script exists on disk. The machine
  # parameters live here directly.
  test-890P:
    name: Test 890P (${{ matrix.script }})
    needs: [prepare, build]
    # The explicit if is required. Without it the default success() condition
    # skips this job whenever any job in the transitive needs closure was
    # skipped (the PR-only gates are skipped on push and workflow_dispatch),
    # which kills the job BEFORE matrix expansion and leaves one literal
    # "${{ matrix.script }}" skipped entry; the matrix shape was never the
    # problem. Every job that must run on non-PR events here uses this
    # same always() + explicit-results pattern.
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success'
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        script:
          - run_common_test_890P.sh
          - run_register_test_890P.sh
          - run_memcpy_test_890P.sh
          - run_nonblocking_test_890P.sh
          - run_copyengine_test_890P.sh
          - run_customAllreduce_test_890P.sh
          - run_lsa_test_890P.sh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - name: Run test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=ZW-M890P"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            set -e
            unset PIP_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            echo "######################### $(date +%Y%m%d%H%M%S) Restore build output ##########################"
            NAS_BUILD_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/build_output/ZW-890P"
            mkdir -p /workspace/source
            tar -xzf "$NAS_BUILD_DIR/output_hggcrt13.tar.gz" -C /workspace/source

            echo "######################### $(date +%Y%m%d%H%M%S) Run ${{ matrix.script }} ##########################"
            cd /workspace/source/output_hggcrt13
            export TEST_ROOT=$(pwd)
            source /usr/local/PPU_SDK/envsetup.sh
            python3 -m pip install junit-xml filelock==3.20.0 || true

            echo "bash ${{ matrix.script }}" > /tmp/single_case.list
            set +e
            python3 /workspace/source/output_hggcrt13/pr-ut-runner.py \
              --suite-name "pccl PR Tests" \
              --caselist /tmp/single_case.list \
              --build-dir /workspace/source/output_hggcrt13
            TEST_EXIT_CODE=$?
            set -e

            NAS_RESULT_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/ZW-890P/${{ matrix.script }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005",
                "config_name": "ZW-890P",
                "board_type": "ZW-M890P",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
                "pccl_net_plugin_enable": os.environ.get("PCCL_NET_PLUGIN_ENABLE", ""),
                "hostname": command_output(["hostname"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success
      - name: Test summary (${{ matrix.script }})
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/ZW-890P/${{ matrix.script }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"

          echo "## Test: ${{ matrix.script }} on ZW-890P" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 pccl/.github/workflows/scripts/display-test-summary.py "$XML_FILE" --env-info "$ENV_FILE"

  # Run each 810E test script in its own PPU pod. The 810E tests require the
  # network plugin, so PCCL_NET_PLUGIN_ENABLE is exported for the whole pod
  # (the suffixed test scripts export it as well). The script axis is static
  # for the same reason as test-890P; keep it in sync with casecmd.list.
  test-810E:
    name: Test 810E (${{ matrix.script }})
    needs: [prepare, build]
    # See test-890P: the explicit if prevents the default success() skip
    # propagation from the PR-only gates on non-PR events.
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success'
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        script:
          - run_common_test_810E.sh
          - run_register_test_810E.sh
          - run_memcpy_test_810E.sh
          - run_nonblocking_test_810E.sh
          - run_copyengine_test_810E.sh
          - run_customAllreduce_test_810E.sh
          - run_lsa_test_810E.sh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - name: Run test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-eic-20261010
          nnodes: 0
          nproc_per_node: 8
          node_selector: "board-type=OAM-810E"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            set -e
            unset PIP_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            echo "######################### $(date +%Y%m%d%H%M%S) Restore build output ##########################"
            NAS_BUILD_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/build_output/OAM-810E"
            mkdir -p /workspace/source
            tar -xzf "$NAS_BUILD_DIR/output_hggcrt13.tar.gz" -C /workspace/source

            echo "######################### $(date +%Y%m%d%H%M%S) Run ${{ matrix.script }} ##########################"
            cd /workspace/source/output_hggcrt13
            export TEST_ROOT=$(pwd)
            source /usr/local/PPU_SDK/envsetup.sh
            export PCCL_NET_PLUGIN_ENABLE=1
            python3 -m pip install junit-xml filelock==3.20.0 || true

            echo "bash ${{ matrix.script }}" > /tmp/single_case.list
            set +e
            python3 /workspace/source/output_hggcrt13/pr-ut-runner.py \
              --suite-name "pccl PR Tests" \
              --caselist /tmp/single_case.list \
              --build-dir /workspace/source/output_hggcrt13
            TEST_EXIT_CODE=$?
            set -e

            NAS_RESULT_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/OAM-810E/${{ matrix.script }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-eic-20261010",
                "config_name": "OAM-810E",
                "board_type": "OAM-810E",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
                "pccl_net_plugin_enable": os.environ.get("PCCL_NET_PLUGIN_ENABLE", ""),
                "hostname": command_output(["hostname"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success
      - name: Test summary (${{ matrix.script }})
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/OAM-810E/${{ matrix.script }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"

          echo "## Test: ${{ matrix.script }} on OAM-810E" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 pccl/.github/workflows/scripts/display-test-summary.py "$XML_FILE" --env-info "$ENV_FILE"

  # Build and test pccl with notsm configuration in a single isolated PPU pod.
  build-test-notsm:
    name: Build & Test (ubuntu24_notsm, ${{ matrix.machine.name }})
    # prepare must be listed here: the machine matrix below reads
    # needs.prepare.outputs.machines, and the needs context only contains
    # jobs named in this list. Without it the expression evaluates to null
    # and the whole job is silently dropped from the run.
    needs: [precheck, commit-checks, human-review, prepare]
    if: always() && (needs.precheck.result == 'success' || needs.precheck.result == 'skipped') && (needs.commit-checks.result == 'success' || needs.commit-checks.result == 'skipped') && (needs.human-review.result == 'success' || (github.event_name != 'pull_request' && needs.human-review.result == 'skipped'))
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJson(needs.prepare.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: main
          path: pccl-tests
      - name: Build and Test on PPU (notsm)
        id: ppu-test-notsm
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ matrix.machine.image }}
          nnodes: 0
          nproc_per_node: ${{ matrix.machine.nproc }}
          node_selector: "${{ matrix.machine.node_selector }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            set -e
            unset PIP_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            echo "######################### $(date +%Y%m%d%H%M%S) Build pccl (notsm) ##########################"
            export source_home=/workspace/source
            export build_output=/workspace/source/output_notsm
            mkdir -p $build_output
            bash pccl/.github/workflows/scripts/notsm_build.sh

            echo "######################### $(date +%Y%m%d%H%M%S) Run notsm common test ##########################"
            cd /workspace/source/output_notsm
            export TEST_ROOT=$(pwd)
            source /usr/local/PPU_SDK/envsetup.sh
            # The 810E test script enables the network plugin; export it here as
            # well so the recorded environment matches the test run.
            if [ "${{ matrix.machine.suffix }}" = "_810E" ]; then
              export PCCL_NET_PLUGIN_ENABLE=1
            fi
            python3 -m pip install junit-xml filelock==3.20.0 || true

            echo "bash run_common_test${{ matrix.machine.suffix }}.sh" > /tmp/single_case.list
            set +e
            python3 /workspace/source/output_notsm/pr-ut-runner.py \
              --suite-name "pccl PR Tests (notsm)" \
              --caselist /tmp/single_case.list \
              --build-dir /workspace/source/output_notsm
            TEST_EXIT_CODE=$?
            set -e

            NAS_RESULT_DIR="/mnt/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/${{ matrix.machine.name }}/notsm_run_common_test"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ matrix.machine.image }}",
                "config_name": "${{ matrix.machine.name }} (notsm)",
                "node_selector": "${{ matrix.machine.node_selector }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
                "pccl_net_plugin_enable": os.environ.get("PCCL_NET_PLUGIN_ENABLE", ""),
                "hostname": command_output(["hostname"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success
      - name: Test summary (notsm, ${{ matrix.machine.name }})
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results/${{ matrix.machine.name }}/notsm_run_common_test"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"

          echo "## Test: notsm common test on ${{ matrix.machine.name }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 pccl/.github/workflows/scripts/display-test-summary.py "$XML_FILE" --env-info "$ENV_FILE"

  # Aggregate results from all test pods and publish the summary.
  summary:
    name: Test Summary
    needs: [precheck, commit-checks, test-890P, test-810E, build-test-notsm]
    if: always() && (github.event_name != 'pull_request' || (needs.precheck.result == 'success' && needs.commit-checks.result == 'success'))
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pccl
      - name: Display test summary
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/pccl-ci/${{ github.run_id }}/${{ github.run_attempt }}/results"
          # Results are stored as results/<machine>/<test>/test-results.xml; the
          # script walks the directory and renders one section per result with
          # env details and test details. Kept free of bash-only syntax: the
          # actions-runner container defaults to the sh shell.
          python3 pccl/.github/workflows/scripts/display-test-summary.py --results-dir "$NAS_RESULT_DIR"

  # Keep this check name stable for branch rules.
  tests-gate:
    name: PCCL Tests Gate
    # Add each new required job ID here. If it must also succeed outside PRs, add it to
    # "Require build and test jobs to succeed" below.
    # New entries in scripts/casecmd.list must also be added to the static
    # script matrices of test-890P / test-810E (see casecmd.list header).
    # Only jobs listed here are checked, including all their matrix entries.
    needs:
      - precheck          # Secret scan
      - commit-checks     # Commit message and DCO
      - ai-code-review    # AI review
      - human-review      # Human approval
      - prepare           # Test matrix generation
      - build             # Build for the test matrix
      - test-890P         # Every 890P test from scripts/casecmd.list
      - test-810E         # Every 810E test from scripts/casecmd.list
      - build-test-notsm  # Additional build/test configuration
      - summary           # Test report generation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject unsupported events
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.event_name != 'push' &&
          github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
          exit 1

      - name: Reject failed or cancelled jobs
        if: >-
          always() &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: |
          echo "::error::A required job failed or was cancelled. See its logs."
          exit 1

      - name: Require build and test jobs to succeed
        # The test matrix may only be skipped when the build itself was
        # skipped (an upstream gate did not pass). A skipped test matrix on
        # push or manual runs means the matrix did not expand and must fail
        # loudly instead of passing green (run 39920557638 hid exactly that).
        if: >-
          always() && (
            needs.prepare.result != 'success' ||
            needs.build.result != 'success' ||
            (needs.test-890P.result != 'success' && needs.build.result != 'skipped') ||
            (needs.test-810E.result != 'success' && needs.build.result != 'skipped') ||
            needs.build-test-notsm.result != 'success' ||
            needs.summary.result != 'success'
          )
        run: |
          echo "::error::A required build or test job did not succeed."
          exit 1

      - name: Reject skipped jobs on pull requests
        # Outside PRs, the four PR-only checks and the test matrix may be skipped.
        if: >-
          always() && github.event_name == 'pull_request' &&
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Pull requests require every job in needs to succeed."
          exit 1

      - name: All required checks passed
        run: echo "Required checks passed."
