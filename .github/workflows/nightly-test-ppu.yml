name: pccl nightly

on:
  schedule:
    - cron: '0 14 * * *' # 22:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pccl-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: PPU Nightly Regression
    uses: ./.github/workflows/ppu-build-test.yml
    with:
      test_suite: nightly
      nnodes: 2
      timeout_minutes: 600
