name: PCCL Commit Message Preview

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to prepare its squash message
        required: true
        type: number

permissions: {}

concurrency:
  group: squash-message-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  squash-message:
    name: Generate commit message
    # Fork PRs use a maintainer-triggered run from main with trusted workflow code.
    if: >-
      github.repository == 't-head/pccl' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && inputs.pr_number && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      draft: ${{ steps.prepare.outputs.draft }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare standalone Copilot CLI
        run: bash .github/scripts/install_copilot.sh
      - name: Prepare a draft for multiple commits
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_CLI: ${{ runner.temp }}/copilot/bin/copilot
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PYTHONUTF8: '1'
        run: |
          draft=$(python3 .github/scripts/commit_message_squash.py --pr "$PR_NUMBER")
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  publish-squash-message:
    name: Publish commit message
    needs: squash-message
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: squash-message-publish-${{ github.event.pull_request.number || inputs.pr_number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show the full message for multiple commits or remove an old preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SQUASH_DRAFT: ${{ needs.squash-message.outputs.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PYTHONUTF8: '1'
        run: >-
          python3 .github/scripts/commit_message_squash.py
          --publish --expected-pr "$PR_NUMBER"
