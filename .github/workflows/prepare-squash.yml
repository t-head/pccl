name: Prepare squash commit
run-name: "Prepare squash message for PR #${{ github.event.pull_request.number || inputs.pr_number }}"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to prepare a final commit message for
        required: true
        type: number

permissions: {}

concurrency:
  group: squash-message-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft and validate squash message
    # Fork PRs use a maintainer-triggered run from main with trusted workflow code.
    if: >-
      github.repository == 't-head/pccl' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate message preparation rules
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Prepare standalone Copilot CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/github/copilot-cli/releases/download/v1.0.100/copilot-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/copilot.tar.gz"
          echo "65dfb019192afebed7abb385323a232a5ac32fa8c40a230880d4013cffb6b0b3  $RUNNER_TEMP/copilot.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/copilot"
          tar -xzf "$RUNNER_TEMP/copilot.tar.gz" -C "$RUNNER_TEMP/copilot"
      - name: Draft the final message and validate preserved metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_CLI: ${{ runner.temp }}/copilot/copilot
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PYTHONUTF8: '1'
        run: python3 .github/scripts/prepare_squash.py --pr "$PR_NUMBER" --output "$RUNNER_TEMP/squash-message"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: squash-message
          path: ${{ runner.temp }}/squash-message/
          if-no-files-found: error
          retention-days: 14
