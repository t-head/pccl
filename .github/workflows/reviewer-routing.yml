name: Recommend PCCL reviewers
run-name: "PCCL review for PR #${{ github.event.pull_request.number || inputs.pr_number }}"

on:
  pull_request_target:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: number

permissions: {}

concurrency:
  group: reviewers-${{ github.event.pull_request.number || inputs.pr_number }}
  queue: max
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  PYTHONUTF8: '1'

jobs:
  classify:
    name: Classify changed modules
    if: >-
      github.repository == 't-head/pccl' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      recommendation: ${{ steps.classify.outputs.recommendation }}
    steps:
      # Use this run's trusted main revision for every target branch; PR contents are data only.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Copilot CLI
        run: bash .github/scripts/install_copilot.sh
      - name: Classify modules using the review Skill
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_CLI: ${{ runner.temp }}/copilot/bin/copilot
        run: python3 .github/scripts/review_automation.py classify

  invite:
    name: Request reviewers
    needs: classify
    if: needs.classify.outputs.recommendation != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Read and update module rotations one PR at a time, without dropping queued PRs.
      group: reviewer-invitations
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write # Store allocations on workflow/review; this job runs trusted base code.
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rotate reviewers and request review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOMMENDATION: ${{ needs.classify.outputs.recommendation }}
        run: python3 .github/scripts/review_automation.py invite
