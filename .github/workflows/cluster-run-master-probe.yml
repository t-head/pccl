name: cluster-run master runtime probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate master runtime without PCCL or xtest
        uses: t-head/ci-infra/cluster-run@feat/master-launch-mode
        with:
          launch_mode: master
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          nnodes: 2
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          timeout_minutes: 20
          container_options: |
            privileged: true
            host_network: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            test "$WORLD_SIZE" -eq 2
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /sys/class/net/bond1
            test -d /dev/infiniband
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            test "$NODE_RANK" -eq 0
            test "$NNODES" -eq 2
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            for rank in 0 1; do
              host=$(jq -r --argjson rank "$rank" '.[$rank].host' "$CLUSTER_NODES_FILE")
              cluster-exec "$host" /bin/bash -c \
                'test "$WORLD_SIZE" -eq 2; test "$NODE_RANK" -eq "$1"; test -d /dev/infiniband; set -- /dev/infiniband/*; test -e "$1"' probe "$rank"
            done
            mpi_prefix=$(dirname "$(dirname "$(readlink -f "$(command -v mpirun)")")")
            test -x "$mpi_prefix/bin/orted"
            awk '{print $0 " slots=8 max_slots=8"}' "$CLUSTER_HOSTS_FILE" > /tmp/mpi-hosts.cfg
            test "$(wc -l < /tmp/mpi-hosts.cfg)" -eq 2
            two_rank_log=/tmp/mpi-echo-2.log
            timeout --signal=TERM --kill-after=5s 60s \
              mpirun --allow-run-as-root \
              -np 2 -npernode 1 \
              --prefix "$mpi_prefix" \
              -mca plm_rsh_agent cluster-ssh \
              -mca orte_base_help_aggregate 0 \
              -mca oob_tcp_if_include bond1 \
              -mca btl_tcp_if_include bond1 \
              --hostfile /tmp/mpi-hosts.cfg \
              -x LD_LIBRARY_PATH -x PATH \
              /bin/echo test | tee "$two_rank_log"
            test "$(grep -cx test "$two_rank_log")" -eq 2
            echo 'cluster-run 2-rank MPI echo probe passed'
            sixteen_rank_log=/tmp/mpi-echo-16.log
            timeout --signal=TERM --kill-after=5s 60s \
              mpirun --allow-run-as-root \
              -np 16 -npernode 8 \
              --prefix "$mpi_prefix" \
              -mca plm_rsh_agent cluster-ssh \
              -mca orte_base_help_aggregate 0 \
              -mca oob_tcp_if_include bond1 \
              -mca btl_tcp_if_include bond1 \
              --hostfile /tmp/mpi-hosts.cfg \
              -x LD_LIBRARY_PATH -x PATH \
              /bin/echo test | tee "$sixteen_rank_log"
            test "$(grep -cx test "$sixteen_rank_log")" -eq 16
            echo 'cluster-run 16-rank MPI echo probe passed'
