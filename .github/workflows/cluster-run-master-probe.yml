name: cluster-run master runtime probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate master runtime without PCCL or xtest
        uses: t-head/ci-infra/cluster-run@feat/master-launch-mode
        with:
          launch_mode: master
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          nnodes: 2
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          namespace: ppu-sched
          timeout_minutes: 20
          container_options: |
            privileged: true
            host_network: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            test "$WORLD_SIZE" -eq 2
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /sys/class/net/bond1
            test -d /dev/infiniband
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            test "$NODE_RANK" -eq 0
            test "$NNODES" -eq 2
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            for rank in 0 1; do
              host=$(jq -r --argjson rank "$rank" '.[$rank].host' "$CLUSTER_NODES_FILE")
              cluster-exec "$host" /bin/bash -c \
                'test "$WORLD_SIZE" -eq 2; test "$NODE_RANK" -eq "$1"; test -d /dev/infiniband; set -- /dev/infiniband/*; test -e "$1"' probe "$rank"
            done
            mpi_prefix=$(dirname "$(dirname "$(readlink -f "$(command -v mpirun)")")")
            test -x "$mpi_prefix/bin/orted"
            mpirun --version | head -n 2
            env | grep '^OMPI_' || true
            awk '{print $0 " slots=8 max_slots=8"}' "$CLUSTER_HOSTS_FILE" > /tmp/mpi-hosts-fqdn.cfg
            awk -F. '{print $1 " slots=8 max_slots=8"}' "$CLUSTER_HOSTS_FILE" > /tmp/mpi-hosts-short.cfg
            test "$(wc -l < /tmp/mpi-hosts-fqdn.cfg)" -eq 2
            while IFS= read -r host; do
              timeout --signal=TERM --kill-after=2s 5s getent hosts "$host" >/dev/null
              echo "resolved $host"
            done < "$CLUSTER_HOSTS_FILE"
            cat > /tmp/mpi-rsh-agent <<'SH'
            #!/bin/bash
            set -u
            line=
            for argument in "$@"; do
              printf -v quoted '%q' "$argument"
              line+="${quoted} "
            done
            printf '%s\n' "$line" >> /tmp/mpi-rsh-agent.log
            exec cluster-ssh "$@"
            SH
            chmod 0755 /tmp/mpi-rsh-agent
            run_probe() {
              label=$1
              seconds=$2
              shift 2
              log="/tmp/${label}.log"
              set +e
              timeout --signal=TERM --kill-after=5s "$seconds" "$@" > "$log" 2>&1
              rc=$?
              set -e
              echo "$label return code: $rc"
              python3 - "$log" <<'PY'
            import pathlib, re, sys
            text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
            text = re.sub(r'(?<![A-Za-z0-9.])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![A-Za-z0-9.])', '<ip>', text)
            print('\n'.join(text.splitlines()[-80:]))
            PY
              return "$rc"
            }
            if run_probe local_plain 20 \
              mpirun --allow-run-as-root -np 1 /bin/echo local-plain; then
              local_plain_rc=0
            else
              local_plain_rc=$?
            fi
            if run_probe local_bond1 20 \
              mpirun --allow-run-as-root -np 1 \
              -mca oob_tcp_if_include bond1 -mca btl_tcp_if_include bond1 \
              /bin/echo local-bond1; then
              local_bond1_rc=0
            else
              local_bond1_rc=$?
            fi
            : > /tmp/mpi-rsh-agent.log
            if run_probe remote_fqdn 30 \
              mpirun --allow-run-as-root -np 2 -npernode 1 \
              --prefix "$mpi_prefix" -mca plm_rsh_agent /tmp/mpi-rsh-agent \
              -mca orte_base_help_aggregate 0 --hostfile /tmp/mpi-hosts-fqdn.cfg \
              -x LD_LIBRARY_PATH -x PATH /bin/echo remote-fqdn; then
              remote_fqdn_rc=0
            else
              remote_fqdn_rc=$?
            fi
            echo 'FQDN cluster-ssh invocation:'
            cat /tmp/mpi-rsh-agent.log 2>/dev/null || echo '<not invoked>'
            : > /tmp/mpi-rsh-agent.log
            if run_probe remote_short 30 \
              mpirun --allow-run-as-root -np 2 -npernode 1 \
              --prefix "$mpi_prefix" -mca plm_rsh_agent /tmp/mpi-rsh-agent \
              -mca orte_base_help_aggregate 0 --hostfile /tmp/mpi-hosts-short.cfg \
              -x LD_LIBRARY_PATH -x PATH /bin/echo remote-short; then
              remote_short_rc=0
            else
              remote_short_rc=$?
            fi
            echo 'short-host cluster-ssh invocation:'
            cat /tmp/mpi-rsh-agent.log 2>/dev/null || echo '<not invoked>'
            for rank in 0 1; do
              host=$(jq -r --argjson rank "$rank" '.[$rank].host' "$CLUSTER_NODES_FILE")
              cluster-exec "$host" /bin/bash -c \
                'orted_count=$(ps -eo comm= | grep -c "^orted$" || true); session_count=$(find /run/cluster/sessions -mindepth 1 -maxdepth 1 -type f | wc -l); printf "rank=%s orted=%s sessions=%s\n" "$NODE_RANK" "$orted_count" "$session_count"'
            done
            printf 'probe summary: local_plain=%s local_bond1=%s remote_fqdn=%s remote_short=%s\n' \
              "$local_plain_rc" "$local_bond1_rc" "$remote_fqdn_rc" "$remote_short_rc"
            test "$local_plain_rc" -eq 0
            test "$local_bond1_rc" -eq 0
            test "$remote_fqdn_rc" -eq 0
            test "$remote_short_rc" -eq 0
