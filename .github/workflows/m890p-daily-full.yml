name: Read-only lsmod check on previously failing workers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rdma-lsmod-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Loaded module check on worker ${{ matrix.worker.id }}
    strategy:
      fail-fast: false
      matrix:
        worker:
          - id: '20'
            hostname: na131g-m890-20.eng.t-head.cn
          - id: '04'
            hostname: na131g-m890-04.eng.t-head.cn
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - name: Run the requested lsmod and grep check
        uses: t-head/ci-infra/cluster-run@5d01766a74ca02a90bf257f24e741dbdab42d004
        with:
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          launch_mode: master
          nnodes: 1
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P,nic-type=cx8,kubernetes.io/hostname=${{ matrix.worker.hostname }}
          namespace: ppu-sched
          timeout_minutes: 10
          cleanup_policy: always
          container_options: |
            privileged: false
            cpus: 2
            memory: 2Gi
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          command: |
            set -euo pipefail
            umask 022
            if ! command -v lsmod >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends kmod
            fi
            # Tools are installed only in this ephemeral container. This Pod
            # has no SYS_MODULE capability and never mounts the host root.
            export TARGET_HOSTNAME='${{ matrix.worker.hostname }}'
            bash "$SOURCE_DIR/pccl/tests/xtest/experiments/check_peermem_loaded.sh" \
              /mnt/wl_nas/devops/pccl-lsmod-${{ github.run_id }}/${{ matrix.worker.id }}
      - name: Preserve the literal command result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdma-lsmod-worker-${{ matrix.worker.id }}
          path: /wl_nas/devops/pccl-lsmod-${{ github.run_id }}/${{ matrix.worker.id }}/
          retention-days: 90
          if-no-files-found: warn
