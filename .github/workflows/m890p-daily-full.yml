name: M890P daily grouped execution (experimental)

on:
  push:
    branches: [ci/m890p-daily-csv]
    paths: [.github/workflows/m890p-daily-full.yml]
  workflow_dispatch:
    inputs:
      dataset:
        description: Exported Case selection to execute
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      max_cases_per_group:
        description: Maximum Cases in each automatic same-environment shard
        required: true
        default: 500
        type: number
      nodes:
        description: Optional debug node filter; empty selects every exported node count
        required: false
        type: string
      suite:
        description: Optional exact Suite debug filter; empty selects every Suite
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: m890p-daily-full-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P
  VALIDATION_CARDS: '8'
  PCCL_TESTS_REVISION: 394556512e87259e9ffa25225632c46b0a0bbcd5
  DAILY_ALLOWED_NODES: '1,2,4'

jobs:
  prepare:
    name: Build automatic daily execution groups
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      case_count: ${{ steps.selection.outputs.case_count }}
      excluded_case_count: ${{ steps.selection.outputs.excluded_case_count }}
      group_count: ${{ steps.selection.outputs.group_count }}
      groups: ${{ steps.selection.outputs.groups }}
      groups_sha256: ${{ steps.selection.outputs.groups_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: selection
        name: Test contracts and validate the exact selection
        working-directory: pccl
        env:
          DATASET: ${{ inputs.dataset || 'smoke' }}
          MAX_CASES: ${{ inputs.max_cases_per_group || 500 }}
          NODES: ${{ inputs.nodes || '' }}
          SUITE: ${{ inputs.suite || '' }}
          ALLOWED_NODES: ${{ env.DAILY_ALLOWED_NODES }}
        run: |
          python3 -S -B -W error::ResourceWarning -m unittest discover \
            -s tests/xtest -p 'test_run_cases.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_group_cases.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_case_group_cache.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_artifact_cache.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_daily_smoke.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_daily_reconcile.py' -v
          python3 -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'tests/xtest')
          import case_group_cache
          import group_cases
          import run_cases
          from artifact_cache import PCCL_TESTS_REVISION, RUNNER_HASHES

          dataset = os.environ['DATASET']
          if dataset not in ('smoke', 'full'):
              raise ValueError('Unsupported daily dataset')
          input_directory = Path(f'tests/xtest/daily-{dataset if dataset == "full" else "minimal"}-csv')
          nodes = int(os.environ['NODES']) if os.environ['NODES'] else None
          suite = os.environ['SUITE'] or None
          if nodes is not None and nodes not in (1, 2, 4, 8, 16):
              raise ValueError('Unsupported node count')
          allowed_nodes = {int(value) for value in os.environ['ALLOWED_NODES'].split(',')}
          plan = group_cases.build_plan(
              input_directory, int(os.environ['MAX_CASES']), nodes=nodes, suite=suite,
              allowed_nodes=allowed_nodes)
          group_cases.write_plan(plan, Path('case-groups'), input_directory)
          groups = plan['groups']
          groups_sha256 = case_group_cache.tree_sha256(Path('case-groups'))
          manifest = json.loads(Path('case-groups/groups.json').read_text())
          coverage = json.loads(Path('case-groups/execution-coverage.json').read_text())
          if len(manifest) > 256:
              raise ValueError(f'{len(manifest)} execution groups exceed GitHub Actions matrix limit of 256; '
                               'increase max_cases_per_group or narrow the selection')
          expected = set()
          for profile in ('standard', 'notsm'):
              try:
                  selected = run_cases.load_inputs(input_directory, profile, nodes=nodes, suite=suite)
              except ValueError as error:
                  if 'no Cases' not in str(error):
                      raise
                  continue
              expected.update((case['plan'], case['suite'], case['name']) for case in selected['cases'])
          actual = []
          for group in manifest:
              selected = run_cases.load_inputs(Path('case-groups') / group['id'], group['profile'])
              keys = [[case['plan'], case['suite'], case['name']] for case in selected['cases']]
              assert keys == group['case_keys']
              assert all(case['suite_spec']['nodes'] == group['nodes'] for case in selected['cases'])
              actual.extend(tuple(key) for key in keys)
          selected_keys = set(actual)
          excluded_keys = {tuple(key) for record in coverage['exclusions'] for key in record['case_keys']}
          assert len(actual) == len(selected_keys) == coverage['selected_cases']
          assert len(manifest) == coverage['selected_groups']
          assert coverage['allowed_nodes'] == sorted(allowed_nodes)
          assert coverage['total_cases'] == len(expected)
          assert coverage['excluded_cases'] == len(excluded_keys)
          assert selected_keys.isdisjoint(excluded_keys)
          assert selected_keys | excluded_keys == expected
          assert all(group['nodes'] in allowed_nodes for group in manifest)
          runner = Path('../pccl-tests').resolve()
          revision = subprocess.check_output(['git', '-C', str(runner), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == PCCL_TESTS_REVISION == os.environ['PCCL_TESTS_REVISION']
          for name, expected in RUNNER_HASHES.items():
              assert hashlib.sha256((runner / name).read_bytes()).hexdigest() == expected
          assert groups[0]['metadata']['runner_revision'] == revision
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          matrix = {'include': [
              {key: group[key] for key in ('id', 'profile', 'nodes', 'cards_per_node', 'env', 'case_count')}
              for group in manifest
          ]}
          print(f'Selected {len(actual)} {dataset} Cases in {len(manifest)} automatic groups')
          print(f'Excluded {coverage["excluded_cases"]} Cases by the daily resource policy: '
                f'{[(record["nodes"], record["case_count"]) for record in coverage["exclusions"]]}')
          for group in manifest:
              print(f'{group["id"]}: {group["case_count"]} Cases, {group["nodes"]} nodes, '
                    f'{group["cards_per_node"]} cards/node, {group["env"]}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'case_count={len(actual)}\n')
              output.write(f'excluded_case_count={coverage["excluded_cases"]}\n')
              output.write(f'group_count={len(manifest)}\n')
              output.write(f'groups_sha256={groups_sha256}\n')
              output.write('groups<<GROUPS\n')
              output.write(json.dumps(matrix, separators=(',', ':')) + '\nGROUPS\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m890p-daily-case-groups
          path: pccl/case-groups/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Stage the pinned benchmark dependency
        run: |
          mkdir -p deps
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest deps filelock==3.20.3
          printf '%s  %s\n' \
            '4b0dda527ee31078689fc205ec4f1c1bf7d56cf88b6dc9426c4f230e46c2dce1' \
            'deps/filelock-3.20.3-py3-none-any.whl' | sha256sum --check -
      - uses: actions/upload-artifact@v4
        with:
          name: m890p-daily-full-python-deps
          path: deps/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-standard:
    name: Build and upload standard
    needs: [prepare]
    if: needs.prepare.result == 'success'
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Build standard output
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_standard
            STAGING=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
            RUN_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}
            mkdir -p "$build_output" "$STAGING"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/build.sh
            tar -czf "$STAGING/output_standard.tar.gz" -C /workspace/source output_standard
            sha256sum "$STAGING/output_standard.tar.gz" > "$STAGING/output_standard.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/tests/xtest/artifact_cache.py" create \
              --archive "$STAGING/output_standard.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile standard --output "$STAGING/output_standard.build.json"
            chmod -R a+rwX "$RUN_ROOT"
      - id: identity
        name: Validate the standard artifact before upload
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
        run: |
          EXPECTED_SHA=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["STAGING"], "output_standard.build.json")))["artifact_sha256"])')
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$STAGING" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 "$EXPECTED_SHA"
          echo "artifact_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: m890p-daily-full-build-standard
          path: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove transient standard NAS staging
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard', ignore_errors=True)
          PY

  stage-cache:
    name: Stage standard from artifact or valid NAS cache
    needs: [prepare, build-standard]
    env:
      EXPECTED_SHA: ${{ needs.build-standard.outputs.artifact_sha256 }}
      EXPECTED_GROUPS_SHA: ${{ needs.prepare.outputs.groups_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - id: cache
        name: Check for a valid NAS cache
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        if: steps.cache.outputs.state == 'miss'
        with:
          name: m890p-daily-full-build-standard
          path: download
      - name: Publish the validated artifact to NAS
        if: steps.cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py publish \
            --download download --cache "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Confirm the final NAS cache
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          chmod -R a+rwX "$CACHE_DIR"
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - id: groups-cache
        name: Check for valid NAS Case groups
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$CACHE_DIR" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        if: steps.groups-cache.outputs.state == 'miss'
        with:
          name: m890p-daily-case-groups
          path: case-groups-download
      - name: Publish the validated Case groups to NAS
        if: steps.groups-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/case_group_cache.py publish \
            --download case-groups-download --cache "$CACHE_DIR" \
            --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
      - name: Confirm the final NAS Case groups
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$CACHE_DIR" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'

  execute:
    name: Run ${{ matrix.id }} on ${{ matrix.nodes }} node(s), ${{ matrix.case_count }} Cases
    needs: [prepare, build-standard, stage-cache]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.groups) }}
    env:
      EXPECTED_SHA: ${{ needs.build-standard.outputs.artifact_sha256 }}
      EXPECTED_GROUPS_SHA: ${{ needs.prepare.outputs.groups_sha256 }}
      GROUP_ID: ${{ matrix.id }}
      PROFILE: ${{ matrix.profile }}
      NODES: ${{ matrix.nodes }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 750
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        with:
          name: m890p-daily-full-python-deps
          path: deps
      - id: groups-cache
        name: Check the NAS Case-group cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$CACHE_DIR" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        if: steps.groups-cache.outputs.state == 'miss'
        with:
          name: m890p-daily-case-groups
          path: case-groups-download
      - name: Restore the NAS Case-group cache
        if: steps.groups-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/case_group_cache.py publish \
            --download case-groups-download --cache "$CACHE_DIR" \
            --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
      - id: build-cache
        name: Check the NAS build cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        if: steps.build-cache.outputs.state == 'miss'
        with:
          name: m890p-daily-full-build-standard
          path: build-download
      - name: Restore the NAS build cache
        if: steps.build-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py publish \
            --download build-download --cache "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Confirm both NAS caches before hardware allocation
        env:
          BUILD_CACHE: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
          GROUPS_CACHE: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
        run: |
          chmod -R a+rwX "$BUILD_CACHE"
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$BUILD_CACHE" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
          python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$GROUPS_CACHE" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
      - name: Run the automatic group on one node
        if: env.NODES == '1'
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ matrix.cards_per_node }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 720
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            export HWLOC_COMPONENTS=-gl
            export OMPI_MCA_orte_keep_fqdn_hostnames=1
            export OMPI_MCA_oob_tcp_if_include="$MPI_INTERFACE"
            export OMPI_MCA_btl_tcp_if_include="$MPI_INTERFACE"
            export NCCL_SOCKET_IFNAME="$MPI_INTERFACE"
            ulimit -l unlimited
            ulimit -s 65536
            if ! command -v ibv_devinfo >/dev/null || ! command -v rdma >/dev/null || ! command -v ip >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends rdma-core ibverbs-utils iproute2
            fi
            if test -d /sys/module/alixpu_peermem; then
              echo 'alixpu_peermem is loaded'
            else
              echo 'alixpu_peermem is not loaded; DMA-BUF support is still possible'
            fi
            ibv_devinfo
            rdma link show
            python3 - <<'PY'
            import ipaddress
            from pathlib import Path

            valid = []
            for path in Path('/sys/class/infiniband').glob('*/ports/*/gids/*'):
                value = path.read_text().strip()
                if value and not ipaddress.IPv6Address(value).is_link_local and int(value.replace(':', ''), 16) != 0:
                    valid.append((str(path), value))
            if not valid:
                raise SystemExit('No non-zero RoCE GID is visible inside the worker')
            for path, value in valid:
                print(f'Valid RoCE GID: {path} -> {value}')
            PY
            umask 022
            cd /workspace/source
            export build_output=/workspace/source/output_standard
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
            GROUPS_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
            CASE_INPUT=/workspace/source/case-input-$GROUP_ID
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/full/$GROUP_ID
            rm -rf "$RESULT_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile standard \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
              --directory "$GROUPS_DIR" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
            python3 -S -B pccl/tests/xtest/case_group_cache.py stage \
              --directory "$GROUPS_DIR" --output "$CASE_INPUT" \
              --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
            tar -xzf "$CACHE_DIR/output_standard.tar.gz" -C /workspace/source
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-env
            /workspace/minimal-csv-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links /workspace/source/deps \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            test "$NCCL_SOCKET_IFNAME" = "$MPI_INTERFACE"
            test "$OMPI_MCA_orte_keep_fqdn_hostnames" = 1
            /workspace/minimal-csv-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$CASE_INPUT/$GROUP_ID" \
              --profile "$PROFILE" \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --mpi-interface "$MPI_INTERFACE" \
              --build-record "$CACHE_DIR/output_standard.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"
      - name: Run the automatic multi-node group on master
        if: env.NODES != '1'
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: ${{ matrix.nodes }}
          nproc_per_node: ${{ matrix.cards_per_node }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 720
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            export HWLOC_COMPONENTS=-gl
            export OMPI_MCA_plm_rsh_agent=cluster-ssh
            export OMPI_MCA_orte_base_help_aggregate=0
            export OMPI_MCA_orte_keep_fqdn_hostnames=1
            export OMPI_MCA_oob_tcp_if_include="$MPI_INTERFACE"
            export OMPI_MCA_btl_tcp_if_include="$MPI_INTERFACE"
            export NCCL_SOCKET_IFNAME="$MPI_INTERFACE"
            ulimit -l unlimited
            ulimit -s 65536
            if ! command -v ibv_devinfo >/dev/null || ! command -v rdma >/dev/null || ! command -v ip >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends rdma-core ibverbs-utils iproute2
            fi
            ibv_devinfo
            rdma link show
            test -d /dev/infiniband
          command: |
            set -euo pipefail
            umask 022
            cd "$SOURCE_DIR"
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
            GROUPS_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ env.EXPECTED_GROUPS_SHA }}
            CASE_INPUT="$SHARED_ROOT/case-input"
            SHARED_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/shared-standard/${{ env.EXPECTED_SHA }}/$GROUP_ID
            SHARED_PARENT=$(dirname "$SHARED_ROOT")
            SHARED_BASE=$(dirname "$SHARED_PARENT")
            export build_output="$SHARED_ROOT/output_standard"
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/full/$GROUP_ID
            rm -rf "$RESULT_ROOT" "$SHARED_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")" "$SHARED_ROOT"
            cleanup_shared() {
              rm -rf "$SHARED_ROOT"
              rmdir "$SHARED_PARENT" "$SHARED_BASE" 2>/dev/null || true
            }
            trap cleanup_shared EXIT
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile standard \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
              --directory "$GROUPS_DIR" --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
            python3 -S -B pccl/tests/xtest/case_group_cache.py stage \
              --directory "$GROUPS_DIR" --output "$CASE_INPUT" \
              --expected-sha256 '${{ env.EXPECTED_GROUPS_SHA }}'
            tar -xzf "$CACHE_DIR/output_standard.tar.gz" -C "$SHARED_ROOT"
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-cluster-env
            /workspace/minimal-csv-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/deps" \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            test "$NCCL_SOCKET_IFNAME" = "$MPI_INTERFACE"
            test "$OMPI_MCA_orte_keep_fqdn_hostnames" = 1
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq "$NODES"
            checked_hosts=0
            while read -r host _; do
              timeout -k 5s 30s cluster-ssh "$host" 'hostname' < /dev/null
              checked_hosts=$((checked_hosts + 1))
            done < "$CLUSTER_HOSTS_FILE"
            test "$checked_hosts" -eq "$NODES"
            timeout -k 10s 60s mpirun --allow-run-as-root \
              --hostfile "$CLUSTER_HOSTS_FILE" -np "$NODES" -npernode 1 hostname
            /workspace/minimal-csv-cluster-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$CASE_INPUT/$GROUP_ID" \
              --profile "$PROFILE" \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --hostfile "$CLUSTER_HOSTS_FILE" \
              --mpi-interface "$MPI_INTERFACE" \
              --build-record "$CACHE_DIR/output_standard.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"

  summary:
    name: Daily grouped result summary and NAS cleanup
    needs: [prepare, build-standard, stage-cache, execute]
    if: always()
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: always()
        with:
          path: pccl
          persist-credentials: false
      - id: groups-cache
        name: Check the NAS Case-group cache
        if: always()
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ needs.prepare.outputs.groups_sha256 }}
        run: |
          if python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$CACHE_DIR" --expected-sha256 '${{ needs.prepare.outputs.groups_sha256 }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: t-head/pccl/.github/actions/download-artifact-retry@c7eb80eadb2ca48976a02d8f0fcc1c020534ce73
        if: always() && steps.groups-cache.outputs.state == 'miss'
        with:
          name: m890p-daily-case-groups
          path: case-groups-download
      - name: Restore the NAS Case-group cache
        if: always() && steps.groups-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ needs.prepare.outputs.groups_sha256 }}
        run: |
          python3 -S -B pccl/tests/xtest/case_group_cache.py publish \
            --download case-groups-download --cache "$CACHE_DIR" \
            --expected-sha256 '${{ needs.prepare.outputs.groups_sha256 }}'
      - id: groups
        name: Confirm the NAS Case-group cache
        if: always()
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/case-groups/${{ needs.prepare.outputs.groups_sha256 }}
        run: |
          python3 -S -B pccl/tests/xtest/case_group_cache.py validate \
            --directory "$CACHE_DIR" --expected-sha256 '${{ needs.prepare.outputs.groups_sha256 }}'
      - id: reconcile
        name: Reconcile every automatic group
        if: always()
        env:
          PCCL_REVISION: ${{ github.sha }}
          EXPECTED_SHA: ${{ needs.build-standard.outputs.artifact_sha256 }}
        run: |
          python3 -S -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          output = Path('public-results')
          output.mkdir(exist_ok=True)
          group_root = (Path('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}') /
                        'cache/case-groups/${{ needs.prepare.outputs.groups_sha256 }}')
          groups = json.loads((group_root / 'groups.json').read_text())
          coverage = json.loads((group_root / 'execution-coverage.json').read_text())
          if coverage['allowed_nodes'] != [1, 2, 4]:
              raise ValueError('Daily execution coverage uses an unsupported resource policy')
          if any(group['nodes'] not in coverage['allowed_nodes'] for group in groups):
              raise ValueError('An execution group exceeds the daily resource policy')
          if (sum(group['case_count'] for group in groups) != coverage['selected_cases']
                  or sum(record['case_count'] for record in coverage['exclusions'])
                  != coverage['excluded_cases']
                  or coverage['selected_cases'] + coverage['excluded_cases'] != coverage['total_cases']):
              raise ValueError('Daily execution coverage totals are inconsistent')
          if not groups:
              raise ValueError('No automatic groups were prepared')
          results_root = Path('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}') / 'results/full'
          result_dirs = ({path.name for path in results_root.iterdir() if path.is_dir()}
                         if results_root.is_dir() else set())
          unexpected_groups = result_dirs - {group['id'] for group in groups}
          if unexpected_groups:
              raise ValueError(f'Unexpected or out-of-policy result groups: {sorted(unexpected_groups)}')
          reports = []
          failed = []
          counts = {}
          for group in groups:
              group_output = output / group['id']
              completed = subprocess.run([
                  sys.executable, '-S', '-B', 'pccl/tests/xtest/daily_reconcile.py',
                  '--input', str(Path('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}') /
                                   'cache/case-groups/${{ needs.prepare.outputs.groups_sha256 }}' / group['id']),
                  '--profile', group['profile'], '--nodes', str(group['nodes']),
                  '--results', str(Path('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}') /
                                   'results/full' / group['id']),
                  '--output', str(group_output),
                  '--pccl-revision', os.environ['PCCL_REVISION'],
                  '--expected-sha256', os.environ['EXPECTED_SHA'],
              ])
              report_path = group_output / 'reconciliation.json'
              report = json.loads(report_path.read_text()) if report_path.is_file() else None
              if completed.returncode or not report or not report.get('ok'):
                  failed.append(group['id'])
              reports.append({
                  'id': group['id'], 'profile': group['profile'], 'nodes': group['nodes'],
                  'return_code': completed.returncode, 'reconciliation': report,
              })
              for status, count in (report or {}).get('counts', {}).items():
                  counts[status] = counts.get(status, 0) + count
          summary = {
              'ok': not failed,
              'expected': sum((report['reconciliation'] or {}).get('expected', group['case_count'])
                              for group, report in zip(groups, reports)),
              'actual': sum((report['reconciliation'] or {}).get('actual', 0) for report in reports),
              'counts': counts,
              'execution_coverage': coverage,
              'failed_groups': failed,
              'groups': reports,
          }
          (output / 'daily-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n')
          for group_id in failed:
              print(f'::error::Daily group {group_id} did not reconcile successfully')
          sys.exit(bool(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m890p-daily-full-results
          path: public-results/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - id: cleanup
        name: Remove run-owned NAS build artifacts
        if: always()
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py cleanup \
            --root /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }} \
            --run-id '${{ github.run_id }}'
      - name: Report daily execution and cleanup failures
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS'])
          failed = {}
          for name in ('prepare', 'build-standard', 'stage-cache', 'execute'):
              if needs[name]['result'] != 'success':
                  failed[name] = needs[name]['result']
          outcomes = {'groups': '${{ steps.groups.outcome }}',
                      'reconcile': '${{ steps.reconcile.outcome }}',
                      'cleanup': '${{ steps.cleanup.outcome }}'}
          for name, result in outcomes.items():
              if result != 'success':
                  failed[name] = result
          for name, result in failed.items():
              print(f'::error::{name}: {result}')
          sys.exit(bool(failed))
          PY
