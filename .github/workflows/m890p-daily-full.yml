name: RDMA independent GPU memory registration diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rdma-independent-registration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - name: Inspect two workers using one allocated PPU each
        uses: t-head/ci-infra/cluster-run@5d01766a74ca02a90bf257f24e741dbdab42d004
        with:
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          launch_mode: master
          nnodes: 2
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P,nic-type=cx8
          rack_policy: spread
          rack_count: 2
          namespace: ppu-sched
          timeout_minutes: 10
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            umask 022
            export UMD_PLATFORM_TYPE=1
            export HWLOC_COMPONENTS=-gl
            ulimit -l unlimited
            ulimit -s 65536
            root=/mnt/wl_nas/devops/pccl-rdma-registration-${{ github.run_id }}
            if ! command -v ibv_devinfo >/dev/null || ! command -v rdma >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends rdma-core ibverbs-utils iproute2
            fi
            bash "$SOURCE_DIR/pccl/tests/xtest/experiments/rdma_worker_diagnostics.sh" "$root"
            # No PCCL archive, build, driver installation or communication test.
            timeout --signal=TERM --kill-after=5s 90s python3 \
              "$SOURCE_DIR/pccl/tests/xtest/experiments/rdma_gpu_registration_probe.py" \
              --output "$root/diagnostics/gpu-worker-${NODE_RANK}.json" \
              > "$root/diagnostics/gpu-worker-${NODE_RANK}.log" 2>&1
          command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            umask 022
            export DIAGNOSTIC_ROOT=/mnt/wl_nas/devops/pccl-rdma-registration-${{ github.run_id }}
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path
            root=Path(os.environ['DIAGNOSTIC_ROOT'])
            reports=[]
            for rank in (0, 1):
                path=root/'diagnostics'/f'gpu-worker-{rank}.json'
                reports.append(json.loads(path.read_text()))
            (root/'summary.json').write_text(json.dumps({
                'diagnosis_completed': True, 'hardware_pass_claim': False,
                'reports': reports}, indent=2)+'\n')
            for report in reports:
                print(report['hostname'], 'error=', report.get('error'),
                      'independent_of_pccl=', report.get('independent_of_pccl'),
                      'registrations=', len(report['registrations']))
            PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdma-independent-registration
          path: |
            /wl_nas/devops/pccl-rdma-registration-${{ github.run_id }}/summary.json
            /wl_nas/devops/pccl-rdma-registration-${{ github.run_id }}/diagnostics/
          retention-days: 90
          if-no-files-found: warn
