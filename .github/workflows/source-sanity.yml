    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: t-head/pccl/.github/actions/download-artifact-retry@42c06876282e700ae0434b4577fedd757b6f2db1
        with:
          name: minimal-csv-artifact-python-deps
          path: deps
      - id: build-cache
        name: Check the NAS cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          STATE=$(python3 -S -B pccl/.github/xtest/artifact_cache.py probe \
            --directory "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}')
          case "$STATE" in
            hit)
              echo 'state=hit' >> "$GITHUB_OUTPUT" ;;
            miss|invalid)
              echo 'state=miss' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unexpected cache state: $STATE"
              exit 1 ;;
          esac
      - uses: t-head/pccl/.github/actions/download-artifact-retry@42c06876282e700ae0434b4577fedd757b6f2db1
        if: steps.build-cache.outputs.state == 'miss'
        with:
          name: pccl-build-standard
          path: build-download
          sha256-file: output_standard.tar.gz
          expected-sha256: ${{ env.EXPECTED_SHA }}
      - name: Restore a cleaned NAS cache from the build artifact
        if: steps.build-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/.github/xtest/artifact_cache.py publish \
            --download build-download --cache "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Restore the shared NAS cache and run on master
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: 2
          nproc_per_node: ${{ matrix.cards_per_node }}
          rack_policy: ${{ matrix.platform == 'm890p' && 'same' || '' }}
          node_selector: ${{ matrix.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            : "${HPN_SDK_URL:?Selected HPN SDK URL was not forwarded to this worker}"
            bash /workspace/source/pccl/.github/workflows/scripts/install_hpn_sdk.sh
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            # Keep hostfile names and MPI/NCCL control traffic on the management route.
            export HWLOC_COMPONENTS=-gl
            export OMPI_MCA_plm_rsh_agent=cluster-ssh
            export OMPI_MCA_orte_base_help_aggregate=0
            export OMPI_MCA_orte_keep_fqdn_hostnames=1
            export OMPI_MCA_oob_tcp_if_include="$MPI_INTERFACE"
            export OMPI_MCA_btl_tcp_if_include="$MPI_INTERFACE"
            export NCCL_SOCKET_IFNAME="$MPI_INTERFACE"
            ulimit -l unlimited
            ulimit -s 65536
            if ! command -v ibv_devinfo >/dev/null || ! command -v rdma >/dev/null || ! command -v ip >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              timeout -k 30s 300s apt-get update
              timeout -k 30s 600s apt-get install -y --no-install-recommends rdma-core ibverbs-utils iproute2
            fi
            if test -d /sys/module/alixpu_peermem; then
              echo 'alixpu_peermem is loaded'
            else
              echo 'alixpu_peermem is not loaded; DMA-BUF support is still possible'
            fi
            echo "MPI and NCCL control interface: $MPI_INTERFACE"
            ip -4 -o addr show dev "$MPI_INTERFACE"
            ibv_devinfo
            rdma link show
            python3 - <<'PY'
            import ipaddress
            from pathlib import Path

            valid = []
            for path in Path('/sys/class/infiniband').glob('*/ports/*/gids/*'):
                value = path.read_text().strip()
                if value and not ipaddress.IPv6Address(value).is_link_local and int(value.replace(':', ''), 16) != 0:
                    valid.append((str(path), value))
            if not valid:
                raise SystemExit('No non-zero RoCE GID is visible inside the worker')
            for path, value in valid:
                print(f'Valid RoCE GID: {path} -> {value}')
            PY
            test -d /dev/infiniband
            test -r /proc/net/route
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            umask 022
            cd "$SOURCE_DIR"
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
            SHARED_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/shared-standard/${{ matrix.platform }}/${{ env.EXPECTED_SHA }}
            export build_output="$SHARED_ROOT/output_standard"
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/${{ matrix.platform }}/cluster
            rm -rf "$RESULT_ROOT" "$SHARED_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")" "$SHARED_ROOT"
            cleanup_shared_build() {
              rm -rf "$(dirname "$SHARED_ROOT")"
            }
            trap cleanup_shared_build EXIT
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            python3 -S -B pccl/.github/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile standard \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            tar -xzf "$CACHE_DIR/output_standard.tar.gz" -C "$SHARED_ROOT"
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ needs.prepare.outputs.pccl_tests_revision }}'
            python3 -m venv /workspace/minimal-csv-cluster-env
            /workspace/minimal-csv-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/deps" \
              -r "$build_output/pccl/.github/xtest/requirements.txt"
            /workspace/minimal-csv-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            test "$NCCL_SOCKET_IFNAME" = "$MPI_INTERFACE"
            test "$OMPI_MCA_orte_keep_fqdn_hostnames" = 1
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            checked_hosts=0
            while read -r host _; do
              timeout -k 5s 30s cluster-ssh "$host" 'hostname' < /dev/null
              checked_hosts=$((checked_hosts + 1))
            done < "$CLUSTER_HOSTS_FILE"
            test "$checked_hosts" -eq 2
            timeout -k 10s 60s mpirun --allow-run-as-root \
              --hostfile "$CLUSTER_HOSTS_FILE" -np 2 -npernode 1 hostname
            /workspace/minimal-csv-cluster-env/bin/python -B \
              "$build_output/pccl/.github/xtest/run_cases.py" \
              --input "$build_output/pccl/${{ env.INPUT_DIR }}" \
              --profile standard --nodes 2 \
              --map-nvidia-devices \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --hostfile "$CLUSTER_HOSTS_FILE" \
              --mpi-interface "$MPI_INTERFACE" \
              --build-record "$CACHE_DIR/output_standard.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"

  results:
    name: Reconcile hardware results and clean NAS
    needs: [precheck, commit-checks, prepare, ai-code-review, human-review, build-standard, build-notsm, stage-cache, single-node, two-node]
    if: >-
      always() && needs.prepare.result == 'success' &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.event_name != 'pull_request' ||
        (needs.precheck.result == 'success' && needs.commit-checks.result == 'success' &&
         needs.ai-code-review.result == 'success' && needs.human-review.result == 'success'))
    permissions:
      contents: read
    env:
      HPN_SDK_URL: ${{ needs.prepare.outputs.hpn_sdk_url }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - id: reconcile
        name: Reconcile all selected hardware results
        run: |
          status=0
          python3 -S -B pccl/.github/xtest/reconcile_results.py \
            --input pccl/.github/xtest/minimal-csv \
            --results /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/m890p \
            --public public-results/m890p \
            --pccl-revision '${{ github.sha }}' \
            --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --standard-sha256 '${{ needs.build-standard.outputs.artifact_sha256 }}' \
            --notsm-sha256 '${{ needs.build-notsm.outputs.artifact_sha256 }}' \
            --cards-per-node '${{ env.VALIDATION_CARDS }}' || status=$?
          python3 -S -B pccl/.github/xtest/reconcile_results.py \
            --input pccl/.github/xtest/minimal-csv-oam810e-eic \
            --results /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/oam810e_eic \
            --public public-results/oam810e_eic \
            --pccl-revision '${{ github.sha }}' \
            --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --standard-sha256 '${{ needs.build-standard.outputs.artifact_sha256 }}' \
            --notsm-sha256 '${{ needs.build-notsm.outputs.artifact_sha256 }}' \
            --cards-per-node '4' || status=$?
          exit "$status"
      - id: results-upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-node-source-sanity-results
          path: |
            public-results/
            /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/**/raw.log
            /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/**/dmesg*.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
      - id: cleanup
        name: Remove run-owned NAS build artifacts
        if: always() && steps.checkout.outcome == 'success'
        env:
          NEEDS: ${{ toJSON(needs) }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          RESULTS_UPLOAD_OUTCOME: ${{ steps.results-upload.outcome }}
        run: |
          PRESERVE=$(python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ['NEEDS'])
          names = ('prepare', 'build-standard', 'build-notsm', 'stage-cache',
                   'single-node', 'two-node')
          failed = any(needs[name]['result'] != 'success' for name in names)
          failed = (failed or os.environ['RECONCILE_OUTCOME'] != 'success' or
                    os.environ['RESULTS_UPLOAD_OUTCOME'] != 'success')
          print(int(failed))
          PY
          )
          if [ "$PRESERVE" = 1 ]; then
            python3 -S -B pccl/.github/xtest/artifact_cache.py cleanup \
              --root /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }} \
              --run-id '${{ github.run_id }}' --preserve-cache
          else
            python3 -S -B pccl/.github/xtest/artifact_cache.py cleanup \
              --root /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }} \
              --run-id '${{ github.run_id }}'
          fi

  summary:
    name: PCCL Tests Gate
    needs: [precheck, commit-checks, prepare, ai-code-review, human-review, build-standard, build-notsm, stage-cache, single-node, two-node, results]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: support
        name: Reject unsupported repository or event
        shell: bash
        env:
          SUPPORTED: >-
            ${{
            github.repository == 't-head/pccl' &&
            (github.event_name == 'pull_request' ||
             github.event_name == 'workflow_dispatch' || github.event_name == 'push')
            }}
        run: |
          if [ "$SUPPORTED" != 'true' ]; then
            echo '::error::source-sanity supports same-repository pull requests, main pushes and manual dispatch only.'
            exit 1
          fi
      - name: Require successful results, cleanup and all prerequisite jobs
        if: always() && steps.support.outcome == 'success'
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS'])
          failed = {name: value['result'] for name, value in needs.items()
                    if value['result'] not in ('success', 'skipped')}
          if os.environ['EVENT_NAME'] == 'pull_request':
              for name in ('precheck', 'commit-checks', 'ai-code-review', 'human-review'):
                  if needs[name]['result'] != 'success':
                      failed[name] = needs[name]['result']
          for name in ('prepare', 'build-standard', 'build-notsm', 'stage-cache', 'single-node', 'two-node', 'results'):
              if needs[name]['result'] != 'success':
                  failed[name] = needs[name]['result']
          for name, result in failed.items():
              print(f'::error::{name}: {result}')
          sys.exit(bool(failed))
          PY
