      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      needs.build-standard.result == 'success' && needs.build-notsm.result == 'success' &&
      needs.stage-cache.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: standard, platform: m890p, cards_per_node: 8, node_selector: 'board-type=ZW-M890P,nic-type=cx8'}
          - {profile: notsm, platform: m890p, cards_per_node: 8, node_selector: 'board-type=ZW-M890P,nic-type=cx8'}
          # The 810E standard bundle mixes two-card Suites with the four-card
          # checkin unit Suite, so the Pod is sized to the largest requirement;
          # two-card Cases still select only two devices.
          - {profile: standard, platform: oam810e_eic, cards_per_node: 4, node_selector: 'board-type=OAM-810E,nic-type=eic'}
          - {profile: notsm, platform: oam810e_eic, cards_per_node: 2, node_selector: 'board-type=OAM-810E,nic-type=eic'}
    env:
      HPN_SDK_URL: ${{ needs.prepare.outputs.hpn_sdk_url }}
      EXPECTED_SHA: ${{ matrix.profile == 'standard' && needs.build-standard.outputs.artifact_sha256 || needs.build-notsm.outputs.artifact_sha256 }}
      INPUT_DIR: ${{ matrix.platform == 'oam810e_eic' && '.github/xtest/minimal-csv-oam810e-eic' || '.github/xtest/minimal-csv' }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: t-head/pccl/.github/actions/download-artifact-retry@42c06876282e700ae0434b4577fedd757b6f2db1
        with:
          name: minimal-csv-artifact-python-deps
          path: deps
      - id: build-cache
        name: Check the NAS cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          STATE=$(python3 -S -B pccl/.github/xtest/artifact_cache.py probe \
            --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}')
          case "$STATE" in
            hit)
              echo 'state=hit' >> "$GITHUB_OUTPUT" ;;
            miss|invalid)
              echo 'state=miss' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unexpected cache state: $STATE"
              exit 1 ;;
          esac
      - uses: t-head/pccl/.github/actions/download-artifact-retry@42c06876282e700ae0434b4577fedd757b6f2db1
        if: steps.build-cache.outputs.state == 'miss'
        with:
          name: pccl-build-${{ matrix.profile }}
          path: build-download
          sha256-file: output_${{ matrix.profile }}.tar.gz
          expected-sha256: ${{ env.EXPECTED_SHA }}
      - name: Restore a cleaned NAS cache from the build artifact
        if: steps.build-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/.github/xtest/artifact_cache.py publish \
            --download build-download --cache "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Restore the NAS cache and run single-node Cases
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ matrix.cards_per_node }}
          node_selector: ${{ matrix.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            : "${HPN_SDK_URL:?Selected HPN SDK URL was not forwarded to this worker}"
            bash /workspace/source/pccl/.github/workflows/scripts/install_hpn_sdk.sh
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            export HWLOC_COMPONENTS=-gl
            export OMPI_MCA_orte_base_help_aggregate=0
            export OMPI_MCA_orte_keep_fqdn_hostnames=1
            export OMPI_MCA_oob_tcp_if_include="$MPI_INTERFACE"
            export OMPI_MCA_btl_tcp_if_include="$MPI_INTERFACE"
            export NCCL_SOCKET_IFNAME="$MPI_INTERFACE"
            ulimit -l unlimited
            ulimit -s 65536
            if ! command -v ibv_devinfo >/dev/null || ! command -v rdma >/dev/null || ! command -v ip >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              timeout -k 30s 300s apt-get update
              timeout -k 30s 600s apt-get install -y --no-install-recommends rdma-core ibverbs-utils iproute2
            fi
            if test -d /sys/module/alixpu_peermem; then
              echo 'alixpu_peermem is loaded'
            else
              echo 'alixpu_peermem is not loaded; DMA-BUF support is still possible'
            fi
            echo "MPI and NCCL control interface: $MPI_INTERFACE"
            ip -4 -o addr show dev "$MPI_INTERFACE"
            ibv_devinfo
            rdma link show
            python3 - <<'PY'
            import ipaddress
            from pathlib import Path

            valid = []
            for path in Path('/sys/class/infiniband').glob('*/ports/*/gids/*'):
                value = path.read_text().strip()
                if value and not ipaddress.IPv6Address(value).is_link_local and int(value.replace(':', ''), 16) != 0:
                    valid.append((str(path), value))
            if not valid:
                raise SystemExit('No non-zero RoCE GID is visible inside the worker')
            for path, value in valid:
                print(f'Valid RoCE GID: {path} -> {value}')
            PY
            umask 022
            cd /workspace/source
            export build_output=/workspace/source/output_${{ matrix.profile }}
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/${{ matrix.platform }}/${{ matrix.profile }}
            rm -rf "$RESULT_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            python3 -S -B pccl/.github/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            tar -xzf "$CACHE_DIR/output_${{ matrix.profile }}.tar.gz" -C /workspace/source
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ needs.prepare.outputs.pccl_tests_revision }}'
            python3 -m venv /workspace/minimal-csv-env
            /workspace/minimal-csv-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links /workspace/source/deps \
              -r "$build_output/pccl/.github/xtest/requirements.txt"
            /workspace/minimal-csv-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            test "$NCCL_SOCKET_IFNAME" = "$MPI_INTERFACE"
            test "$OMPI_MCA_orte_keep_fqdn_hostnames" = 1
            /workspace/minimal-csv-env/bin/python -B \
              "$build_output/pccl/.github/xtest/run_cases.py" \
              --input "$build_output/pccl/${{ env.INPUT_DIR }}" \
              --profile '${{ matrix.profile }}' --nodes 1 \
              --map-nvidia-devices \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --mpi-interface "$MPI_INTERFACE" \
              --build-record "$CACHE_DIR/output_${{ matrix.profile }}.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"

  two-node:
    name: Two-node master-only CSV (${{ matrix.platform }})
    needs: [prepare, human-review, build-standard, stage-cache]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
