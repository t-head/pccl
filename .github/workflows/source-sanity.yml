name: source-derived sanity

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-sanity-single-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Standard-library contracts and single-node manifest (no hardware)
    if: >-
      github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.batches.outputs.matrix }}
      profiles: ${{ steps.batches.outputs.profiles }}
      image: ${{ steps.batches.outputs.image }}
      node_selector: ${{ steps.batches.outputs.node_selector }}
      cards_per_node: ${{ steps.batches.outputs.cards_per_node }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: 394556512e87259e9ffa25225632c46b0a0bbcd5
          path: public-runner
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create an empty Python environment without pip
        run: python -m venv --without-pip "$RUNNER_TEMP/prepare-env"
      - name: Test and generate the manifest without network access
        run: |
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            env HOME="$HOME" PREPARE_PYTHON="$RUNNER_TEMP/prepare-env/bin/python" \
            PCCL_TESTS_ROOT="$GITHUB_WORKSPACE/public-runner" \
            PCCL_REVISION="$GITHUB_SHA" RUN_ID="$GITHUB_RUN_ID" RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            BUNDLE_DIR="$RUNNER_TEMP/sanity" \
            bash --noprofile --norc -e -o pipefail -c '
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_catalog.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_manifest.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_metrics.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_build_evidence.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_command.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_execute.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_single_node_ci.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_coverage_map.py" -v
              "$PREPARE_PYTHON" -S -B -m unittest discover -s tests/xtest -p "test_prepare.py" -v
              "$PREPARE_PYTHON" -I -S -B .github/workflows/scripts/test_migration_contract.py \
                --pccl-tests "$PCCL_TESTS_ROOT"
              "$PREPARE_PYTHON" -S -B tests/xtest/manifest.py --suite pr --single-node \
                --pccl-revision "$PCCL_REVISION" --pccl-tests "$PCCL_TESTS_ROOT" \
                --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --output "$BUNDLE_DIR"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: single-node-sanity-manifest
          path: ${{ runner.temp }}/sanity/manifest.json
          if-no-files-found: error
      - name: Generate the two-node manifest and stage its offline dependencies
        # The two-node job reuses the standard build, so it only needs the reviewed
        # manifest plus the pinned wheel the isolated pod cannot download itself.
        run: |
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_cluster_ci.py' -v
          python3 -S -B tests/xtest/cluster_ci.py prepare \
            --pccl-revision "$GITHUB_SHA" --pccl-tests public-runner \
            --output "$RUNNER_TEMP/cluster-manifest"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/cluster-deps" filelock==3.20.3
          printf '%s  %s\n' \
            '4b0dda527ee31078689fc205ec4f1c1bf7d56cf88b6dc9426c4f230e46c2dce1' \
            "$RUNNER_TEMP/cluster-deps/filelock-3.20.3-py3-none-any.whl" | sha256sum --check -
        env:
          PCCL_TESTS_ROOT: ${{ github.workspace }}/public-runner
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-run-source-manifest
          path: ${{ runner.temp }}/cluster-manifest/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-run-python-deps
          path: ${{ runner.temp }}/cluster-deps/
          if-no-files-found: error
      - name: Derive resource batches from the validated Suite contexts
        id: batches
        run: |
          shard_matrix=$("$RUNNER_TEMP/prepare-env/bin/python" -S -B tests/xtest/single_node_ci.py matrix \
            --manifest "$RUNNER_TEMP/sanity/manifest.json")
          profile_matrix=$(printf '%s' "$shard_matrix" | "$RUNNER_TEMP/prepare-env/bin/python" -c 'import json,sys; entries=json.load(sys.stdin)["include"]; groups={}; [groups.setdefault(e["profile"], []).append(e["shard_id"]) for e in entries]; print(json.dumps({"include": [{"profile": p, "shards": " ".join(sorted(s)), "nproc_per_node": next(e["nproc_per_node"] for e in entries if e["profile"] == p)} for p, s in sorted(groups.items())]}))')
          profiles=$(printf '%s' "$shard_matrix" | "$RUNNER_TEMP/prepare-env/bin/python" -c 'import json,sys; print(json.dumps(sorted({e["profile"] for e in json.load(sys.stdin)["include"]})))')
          image=$(printf '%s' "$shard_matrix" | "$RUNNER_TEMP/prepare-env/bin/python" -c 'import json,sys; print(json.load(sys.stdin)["include"][0]["image"])')
          node_selector=$(printf '%s' "$shard_matrix" | "$RUNNER_TEMP/prepare-env/bin/python" -c 'import json,sys; print(json.load(sys.stdin)["include"][0]["node_selector"])')
          cards_per_node=$(printf '%s' "$shard_matrix" | "$RUNNER_TEMP/prepare-env/bin/python" -c 'import json,sys; print(json.load(sys.stdin)["include"][0]["nproc_per_node"])')
          printf 'matrix=%s\nprofiles=%s\nimage=%s\nnode_selector=%s\ncards_per_node=%s\n' "$profile_matrix" "$profiles" "$image" "$node_selector" "$cards_per_node" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            '## Source-derived manifest' \
            'Suite resources and container bindings determine each execution batch.' \
            'Manifest generation and contract tests used no pip, xtest, mmengine, network access, PPU allocation, or benchmark execution; dependency staging is separate and uses pinned downloads.' \
            >> "$GITHUB_STEP_SUMMARY"

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: prepare
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: [prepare, ai-code-review]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  build-standard:
    name: Build standard (ubuntu24_hggcrt13)
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push') &&
      contains(fromJSON(needs.prepare.outputs.profiles), 'standard')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: 394556512e87259e9ffa25225632c46b0a0bbcd5
          path: pccl-tests
          persist-credentials: false
      - name: Build and archive standard output
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ needs.prepare.outputs.image }}
          nnodes: 0
          nproc_per_node: ${{ needs.prepare.outputs.cards_per_node }}
          node_selector: ${{ needs.prepare.outputs.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_standard
            mkdir -p "$build_output"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/build.sh
            # Keyed by run only: a re-run of the failed jobs keeps the same run id but a
            # new attempt, and the test jobs must still find this build.
            NAS_BUILD_DIR=/mnt/wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/build
            mkdir -p "$NAS_BUILD_DIR"
            tar -czf "$NAS_BUILD_DIR/output_standard.tar.gz" -C /workspace/source output_standard
            sha256sum "$NAS_BUILD_DIR/output_standard.tar.gz" > "$NAS_BUILD_DIR/output_standard.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/tests/xtest/build_evidence.py" create \
              --archive "$NAS_BUILD_DIR/output_standard.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile standard --output "$NAS_BUILD_DIR/output_standard.build.json"

  build-notsm:
    name: Build notsm
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push') &&
      contains(fromJSON(needs.prepare.outputs.profiles), 'notsm')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: 394556512e87259e9ffa25225632c46b0a0bbcd5
          path: pccl-tests
          persist-credentials: false
      - name: Build and archive notsm output
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ needs.prepare.outputs.image }}
          nnodes: 0
          nproc_per_node: ${{ needs.prepare.outputs.cards_per_node }}
          node_selector: ${{ needs.prepare.outputs.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_notsm
            mkdir -p "$build_output"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/notsm_build.sh
            # Keyed by run only: a re-run of the failed jobs keeps the same run id but a
            # new attempt, and the test jobs must still find this build.
            NAS_BUILD_DIR=/mnt/wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/build
            mkdir -p "$NAS_BUILD_DIR"
            tar -czf "$NAS_BUILD_DIR/output_notsm.tar.gz" -C /workspace/source output_notsm
            sha256sum "$NAS_BUILD_DIR/output_notsm.tar.gz" > "$NAS_BUILD_DIR/output_notsm.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/tests/xtest/build_evidence.py" create \
              --archive "$NAS_BUILD_DIR/output_notsm.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile notsm --output "$NAS_BUILD_DIR/output_notsm.build.json"

  sanity:
    name: Source sanity (${{ matrix.profile }})
    needs: [prepare, build-standard, build-notsm]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.build-standard.result == 'success' || needs.build-standard.result == 'skipped') &&
      (needs.build-notsm.result == 'success' || needs.build-notsm.result == 'skipped') &&
      github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: single-node-sanity-manifest
          path: sanity-manifest
      - name: Check staging storage without changing shared permissions
        run: test -d /wl_nas/devops && test -w /wl_nas/devops
      - name: Restore the shared build and execute source-derived cases
        uses: t-head/ppu-scheduler-action@aac83e464f2a3fcbddddc60c8016021c996092a6
        with:
          image: ${{ needs.prepare.outputs.image }}
          nnodes: 0
          nproc_per_node: ${{ matrix.nproc_per_node }}
          node_selector: ${{ needs.prepare.outputs.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_${{ matrix.profile }}
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/results
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/build
            mkdir -p "$RESULT_ROOT"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            sha256sum --check "$BUILD_ROOT/output_${{ matrix.profile }}.tar.gz.sha256"
            tar -xzf "$BUILD_ROOT/output_${{ matrix.profile }}.tar.gz" -C /workspace/source

            python3 -m venv /workspace/pccl-source-env
            /workspace/pccl-source-env/bin/python -m pip install --disable-pip-version-check \
              -r pccl/tests/xtest/requirements.txt
            /workspace/pccl-source-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            # PCCL_PATH is exported by the internal build-system publish step and is read by
            # neither pccl nor pccl-tests at the pinned revisions. Drop it so the inherited
            # environment of a measured Case is exactly what the manifest declares.
            unset PCCL_PATH
            export LD_LIBRARY_PATH="$build_output/lib:${LD_LIBRARY_PATH:-}"
            env | grep -E '^(PCCL|NCCL|HGGC|OMPI|UCX|UMD)_' | sort > "$RESULT_ROOT/env-${{ matrix.profile }}.txt" || true
            for shard in ${{ matrix.shards }}; do
              echo "### Source sanity $shard"
              # A re-run must replace its own evidence instead of colliding with it.
              rm -rf "$RESULT_ROOT/${{ matrix.profile }}/$shard"
              /workspace/pccl-source-env/bin/python "$build_output/pccl/tests/xtest/single_node_ci.py" run \
                --manifest /workspace/source/sanity-manifest/manifest.json \
                --profile '${{ matrix.profile }}' --shard "$shard" --test-root "$build_output" \
                --build-record "$BUILD_ROOT/output_${{ matrix.profile }}.build.json" \
                --build-archive "$BUILD_ROOT/output_${{ matrix.profile }}.tar.gz" \
                --output "$RESULT_ROOT/${{ matrix.profile }}"
            done

  cluster:
    name: Two-node M890P MPI (shared standard build)
    needs: [prepare, build-standard]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.build-standard.result == 'success' &&
      github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: 394556512e87259e9ffa25225632c46b0a0bbcd5
          path: pccl-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cluster-run-source-manifest
          path: cluster-manifest
      - uses: actions/download-artifact@v4
        with:
          name: cluster-run-python-deps
          path: cluster-deps
      - name: Check staging storage without changing shared permissions
        run: test -d /wl_nas/devops && test -w /wl_nas/devops
      - name: Run the reviewed MPI Case on the shared standard build
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          launch_mode: master
          image: ${{ needs.prepare.outputs.image }}
          nnodes: 2
          nproc_per_node: ${{ needs.prepare.outputs.cards_per_node }}
          node_selector: ${{ needs.prepare.outputs.node_selector }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /dev/infiniband
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            cd "$SOURCE_DIR"
            # Reuse the tarball build-standard already archived for this run. It has to be
            # staged on the shared NAS and not in $SOURCE_DIR: cluster-run runs `command` on
            # the master only, and every rank loads the same binaries and libraries.
            BUILD_ROOT=/mnt/wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/build
            RUN_ROOT=/mnt/wl_nas/devops/pccl-cluster-run/${{ github.run_id }}
            RESULT_ROOT="$RUN_ROOT/results"
            export source_home="$SOURCE_DIR"
            export build_output="$RUN_ROOT/output_standard"
            umask 022
            install -d -m 0755 /mnt/wl_nas/devops/pccl-cluster-run "$RUN_ROOT" "$RESULT_ROOT"
            make_results_readable() {
              chmod a+rx /mnt/wl_nas/devops/pccl-cluster-run 2>/dev/null || true
              chmod -R a+rX "$RUN_ROOT" 2>/dev/null || true
            }
            trap make_results_readable EXIT
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            sha256sum --check "$BUILD_ROOT/output_standard.tar.gz.sha256"
            tar -xzf "$BUILD_ROOT/output_standard.tar.gz" -C "$RUN_ROOT"
            test -d "$build_output/lib"
            python3 -m venv /workspace/pccl-cluster-env
            /workspace/pccl-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/cluster-deps" -r pccl/tests/xtest/requirements.txt
            /workspace/pccl-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            export LD_LIBRARY_PATH="$build_output/lib:${LD_LIBRARY_PATH:-}"
            rm -rf "$RESULT_ROOT/standard"
            cp "$CLUSTER_HOSTS_FILE" "$build_output/hosts.cfg"
            test "$(wc -l < "$build_output/hosts.cfg")" -eq 2
            /workspace/pccl-cluster-env/bin/python \
              "$build_output/pccl/tests/xtest/cluster_ci.py" run \
              --manifest "$SOURCE_DIR/cluster-manifest/manifest.json" \
              --test-root "$build_output" \
              --build-record "$BUILD_ROOT/output_standard.build.json" \
              --build-archive "$BUILD_ROOT/output_standard.tar.gz" \
              --output "$RESULT_ROOT/standard"
      - name: Print sanitized MPI diagnostics
        if: always()
        run: |
          python3 -B pccl/tests/xtest/cluster_ci.py diagnose \
            --results /wl_nas/devops/pccl-cluster-run/${{ github.run_id }}/results/standard

  summary:
    name: PCCL Tests Gate
    needs: [prepare, ai-code-review, human-review, build-standard, build-notsm, sanity, cluster]
    if: >-
      always() && github.repository == 't-head/pccl' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: single-node-sanity-manifest
          path: sanity-manifest
      - uses: actions/download-artifact@v4
        with:
          name: cluster-run-source-manifest
          path: cluster-manifest
      - name: Reconcile every source Case and execution record
        run: |
          python3 -B tests/xtest/single_node_ci.py summary \
            --manifest sanity-manifest/manifest.json \
            --results /wl_nas/devops/pccl-source-sanity/${{ github.run_id }}/results \
            --output public-results
      - name: Reconcile the two-node MPI execution record
        if: always() && needs.cluster.result != 'skipped'
        run: |
          python3 -B tests/xtest/cluster_ci.py summary \
            --manifest cluster-manifest/manifest.json \
            --results /wl_nas/devops/pccl-cluster-run/${{ github.run_id }}/results/standard \
            --output public-results-cluster
      - name: Require one build identity per profile
        if: always() && needs.cluster.result != 'skipped'
        run: |
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, 'tests/xtest')
          from single_node_ci import validate_shared_build

          single = json.load(open('public-results/summary.json'))
          cluster = json.load(open('public-results-cluster/summary.json'))
          identities = validate_shared_build(single['builds'], cluster['build'])
          print(json.dumps(identities, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always() && needs.cluster.result != 'skipped'
        with:
          name: cluster-run-source-results
          path: public-results-cluster/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-node-source-sanity-results
          path: public-results/
          if-no-files-found: error
      - name: Require every expected build and test shard
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS'])
          if os.environ['EVENT_NAME'] == 'pull_request':
              for name in ('ai-code-review', 'human-review'):
                  if needs[name]['result'] != 'success':
                      print(f"::error::{name}: {needs[name]['result']}")
                      sys.exit(1)
          failed = {name: value['result'] for name, value in needs.items()
                    if value['result'] not in ('success', 'skipped')}
          for name in ('prepare', 'sanity', 'cluster'):
              if needs[name]['result'] != 'success':
                  failed[name] = needs[name]['result']
          for name, result in failed.items():
              print(f'::error::{name}: {result}')
          sys.exit(bool(failed))
          PY
