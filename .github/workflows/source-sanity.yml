# Temporary branch only: reuse the registered source-sanity dispatch entrypoint.
# PR #220's branch and its normal workflow remain unchanged.
name: 810E PR220 all-reduce 100-run stress

on:
  workflow_dispatch:
    inputs:
      hpn_sdk_url:
        description: HPN installer URL; use the incident's HPN 2.1.3 package to match its runtime
        type: string
        required: false
        default: ''
      mpi_interface:
        description: MPI control interface (incident used eth0)
        type: string
        required: true
        default: eth0

permissions:
  contents: read

concurrency:
  group: all-reduce-pr220-stress
  cancel-in-progress: false

env:
  PCCL_REVISION: 085dcd1fec4e4a96495cf1aa351f72c9f49ed8ba
  PCCL_TESTS_REVISION: 394556512e87259e9ffa25225632c46b0a0bbcd5

jobs:
  stress:
    if: github.repository == 't-head/pccl'
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 780
    steps:
      - uses: actions/checkout@v4
        with:
          path: stress-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl
          ref: ${{ env.PCCL_REVISION }}
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Stage dispatch settings without injecting them into a shell script
        env:
          HPN_SDK_URL: ${{ inputs.hpn_sdk_url }}
          MPI_INTERFACE: ${{ inputs.mpi_interface }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('stress-inputs.json').write_text(json.dumps({
              name: os.environ[name] for name in ('HPN_SDK_URL', 'MPI_INTERFACE')
          }))
          PY
      - name: Build once and run 100 independent two-rank launches
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
          nnodes: 0
          nproc_per_node: 2
          node_selector: board-type=OAM-810E,nic-type=eic
          namespace: ppu-sched
          timeout_minutes: 720
          cleanup_policy: always
          dmesg_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          command: |
            set -eo pipefail
            cd /workspace/source
            export PCCL_REVISION='${{ env.PCCL_REVISION }}'
            export PCCL_TESTS_REVISION='${{ env.PCCL_TESTS_REVISION }}'
            # Pass dispatch inputs through a JSON file, never shell interpolation.
            eval "$(python3 - <<'PY'
            import json
            import shlex
            from pathlib import Path
            values = json.loads(Path('stress-inputs.json').read_text())
            for name in ('HPN_SDK_URL', 'MPI_INTERFACE'):
                print('export ' + name + '=' + shlex.quote(values[name]))
            PY
            )"
            export PCCL_SOURCE=/workspace/source/pccl
            export PCCL_TESTS_SOURCE=/workspace/source/pccl-tests
            export RUNS=100 RUN_TIMEOUT=300
            export WORK_ROOT=/mnt/wl_nas/devops/pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}
            ulimit -l unlimited
            ulimit -s 65536
            # Match PR #220's build dependency, without invoking its full-suite build.
            export DEBIAN_FRONTEND=noninteractive
            timeout -k 30s 300s apt-get update
            timeout -k 30s 600s apt-get install -y --no-install-recommends libboost-program-options-dev
            bash stress-tools/tests/stress/all_reduce_810e_pr220/run.sh
      - name: Upload build and per-run evidence even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /wl_nas/devops/pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            /wl_nas/devops/pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            /wl_nas/devops/pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            /wl_nas/devops/pccl-pr220-all-reduce-stress-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: warn
