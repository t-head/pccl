name: source-derived sanity

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hpn_sdk_url:
        description: Public trusted HTTPS HPN SDK installer URL; no credentials, query parameters or fragments
        required: false
        type: string
        default: https://zone-ci.oss-cn-hangzhou.aliyuncs.com/hpn-sdk/2.1.3/hpnsdk2.1.3-ubuntu2404-202611121836-x86_64.bin

permissions:
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: source-sanity-single-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HPN_SDK_URL: https://zone-ci.oss-cn-hangzhou.aliyuncs.com/hpn-sdk/2.1.3/hpnsdk2.1.3-ubuntu2404-202611121836-x86_64.bin
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.1-hggcrt3-ubuntu24.04-py312-20261123
  # Install HPN SDK 2.1.3 by default; manual dispatch can select another trusted URL.
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P,nic-type=cx8
  VALIDATION_CARDS: '8'
  # t-head/pccl-tests is checked out from the branch of the same name as the ref this run builds, so a
  # release branch pairs with its own tests instead of the mainline. A pull request uses its source
  # branch, a push to main uses main, and a ref without a paired pccl-tests branch falls back to main.
  # The revision itself is resolved once in prepare and handed to every job.
  PCCL_TESTS_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  precheck:
    name: Pre-check (Secret Scan)
    if: >-
      github.event_name == 'pull_request' && github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  commit-checks:
    name: Pre-check (Commit Message & DCO)
    if: >-
      github.event_name == 'pull_request' && github.repository == 't-head/pccl'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check contribution commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          sys.path.insert(0, '.github/scripts')
          from commit_attribution import validate_attribution

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          head_sha = os.environ['HEAD_SHA']
          parents = git('show', '-s', '--format=%P', os.environ['GITHUB_SHA']).split()
          if len(parents) != 2 or parents[1] != head_sha:
              sys.exit('Test merge does not match the PR head; start a new checkin run.')
          # The event base SHA can lag behind the base already included in this test merge.
          commits = git('rev-list', parents[0] + '..' + head_sha).splitlines()
          errors = []
          for sha in commits:
              message = git('show', '-s', '--format=%B', sha)
              try:
                  validate_attribution(message)
              except ValueError as error:
                  errors.append(f'{sha[:12]}: {error}')
              lines = message.splitlines()
              if not lines or not lines[0].strip():
                  errors.append(f'{sha[:12]}: title must not be empty')
              elif len(lines[0]) > 50:
                  print(f'::notice::{sha[:12]}: title exceeds the recommended 50 characters; consider shortening it')
              if len(lines) > 1 and lines[1] != '':
                  errors.append(f'{sha[:12]}: second line must be blank')
              issue_ref = r'(?i:\b(?:Refs|Closes|Fixes))[ \t]+(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[1-9][0-9]*\b|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[1-9][0-9]*\b'
              if not re.search(issue_ref, '\n'.join(lines[1:])):
                  errors.append(f'{sha[:12]}: missing issue reference in commit body')

              trailers = subprocess.check_output(
                  ['git', 'interpret-trailers', '--parse', '--no-divider'], input=message, text=True).splitlines()
              signoffs = [match.groups() for line in trailers
                          if (match := re.fullmatch(
                              r'Signed-off-by: (\S(?:.*\S)?) <([^<>\s]+@[^<>\s]+)>', line))]
              author = tuple(git('show', '-s', '--format=%an%x00%ae', sha).rstrip('\n').split('\0'))
              if not signoffs:
                  errors.append(f'{sha[:12]}: missing valid Signed-off-by trailer')
              elif author not in signoffs:
                  errors.append(f'{sha[:12]}: Signed-off-by name and email must match the commit author')
          for error in errors:
              print(error)
          print(f'Checked {len(commits)} contribution commits for message format and DCO.')
          sys.exit(bool(errors))
          PY

  prepare:
    name: Validate CSV and artifact cache contracts
    needs: [precheck, commit-checks]
    if: >-
      always() &&
      (needs.precheck.result == 'success' || needs.precheck.result == 'skipped') &&
      (needs.commit-checks.result == 'success' || needs.commit-checks.result == 'skipped') &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    outputs:
      hpn_sdk_url: ${{ steps.sdk-selection.outputs.hpn_sdk_url }}
      pccl_tests_revision: ${{ steps.pccl-tests.outputs.sha }}
      pccl_tests_branch: ${{ steps.pccl-tests.outputs.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: sdk-selection
        name: Select the public HPN SDK URL
        uses: actions/github-script@v7
        with:
          script: |
            const selected = context.payload.inputs?.hpn_sdk_url || process.env.HPN_SDK_URL;
            try {
              const parsed = new URL(selected);
              if (parsed.protocol !== 'https:' ||
                  parsed.hostname !== 'zone-ci.oss-cn-hangzhou.aliyuncs.com' ||
                  !['', '443'].includes(parsed.port) || parsed.username || parsed.password ||
                  !parsed.pathname.endsWith('.bin') || /[\s?#@]/.test(selected)) {
                throw new Error('unsupported SDK URL');
              }
              core.setOutput('hpn_sdk_url', selected);
            } catch {
              core.setFailed('HPN SDK URL must be a public, credential-free HTTPS .bin URL on the trusted OSS host, without query parameters or fragments.');
            }
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - id: pccl-tests
        name: Resolve the pccl-tests revision
        env:
          TESTS_BRANCH: ${{ env.PCCL_TESTS_BRANCH }}
        run: |
          set -euo pipefail
          resolve() {
            git ls-remote https://github.com/t-head/pccl-tests.git "refs/heads/$1" 2>/dev/null \
              | awk 'NR==1 {print $1}'
          }
          branch="${TESTS_BRANCH}"
          sha=""
          for attempt in 1 2 3; do
            sha=$(resolve "${branch}") || true
            if [ -n "${sha}" ]; then break; fi
            echo "::warning::could not resolve t-head/pccl-tests ${branch} (attempt ${attempt}/3)"
            sleep 15
          done
          # A ref without a paired pccl-tests branch keeps running against main instead of failing
          # the whole workflow; the fallback is named here and in every job's build identity.
          if [ -z "${sha}" ] && [ "${branch}" != "main" ]; then
            echo "::warning::t-head/pccl-tests has no branch ${branch}; falling back to main"
            branch="main"
            sha=$(resolve "${branch}") || true
          fi
          if [ -z "${sha}" ]; then
            echo "::error::could not resolve t-head/pccl-tests ${branch}"
            exit 1
          fi
          echo "pccl-tests source: ${branch} @ ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ steps.pccl-tests.outputs.sha }}
          path: pccl-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test executors and validate real selections
        working-directory: pccl
        env:
          HPN_SDK_URL: ${{ steps.sdk-selection.outputs.hpn_sdk_url }}
          PCCL_TESTS_REVISION: ${{ steps.pccl-tests.outputs.sha }}
          PCCL_TESTS_BRANCH: ${{ steps.pccl-tests.outputs.branch }}
        run: |
          python3 -S -B -W error::ResourceWarning -m unittest discover \
            -s .github/xtest -p 'test_run_cases.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_artifact_cache.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_download_artifact_retry.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_remote_recovery.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_hpn_sdk.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_case_group_cache.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_daily_reconcile.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_performance_report.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_generate_cases.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_group_cases.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_daily_smoke.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_reconcile_results.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_workflow_contract.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_platform_cases.py' -v
          python3 -S -B -m unittest discover -s .github/xtest -p 'test_export_810e_unit_cases.py' -v
          python3 -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, '.github/xtest')
          import reconcile_results
          from artifact_cache import FIXTURE_RUNNER_REVISION, RUNNER_HASHES

          runner = Path('../pccl-tests').resolve()
          revision = subprocess.check_output(['git', '-C', str(runner), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == os.environ['PCCL_TESTS_REVISION']
          # RUNNER_HASHES records the run_test entry points validated against the committed export
          # fixtures, which only exist for main. A branch carries its own runner, so drift there is
          # reported and the run continues; on main the bytes must still match the baseline exactly.
          drift = sorted(name for name, expected in RUNNER_HASHES.items()
                         if hashlib.sha256((runner / name).read_bytes()).hexdigest() != expected)
          if drift and os.environ['PCCL_TESTS_BRANCH'] == 'main':
              raise AssertionError(f'pccl-tests main runner scripts drifted: {drift}')
          for name in drift:
              print(f"::warning::pccl-tests {os.environ['PCCL_TESTS_BRANCH']} {name} differs from "
                    'the validated main baseline')
          # The fixtures under .github/xtest are committed together with the pccl-tests main
          # revision they were generated from, so they are checked against that label rather
          # than against the branch this run happens to check out.
          metadata = json.loads(Path('.github/xtest/minimal-csv/export.json').read_text())
          assert metadata['runner_revision'] == FIXTURE_RUNNER_REVISION
          metadata_810e = json.loads(Path('.github/xtest/minimal-csv-oam810e-eic/export.json').read_text())
          assert metadata_810e['runner_revision'] == FIXTURE_RUNNER_REVISION
          selections = reconcile_results.load_selections(
              Path('.github/xtest/minimal-csv'), int(os.environ['VALIDATION_CARDS']))
          expected = {'standard': 116, 'cluster': 1, 'notsm': 37}
          for name, count in expected.items():
              selected = selections[name]
              assert len(selected['cases']) == count
              print(f'{name} selection: {count} Cases')
          selections_810e = reconcile_results.load_selections(
              Path('.github/xtest/minimal-csv-oam810e-eic'), 4)
          expected_810e = {'standard': 66, 'cluster': 2, 'notsm': 9}
          for name, count in expected_810e.items():
              assert len(selections_810e[name]['cases']) == count
              print(f'810E {name} selection: {count} Cases')
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          PY
      - name: Stage the pinned benchmark dependency
        run: |
          mkdir -p deps
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest deps filelock==4.2.10
          printf '%s  %s\n' \
            '9479aaeb4db20b5a53e3da28493edd24720b66b8a0b84030aa56ccdf243d6857' \
            'deps/filelock-4.2.10-py3-none-any.whl' | sha256sum --check -
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-csv-artifact-python-deps
          path: deps/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: [precheck, commit-checks]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: [prepare, ai-code-review]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  build-standard:
    name: Build and upload standard
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
    env:
      # cluster-run automatically forwards job env through USER_ENV_JSON.
      HPN_SDK_URL: ${{ needs.prepare.outputs.hpn_sdk_url }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ needs.prepare.outputs.pccl_tests_revision }}
          path: pccl-tests
          persist-credentials: false
      - name: Build standard output
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            : "${HPN_SDK_URL:?Selected HPN SDK URL was not forwarded to this worker}"
            bash pccl/.github/workflows/scripts/install_hpn_sdk.sh
            export source_home=/workspace/source
            export build_output=/workspace/source/output_standard
            STAGING=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
            RUN_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}
            mkdir -p "$build_output" "$STAGING"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/build.sh
            tar -czf "$STAGING/output_standard.tar.gz" -C /workspace/source output_standard
            sha256sum "$STAGING/output_standard.tar.gz" > "$STAGING/output_standard.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/.github/xtest/artifact_cache.py" create \
              --archive "$STAGING/output_standard.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile standard --output "$STAGING/output_standard.build.json"
            chmod -R a+rwX "$RUN_ROOT"
      - id: identity
        name: Validate the standard artifact before upload
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
        run: |
          EXPECTED_SHA=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["STAGING"], "output_standard.build.json")))["artifact_sha256"])')
          python3 -S -B pccl/.github/xtest/artifact_cache.py validate \
            --directory "$STAGING" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 "$EXPECTED_SHA"
          echo "artifact_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish the standard NAS cache
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ steps.identity.outputs.artifact_sha256 }}
        run: |
          python3 -S -B pccl/.github/xtest/artifact_cache.py publish \
            --download "$STAGING" --cache "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ steps.identity.outputs.artifact_sha256 }}'
      - uses: actions/upload-artifact@v4
        with:
          name: pccl-build-standard
          path: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ steps.identity.outputs.artifact_sha256 }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Remove transient standard NAS staging
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard')
          PY

  build-notsm:
    name: Build and upload notsm
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
    env:
      HPN_SDK_URL: ${{ needs.prepare.outputs.hpn_sdk_url }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ needs.prepare.outputs.pccl_tests_revision }}
          path: pccl-tests
          persist-credentials: false
      - name: Build notsm output
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            : "${HPN_SDK_URL:?Selected HPN SDK URL was not forwarded to this worker}"
            bash pccl/.github/workflows/scripts/install_hpn_sdk.sh
            export source_home=/workspace/source
            export build_output=/workspace/source/output_notsm
            STAGING=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm
            RUN_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}
            mkdir -p "$build_output" "$STAGING"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/notsm_build.sh
            tar -czf "$STAGING/output_notsm.tar.gz" -C /workspace/source output_notsm
            sha256sum "$STAGING/output_notsm.tar.gz" > "$STAGING/output_notsm.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/.github/xtest/artifact_cache.py" create \
              --archive "$STAGING/output_notsm.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile notsm --output "$STAGING/output_notsm.build.json"
            chmod -R a+rwX "$RUN_ROOT"
      - id: identity
        name: Validate the notsm artifact before upload
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm
        run: |
          EXPECTED_SHA=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["STAGING"], "output_notsm.build.json")))["artifact_sha256"])')
          python3 -S -B pccl/.github/xtest/artifact_cache.py validate \
            --directory "$STAGING" --profile notsm \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 "$EXPECTED_SHA"
          echo "artifact_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish the notsm NAS cache
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/notsm/${{ steps.identity.outputs.artifact_sha256 }}
        run: |
          python3 -S -B pccl/.github/xtest/artifact_cache.py publish \
            --download "$STAGING" --cache "$CACHE_DIR" --profile notsm \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ needs.prepare.outputs.pccl_tests_revision }}' \
            --expected-sha256 '${{ steps.identity.outputs.artifact_sha256 }}'
      - uses: actions/upload-artifact@v4
        with:
          name: pccl-build-notsm
          path: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/notsm/${{ steps.identity.outputs.artifact_sha256 }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Remove transient notsm NAS staging
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm')
          PY

  stage-cache:
    name: Stage ${{ matrix.profile }} from artifact or valid NAS cache
    needs: [prepare, build-standard, build-notsm]
    if: >-
      !cancelled() && needs.build-standard.result == 'success' &&
      needs.build-notsm.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, notsm]
    env:
      HPN_SDK_URL: ${{ needs.prepare.outputs.hpn_sdk_url }}
