# Temporary diagnostic branch only. The normal main/PR workflow is unchanged.
name: Failed-node GDR environment audit
run-name: Read-only peermem audit of 16 machines from Run 45191076117
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdr-node-audit-45191076117
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 't-head/pccl'
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the existing authorized cluster CLI
        shell: bash
        run: |
          set -euo pipefail
          if test -x /opt/bin/kubectl; then
            echo /opt/bin >> "$GITHUB_PATH"
            export PATH=/opt/bin:$PATH
          fi
          command -v kubectl
          kubectl auth can-i get nodes
          kubectl auth can-i create pods -n ppu-sched
      - name: Read kernel module state using CPU-only, nonprivileged probes
        run: |
          python3 tests/diagnostics/gdr/node_audit.py \
            --run-id '${{ github.run_id }}' --namespace ppu-sched --output audit --timeout 180
      - name: Preserve read-only diagnostic evidence on NAS
        if: always()
        run: |
          root=/wl_nas/devops/pccl-gdr-audit-${{ github.run_id }}-${{ github.run_attempt }}
          mkdir -p "$root"
          if test -d audit; then cp -a audit/. "$root/"; fi
      - name: Upload node audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdr-failed-node-audit
          path: audit
          if-no-files-found: warn
