name: source-derived sanity

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: source-sanity-single-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P
  VALIDATION_CARDS: '8'
  PCCL_TESTS_REVISION: 394556512e87259e9ffa25225632c46b0a0bbcd5

jobs:
  precheck:
    name: Pre-check (Secret Scan)
    if: >-
      github.event_name == 'pull_request' && github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  commit-checks:
    name: Pre-check (Commit Message & DCO)
    if: >-
      github.event_name == 'pull_request' && github.repository == 't-head/pccl'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check contribution commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          head_sha = os.environ['HEAD_SHA']
          parents = git('show', '-s', '--format=%P', os.environ['GITHUB_SHA']).split()
          if len(parents) != 2 or parents[1] != head_sha:
              sys.exit('Test merge does not match the PR head; start a new checkin run.')
          # The event base SHA can lag behind the base already included in this test merge.
          commits = git('rev-list', parents[0] + '..' + head_sha).splitlines()
          errors = []
          for sha in commits:
              message = git('show', '-s', '--format=%B', sha)
              lines = message.splitlines()
              if not lines or not lines[0].strip():
                  errors.append(f'{sha[:12]}: title must not be empty')
              elif len(lines[0]) > 50:
                  print(f'::notice::{sha[:12]}: title exceeds the recommended 50 characters; consider shortening it')
              if len(lines) > 1 and lines[1] != '':
                  errors.append(f'{sha[:12]}: second line must be blank')
              issue_ref = r'(?i:\b(?:Refs|Closes|Fixes))[ \t]+(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[1-9][0-9]*\b|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[1-9][0-9]*\b'
              if not re.search(issue_ref, '\n'.join(lines[1:])):
                  errors.append(f'{sha[:12]}: missing issue reference in commit body')

              trailers = subprocess.check_output(
                  ['git', 'interpret-trailers', '--parse', '--no-divider'], input=message, text=True).splitlines()
              signoffs = [match.groups() for line in trailers
                          if (match := re.fullmatch(
                              r'Signed-off-by: (\S(?:.*\S)?) <([^<>\s]+@[^<>\s]+)>', line))]
              author = tuple(git('show', '-s', '--format=%an%x00%ae', sha).rstrip('\n').split('\0'))
              if not signoffs:
                  errors.append(f'{sha[:12]}: missing valid Signed-off-by trailer')
              elif author not in signoffs:
                  errors.append(f'{sha[:12]}: Signed-off-by name and email must match the commit author')
          for error in errors:
              print(error)
          print(f'Checked {len(commits)} contribution commits for message format and DCO.')
          sys.exit(bool(errors))
          PY

  prepare:
    name: Validate CSV and artifact cache contracts
    needs: [precheck, commit-checks]
    if: >-
      always() &&
      (needs.precheck.result == 'success' || needs.precheck.result == 'skipped') &&
      (needs.commit-checks.result == 'success' || needs.commit-checks.result == 'skipped') &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test executors and validate real selections
        working-directory: pccl
        run: |
          python3 -S -B -W error::ResourceWarning -m unittest discover \
            -s tests/xtest -p 'test_run_cases.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_artifact_cache.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_reconcile_results.py' -v
          python3 -S -B -m unittest discover -s tests/xtest -p 'test_workflow_contract.py' -v
          python3 -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'tests/xtest')
          import reconcile_results
          from artifact_cache import PCCL_TESTS_REVISION, RUNNER_HASHES

          runner = Path('../pccl-tests').resolve()
          revision = subprocess.check_output(['git', '-C', str(runner), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == PCCL_TESTS_REVISION == os.environ['PCCL_TESTS_REVISION']
          for name, expected in RUNNER_HASHES.items():
              assert hashlib.sha256((runner / name).read_bytes()).hexdigest() == expected
          metadata = json.loads(Path('tests/xtest/minimal-csv/export.json').read_text())
          assert metadata['runner_revision'] == revision
          selections = reconcile_results.load_selections(
              Path('tests/xtest/minimal-csv'), int(os.environ['VALIDATION_CARDS']))
          expected = {'standard': 71, 'cluster': 1, 'notsm': 37}
          for name, count in expected.items():
              selected = selections[name]
              assert len(selected['cases']) == count
              print(f'{name} selection: {count} Cases')
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          PY
      - name: Stage the pinned benchmark dependency
        run: |
          mkdir -p deps
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest deps filelock==3.20.3
          printf '%s  %s\n' \
            '4b0dda527ee31078689fc205ec4f1c1bf7d56cf88b6dc9426c4f230e46c2dce1' \
            'deps/filelock-3.20.3-py3-none-any.whl' | sha256sum --check -
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-csv-artifact-python-deps
          path: deps/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: [precheck, commit-checks]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: [prepare, ai-code-review]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 't-head/pccl'
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  build-standard:
    name: Build and upload standard
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Build standard output
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_standard
            STAGING=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
            RUN_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}
            mkdir -p "$build_output" "$STAGING"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/build.sh
            tar -czf "$STAGING/output_standard.tar.gz" -C /workspace/source output_standard
            sha256sum "$STAGING/output_standard.tar.gz" > "$STAGING/output_standard.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/tests/xtest/artifact_cache.py" create \
              --archive "$STAGING/output_standard.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile standard --output "$STAGING/output_standard.build.json"
            chmod -R a+rwX "$RUN_ROOT"
      - id: identity
        name: Validate the standard artifact before upload
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard
        run: |
          EXPECTED_SHA=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["STAGING"], "output_standard.build.json")))["artifact_sha256"])')
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$STAGING" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 "$EXPECTED_SHA"
          echo "artifact_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pccl-build-standard
          path: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Remove transient standard NAS staging
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/standard')
          PY

  build-notsm:
    name: Build and upload notsm
    needs: [prepare, human-review]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: t-head/pccl-tests
          ref: ${{ env.PCCL_TESTS_REVISION }}
          path: pccl-tests
          persist-credentials: false
      - name: Build notsm output
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: on_success
          command: |
            set -euo pipefail
            cd /workspace/source
            export source_home=/workspace/source
            export build_output=/workspace/source/output_notsm
            STAGING=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm
            RUN_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}
            mkdir -p "$build_output" "$STAGING"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            bash pccl/.github/workflows/scripts/notsm_build.sh
            tar -czf "$STAGING/output_notsm.tar.gz" -C /workspace/source output_notsm
            sha256sum "$STAGING/output_notsm.tar.gz" > "$STAGING/output_notsm.tar.gz.sha256"
            python3 -S -B "$build_output/pccl/tests/xtest/artifact_cache.py" create \
              --archive "$STAGING/output_notsm.tar.gz" \
              --pccl-revision "$(git -C "$build_output/pccl" rev-parse HEAD)" \
              --pccl-tests-revision "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" \
              --profile notsm --output "$STAGING/output_notsm.build.json"
            chmod -R a+rwX "$RUN_ROOT"
      - id: identity
        name: Validate the notsm artifact before upload
        env:
          STAGING: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm
        run: |
          EXPECTED_SHA=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["STAGING"], "output_notsm.build.json")))["artifact_sha256"])')
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$STAGING" --profile notsm \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 "$EXPECTED_SHA"
          echo "artifact_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pccl-build-notsm
          path: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Remove transient notsm NAS staging
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/staging/notsm')
          PY

  stage-cache:
    name: Stage ${{ matrix.profile }} from artifact or valid NAS cache
    needs: [build-standard, build-notsm]
    if: >-
      !cancelled() && needs.build-standard.result == 'success' &&
      needs.build-notsm.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, notsm]
    env:
      EXPECTED_SHA: ${{ matrix.profile == 'standard' && needs.build-standard.outputs.artifact_sha256 || needs.build-notsm.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - id: cache
        name: Check for a valid NAS cache
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./pccl/.github/actions/download-artifact-retry
        if: steps.cache.outputs.state == 'miss'
        with:
          name: pccl-build-${{ matrix.profile }}
          path: download
      - name: Publish the validated artifact to NAS
        if: steps.cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py publish \
            --download download --cache "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Confirm the final NAS cache
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          chmod -R a+rwX "$CACHE_DIR"
          python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'

  single-node:
    name: Single-node CSV (${{ matrix.profile }})
    needs: [prepare, human-review, build-standard, build-notsm, stage-cache]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      needs.build-standard.result == 'success' && needs.build-notsm.result == 'success' &&
      needs.stage-cache.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, notsm]
    env:
      EXPECTED_SHA: ${{ matrix.profile == 'standard' && needs.build-standard.outputs.artifact_sha256 || needs.build-notsm.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: ./pccl/.github/actions/download-artifact-retry
        with:
          name: minimal-csv-artifact-python-deps
          path: deps
      - id: build-cache
        name: Check the NAS cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./pccl/.github/actions/download-artifact-retry
        if: steps.build-cache.outputs.state == 'miss'
        with:
          name: pccl-build-${{ matrix.profile }}
          path: build-download
      - name: Restore a cleaned NAS cache from the build artifact
        if: steps.build-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py publish \
            --download build-download --cache "$CACHE_DIR" --profile '${{ matrix.profile }}' \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Restore the NAS cache and run single-node Cases
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          nnodes: 0
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          command: |
            set -euo pipefail
            umask 022
            cd /workspace/source
            export build_output=/workspace/source/output_${{ matrix.profile }}
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/${{ matrix.profile }}/${{ env.EXPECTED_SHA }}
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/${{ matrix.profile }}
            rm -rf "$RESULT_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")"
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'
            python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile '${{ matrix.profile }}' \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            tar -xzf "$CACHE_DIR/output_${{ matrix.profile }}.tar.gz" -C /workspace/source
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-env
            /workspace/minimal-csv-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links /workspace/source/deps \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            /workspace/minimal-csv-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$build_output/pccl/tests/xtest/minimal-csv" \
              --profile '${{ matrix.profile }}' --nodes 1 \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --build-record "$CACHE_DIR/output_${{ matrix.profile }}.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"

  two-node:
    name: Two-node master-only CSV (16 ranks)
    needs: [prepare, human-review, build-standard, stage-cache]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.human-review.result == 'success' ||
        (github.event_name != 'pull_request' && needs.human-review.result == 'skipped')) &&
      needs.build-standard.result == 'success' && needs.stage-cache.result == 'success'
    env:
      EXPECTED_SHA: ${{ needs.build-standard.outputs.artifact_sha256 }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - uses: ./pccl/.github/actions/download-artifact-retry
        with:
          name: minimal-csv-artifact-python-deps
          path: deps
      - id: build-cache
        name: Check the NAS cache before hardware allocation
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          if python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
            --directory "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'; then
            echo 'state=hit' >> "$GITHUB_OUTPUT"
          else
            echo 'state=miss' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./pccl/.github/actions/download-artifact-retry
        if: steps.build-cache.outputs.state == 'miss'
        with:
          name: pccl-build-standard
          path: build-download
      - name: Restore a cleaned NAS cache from the build artifact
        if: steps.build-cache.outputs.state == 'miss'
        env:
          CACHE_DIR: /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py publish \
            --download build-download --cache "$CACHE_DIR" --profile standard \
            --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
            --expected-sha256 '${{ env.EXPECTED_SHA }}'
      - name: Restore the shared NAS cache and run on master
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: 2
          nproc_per_node: ${{ env.VALIDATION_CARDS }}
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 300
          cleanup_policy: always
          container_options: |
            privileged: true
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            test -d /dev/infiniband
            test -r /proc/net/route
            set -- /dev/infiniband/*
            test -e "$1"
          command: |
            set -euo pipefail
            umask 022
            cd "$SOURCE_DIR"
            CACHE_DIR=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/cache/standard/${{ env.EXPECTED_SHA }}
            SHARED_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/shared-standard/${{ env.EXPECTED_SHA }}
            export build_output="$SHARED_ROOT/output_standard"
            RESULT_ROOT=/mnt/wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results/cluster
            rm -rf "$RESULT_ROOT" "$SHARED_ROOT"
            mkdir -p "$(dirname "$RESULT_ROOT")" "$SHARED_ROOT"
            cleanup_shared_build() {
              rm -rf "$SHARED_ROOT"
            }
            trap cleanup_shared_build EXIT
            unset PIP_INDEX_URL PIP_EXTRA_INDEX_URL 2>/dev/null || true
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory "$SOURCE_DIR"
            git config --global --add safe.directory '*'
            python3 -S -B pccl/tests/xtest/artifact_cache.py validate \
              --directory "$CACHE_DIR" --profile standard \
              --pccl-revision '${{ github.sha }}' --pccl-tests-revision '${{ env.PCCL_TESTS_REVISION }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}'
            tar -xzf "$CACHE_DIR/output_standard.tar.gz" -C "$SHARED_ROOT"
            test "$(git -C "$build_output/pccl" rev-parse HEAD)" = '${{ github.sha }}'
            test "$(git -C "$build_output/pccl-tests" rev-parse HEAD)" = '${{ env.PCCL_TESTS_REVISION }}'
            python3 -m venv /workspace/minimal-csv-cluster-env
            /workspace/minimal-csv-cluster-env/bin/python -m pip install --disable-pip-version-check \
              --no-index --find-links "$SOURCE_DIR/deps" \
              -r "$build_output/pccl/tests/xtest/requirements.txt"
            /workspace/minimal-csv-cluster-env/bin/python -m pip check
            source /usr/local/PPU_SDK/envsetup.sh
            unset PCCL_PATH
            export OMPI_MCA_plm_rsh_agent=cluster-ssh
            export OMPI_MCA_orte_base_help_aggregate=0
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            echo "MPI TCP interface: $MPI_INTERFACE"
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            /workspace/minimal-csv-cluster-env/bin/python -B \
              "$build_output/pccl/tests/xtest/run_cases.py" \
              --input "$build_output/pccl/tests/xtest/minimal-csv" \
              --profile standard --nodes 2 \
              --test-root "$build_output" \
              --binary-dir "$build_output/pccl-tests/build" \
              --hostfile "$CLUSTER_HOSTS_FILE" \
              --mpi-interface "$MPI_INTERFACE" \
              --build-record "$CACHE_DIR/output_standard.build.json" \
              --pccl-revision '${{ github.sha }}' \
              --expected-sha256 '${{ env.EXPECTED_SHA }}' \
              --output "$RESULT_ROOT"

  results:
    name: Reconcile hardware results and clean NAS
    needs: [precheck, commit-checks, prepare, ai-code-review, human-review, build-standard, build-notsm, stage-cache, single-node, two-node]
    if: >-
      always() && needs.prepare.result == 'success' &&
      github.repository == 't-head/pccl' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.event_name != 'pull_request' ||
        (needs.precheck.result == 'success' && needs.commit-checks.result == 'success' &&
         needs.ai-code-review.result == 'success' && needs.human-review.result == 'success'))
    permissions:
      contents: read
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          path: pccl
          persist-credentials: false
      - id: reconcile
        name: Reconcile all selected hardware results
        run: |
          python3 -S -B pccl/tests/xtest/reconcile_results.py \
            --input pccl/tests/xtest/minimal-csv \
            --results /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }}/results \
            --public public-results \
            --pccl-revision '${{ github.sha }}' \
            --standard-sha256 '${{ needs.build-standard.outputs.artifact_sha256 }}' \
            --notsm-sha256 '${{ needs.build-notsm.outputs.artifact_sha256 }}' \
            --cards-per-node '${{ env.VALIDATION_CARDS }}'
      - uses: actions/upload-artifact@v4
        if: always() && steps.reconcile.outcome == 'success'
        with:
          name: single-node-source-sanity-results
          path: public-results/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - id: cleanup
        name: Remove run-owned NAS build artifacts
        if: always() && steps.checkout.outcome == 'success'
        run: |
          python3 -S -B pccl/tests/xtest/artifact_cache.py cleanup \
            --root /wl_nas/devops/pccl-artifact-cache-${{ github.run_id }} \
            --run-id '${{ github.run_id }}'

  summary:
    name: PCCL Tests Gate
    needs: [precheck, commit-checks, prepare, ai-code-review, human-review, build-standard, build-notsm, stage-cache, single-node, two-node, results]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: support
        name: Reject unsupported repository or event
        shell: bash
        env:
          SUPPORTED: >-
            ${{
            github.repository == 't-head/pccl' &&
            (github.event_name == 'pull_request' ||
             github.event_name == 'workflow_dispatch' || github.event_name == 'push')
            }}
        run: |
          if [ "$SUPPORTED" != 'true' ]; then
            echo '::error::source-sanity supports same-repository pull requests, main pushes and manual dispatch only.'
            exit 1
          fi
      - name: Require successful results, cleanup and all prerequisite jobs
        if: always() && steps.support.outcome == 'success'
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS'])
          failed = {name: value['result'] for name, value in needs.items()
                    if value['result'] not in ('success', 'skipped')}
          if os.environ['EVENT_NAME'] == 'pull_request':
              for name in ('precheck', 'commit-checks', 'ai-code-review', 'human-review'):
                  if needs[name]['result'] != 'success':
                      failed[name] = needs[name]['result']
          for name in ('prepare', 'build-standard', 'build-notsm', 'stage-cache', 'single-node', 'two-node', 'results'):
              if needs[name]['result'] != 'success':
                  failed[name] = needs[name]['result']
          for name, result in failed.items():
              print(f'::error::{name}: {result}')
          sys.exit(bool(failed))
          PY
