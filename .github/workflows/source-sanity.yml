              exit 1 ;;
          esac
      - uses: t-head/pccl/.github/actions/download-artifact-retry@42c06876282e700ae0434b4577fedd757b6f2db1
        if: steps.cache.outputs.state == 'miss'
        with:
          name: pccl-build-${{ matrix.profile }}
          path: download
          sha256-file: output_${{ matrix.profile }}.tar.gz
