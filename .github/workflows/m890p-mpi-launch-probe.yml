name: M890P MPI launch probe

on:
  push:
    branches: [experiment/m890p-host-runtime]
    paths: [.github/workflows/m890p-mpi-launch-probe.yml]

permissions:
  contents: read

concurrency:
  group: m890p-mpi-launch-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  VALIDATION_NODE_SELECTOR: board-type=ZW-M890P

jobs:
  launch:
    name: Two-node hostname launch without PCCL
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    steps:
      - name: Compare MPI data and control network settings
        uses: t-head/ci-infra/cluster-run@40165c945cba33ac7b16b41c4485fe53b68f581f
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          launch_mode: master
          nnodes: 2
          nproc_per_node: 8
          node_selector: ${{ env.VALIDATION_NODE_SELECTOR }}
          namespace: ppu-sched
          timeout_minutes: 30
          cleanup_policy: always
          container_options: |
            privileged: true
            host_network: true
            dns_policy: ClusterFirstWithHostNet
          host_volumes: /dev/infiniband:/dev/infiniband
          setup_command: |
            set -euo pipefail
            source /usr/local/PPU_SDK/envsetup.sh
            export PROBE_DISPLAY=${DISPLAY-}
            export PROBE_XAUTHORITY=${XAUTHORITY-}
            export PROBE_DISPLAY_SET=${DISPLAY+x}
            export PROBE_XAUTHORITY_SET=${XAUTHORITY+x}
            printf 'DISPLAY before cleanup: %s\n' "${DISPLAY-<unset>}"
            printf 'XAUTHORITY before cleanup: %s\n' "${XAUTHORITY-<unset>}"
            unset DISPLAY XAUTHORITY
            ulimit -l unlimited
            ulimit -s 65536
            command -v mpirun
            mpirun --version
            ompi_info --parsable --all | grep -E 'oob_tcp_if_include|btl_tcp_if_include|plm_rsh_agent' || true
            if ! command -v strace >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends strace
            fi
            strace -V
          command: |
            set -uo pipefail
            export OMPI_MCA_orte_base_help_aggregate=0
            unset OMPI_MCA_btl_tcp_if_include OMPI_MCA_oob_tcp_if_include
            MPI_INTERFACE=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
            test -n "$MPI_INTERFACE"
            echo "Default-route interface: $MPI_INTERFACE"
            hostname -I
            cat /proc/net/route
            test "$(wc -l < "$CLUSTER_HOSTS_FILE")" -eq 2
            while read -r host _; do
              echo "Checking $host"
              getent hosts "$host"
              timeout -k 5s 30s cluster-ssh "$host" \
                'hostname; command -v orted; mpirun --version' < /dev/null || exit 1
            done < "$CLUSTER_HOSTS_FILE"

            cat > /tmp/cluster-ssh-trace <<'EOF'
            #!/bin/bash
            {
              printf '%s' "$(date -Is)"
              printf ' %q' "$@"
              printf '\n'
            } >> /tmp/cluster-ssh-trace.log
            exec /run/cluster/bin/cluster-ssh "$@"
            EOF
            chmod 755 /tmp/cluster-ssh-trace
            : > /tmp/cluster-ssh-trace.log
            export OMPI_MCA_plm_rsh_agent=/tmp/cluster-ssh-trace

            snapshot_processes() {
              echo 'Relevant master processes:'
              ps -eo pid,ppid,stat,wchan:28,args | \
                grep -E '(mpirun|orted|cluster-ssh|/usr/bin/ssh|timeout -k)' | grep -v grep || true
              echo 'Recorded launcher calls:'
              cat /tmp/cluster-ssh-trace.log
              for mpi_pid in $(ps -eo pid=,comm= | awk '$2 == "mpirun" {print $1}'); do
                awk '$6 ~ /^\// {print $6}' "/proc/$mpi_pid/maps" 2>/dev/null
              done | sort -u | grep -E 'libX|libxcb|libuc|libverbs|libopen|libpmix' || true
            }
            run_probe() {
              local name=$1
              shift
              local log="/tmp/${name}.log"
              : > "$log"
              echo "Starting $name: $*"
              "$@" > "$log" 2>&1 &
              local pid=$!
              sleep 5
              snapshot_processes
              wait "$pid"
              local rc=$?
              echo "Output from $name:"
              cat "$log"
              echo "$name exit status: $rc"
              test "$rc" -eq 0
            }

            overall=0
            if test "$PROBE_DISPLAY_SET" = x; then export DISPLAY=$PROBE_DISPLAY; else unset DISPLAY; fi
            if test "$PROBE_XAUTHORITY_SET" = x; then export XAUTHORITY=$PROBE_XAUTHORITY; else unset XAUTHORITY; fi
            run_probe local-connect-stack \
              timeout -k 2s 12s strace -f -tt -k -e trace=connect -s 200 \
              -o /tmp/connect.strace \
              mpirun --allow-run-as-root --tag-output -np 1 hostname || overall=1
            echo 'Local connection call stacks:'
            cat /tmp/connect.strace
            if run_probe local-without-display \
              timeout -k 2s 12s env -u DISPLAY -u XAUTHORITY \
              mpirun --allow-run-as-root --tag-output -np 1 hostname; then
              run_probe dual-without-display \
                timeout -k 2s 25s env -u DISPLAY -u XAUTHORITY \
                mpirun --allow-run-as-root --tag-output \
                --hostfile "$CLUSTER_HOSTS_FILE" -np 2 -npernode 1 \
                --mca oob_tcp_if_include "$MPI_INTERFACE" hostname || overall=1
            else
              overall=1
            fi
            exit "$overall"
