name: "pccl checkin test"

triggers:
  merge_request:
    target-branches:
      - master
    types:
      - opened

params:
  comm_internal_testbox_ref:
    type: string
    default: "master"
    description: "comm-internal-testbox checkout ref"
  comm_toolbox_ref:
    type: string
    default: "master"
    description: "comm-toolbox checkout ref"
  pccl_tests_ref:
    type: string
    default: "master"
    description: "pccl-tests checkout ref"

jobs:
  ubuntu24_hggcrt13_test:
    name: "ubuntu24_hggcrt13_test"
    image: "reg.docker.alibaba-inc.com/ai-tmp/pytorch:ubuntu24.04-py312.06"
    timeout: 12h
    runs-on:
      - 32-128Gi
      - amd64
    outputs:
      oss_url: ${{steps.artifact.outputs.oss_url}}
    steps:
      - uses: checkout
        inputs:
          repository-url: 'git@gitlab.alibaba-inc.com:PPU-comm-open-source/pccl.git'
          path: '/aoneci/runner/work/source/pccl'
          ssh-key: ${{secrets.private_ssh_key}}
      - uses: checkout
        inputs:
          repository-url: 'git@gitlab.alibaba-inc.com:PPU-comm/comm-internal-testbox.git'
          ref: '${{pipeline.inst.triggerMode == "MANUAL" ? params.comm_internal_testbox_ref : "master"}}'
          path: '/aoneci/runner/work/source/comm-internal-testbox'
          ssh-key: ${{secrets.private_ssh_key}}
      - uses: checkout
        inputs:
          repository-url: 'git@gitlab.alibaba-inc.com:PPU-comm/comm-toolbox.git'
          ref: '${{pipeline.inst.triggerMode == "MANUAL" ? params.comm_toolbox_ref : "master"}}'
          path: '/aoneci/runner/work/source/comm-toolbox'
          ssh-key: ${{secrets.private_ssh_key}}
      - uses: checkout
        inputs:
          repository-url: 'git@gitlab.alibaba-inc.com:PPU-comm-open-source/pccl-tests.git'
          ref: '${{pipeline.inst.triggerMode == "MANUAL" ? params.pccl_tests_ref : "master"}}'
          path: '/aoneci/runner/work/source/pccl-tests'
          ssh-key: ${{secrets.private_ssh_key}}
      - id: ubuntu24_hggcrt13_build
        timeout: 5h
        run: |
          echo "---------------------"
          export source_home=$AONE_CI_SOURCE
          export build_output=$AONE_CI_SOURCE/output_hggcrt13
          mkdir -p $build_output
          echo $PWD
          echo $AONE_CI_SOURCE
          ls
          cd /aoneci/runner/work/source/
          ls
          ls /aoneci/runner/work/source/pccl/
          cp /aoneci/runner/work/source/pccl/.aoneci/script/ubuntu24_hggcrt13_build.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_composite_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_cuda_graph_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_copyengine_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_register_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_customAllreduce_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_memcpy_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_nonblocking_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_commabort_test.sh ./
          cp /aoneci/runner/work/source/pccl/.aoneci/test/run_lsa_test.sh ./
          source ubuntu24_hggcrt13_build.sh
          ls ${build_output}
      - id: package
        name: pack
        run: |
          ls
          echo "---------------------"
          tar -zcvf output_hggcrt13.tar.gz $AONE_CI_SOURCE/output_hggcrt13/*
          echo "---------------------"
          ls $AONE_CI_SOURCE/output_hggcrt13/*
      - uses: upload-oss
        inputs:
          path: output_hggcrt13.tar.gz
          retention-days: 1
      - id: artifact
        run: |
          echo ${{ #array(steps.upload-oss.outputs.result)[0].remote }} > ${{outputs.oss_url.path}}

  composite_test_hggcrt13:
    name: "composite_test_hggcrt13"
    image: "reg.docker.alibaba-inc.com/ai-tmp/pytorch:ubuntu24.04-py312.06"
    timeout: 12h
    runs-on:
      - 32-128Gi
      - amd64
    needs:
      - ubuntu24_hggcrt13_test
    steps:
      - uses: ptg-ai-test
        inputs:
          ppu: 2
          run_image: reg.docker.alibaba-inc.com/ai-tmp/pytorch:ubuntu24.04-py312.06
          cmd: cd ./aoneci/runner/work/source/output_hggcrt13; ls; find -name "run_composite_test.sh"; export TEST_ROOT=`pwd`; bash $TEST_ROOT/pccl/.aoneci/test/run_composite_test.sh
          labels: OAM-810E
          image_url: ${{jobs.ubuntu24_hggcrt13_test.outputs.oss_url}}
          timeout: 10800

  cuda_graph_test_hggcrt13:
